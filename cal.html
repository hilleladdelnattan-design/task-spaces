<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a55d0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="משימות">
<meta name="application-name" content="לוח משימות">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>לוח משימות</title>
<style>
:root{--bg:#f7f8fc;--surface:#fff;--ink:#1b1d2a;--muted:#6f748a;--line:#e8eaf3;--accent:#4a55d0;--accent-soft:#eceefe;--tint:#f2f3fa;--green:#16a34a;--green-soft:#e7f7ed;--red:#e03131;--redtxt:#c4524d;--red-soft:#fdeeee;--shadow:0 10px 40px rgba(20,24,60,.22);--r:16px;--half:48px}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--surface:#1b1d28;--ink:#eceef7;--muted:#9aa0b8;--line:#2a2d3c;--accent:#8a94ff;--accent-soft:#262a4a;--tint:#232536;--green:#3ddc84;--green-soft:#17301f;--red:#ff5c5c;--redtxt:#ee8a86;--red-soft:#3a2024;--shadow:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit;touch-action:manipulation}
input{font-size:16px}
button{cursor:pointer}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.wrap{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.arr{width:44px;height:44px;border:none;background:none;font-size:24px;line-height:1;color:var(--muted);border-radius:12px;flex:none}
.arr:active{background:var(--tint)}
.tlink{border:none;background:none;color:var(--accent);font-weight:600;padding:10px 6px;height:44px}
.pbtn{height:44px;padding:0 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:600}
.pbtn.sm{height:40px;padding:0 14px;font-size:15px}
.gbtn{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.gbtn.sm{height:40px;padding:0 14px;font-size:15px}
.dbtn{height:44px;padding:0 18px;border-radius:999px;border:none;background:var(--red);color:#fff;font-weight:600}
.mtop{display:flex;align-items:center}
.mtitle{flex:1;text-align:center;font-size:20px;font-weight:700;margin:0}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.cal{padding:2px 0}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow div{text-align:center;color:var(--muted);font-size:12px;padding:2px 0 5px}
.cell{min-height:66px;border:none;border-radius:11px;padding:3px 2px;background:var(--surface);display:flex;flex-direction:column;gap:1px;text-align:start;width:100%;overflow:hidden}
.cell.empty{background:none;cursor:default}
.cell.sel{background:var(--accent-soft)}
.cell{position:relative;transition:transform .14s ease,box-shadow .14s ease,background-color .14s ease}
.cell.over{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft);transform:scale(1.09);z-index:5;box-shadow:0 6px 18px rgba(20,24,60,.28)}
.cell .t[data-tid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media(prefers-reduced-motion:reduce){.cell{transition:none}}
.gsec.over,.ngen.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.cell .n{font-size:12px;color:var(--muted);padding:0 3px;min-width:22px;height:22px;line-height:22px;align-self:flex-start;text-align:center}
.cell.today .n{background:var(--accent);color:#fff;font-weight:800;border-radius:999px}
.cell .t{font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.cell .t.bad{color:var(--redtxt)}
.cell .t.ok{color:var(--green);font-weight:600}
.cell .more{font-size:10px;line-height:1.15;color:var(--accent);font-weight:700;padding:0 3px;overflow:hidden}
@media(min-width:640px){.wrap{max-width:900px}.cell{min-height:100px;padding:6px 5px}.cell .t{font-size:12px}.cell .more{font-size:11.5px}}
/* סיכום היום הנבחר בלוח */
.dpanel{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.dpanel h2{margin:0;font-size:17px}
.dpanel .dsum{margin:0;text-align:start}
.dpanel .btns{display:flex;gap:8px;flex-wrap:wrap}
.dpanel .btns>*{flex:1 1 130px}
/* משימות כלליות */
.gsec{margin-top:14px;background:var(--surface);border-radius:16px;padding:10px 10px 12px}
.gsec .gh{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.gsec .gh b{flex:1;font-size:15px}
.gsec .none{color:var(--muted);font-size:14px;padding:6px 4px}
.gl2{display:flex;flex-direction:column;gap:3px}
/* מסך יום */
.dtop{display:flex;align-items:center;justify-content:space-between}
.dnav{display:flex;align-items:center;margin-top:2px}
.dtitle{flex:1;text-align:center}
.dtitle h1{margin:0;font-size:22px}
.dtitle small{display:block;color:var(--muted);font-size:13px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;font-weight:600;vertical-align:middle}
.dsum{text-align:center;color:var(--muted);margin:2px 0 10px;font-size:14px}
.tl{position:relative;margin-bottom:84px}
.gline{position:absolute;right:0;left:0;height:0;border-top:1px solid var(--line)}
.gline.half{border-top-style:dashed}
.gline .st{position:absolute;right:0;top:3px;width:46px;font-size:12px;color:var(--muted);direction:ltr;text-align:right;unicode-bidi:isolate}
.gline.half .st{opacity:.55}
.gline.hr .st{font-weight:700;color:var(--ink);opacity:.8}
.lane{position:absolute;top:0;bottom:0;right:52px;left:0}
.dind{position:absolute;right:0;left:0;background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px;pointer-events:none;z-index:4;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;font-size:13px;font-weight:700;color:var(--accent)}
.nt{position:sticky;bottom:0;margin-top:14px;background:var(--surface);border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-height:40vh;overflow:auto;box-shadow:0 -6px 20px rgba(20,24,60,.08);z-index:6}
.ntn.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}
.nth{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.nth span{flex:1}
.nt .none{color:var(--muted);font-size:13px;padding:2px 0}
.nt .ns{display:flex;flex-direction:column;gap:3px}
.ngen{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.tk{display:flex;align-items:flex-start;gap:2px;border-radius:12px;background:var(--tint);position:relative}
.tk.lifted{opacity:.35}
.tk.blk{position:absolute;z-index:auto;overflow:visible;border-right:3px solid var(--accent)}
.tk.blk.done{border-right-color:var(--green)}
.tk.blk.missed{border-right-color:var(--red)}
.tk.blk .tkbody{padding:6px 0 4px;max-height:100%;overflow:hidden}
.tk.blk.one .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.blk .chk{width:40px;height:40px}
.tk.blk.narrow .meta,.tk.blk.narrow .mvlink{display:none}
.tk.blk.narrow .kebab{display:none}
.tk.blk.narrow .chk{width:34px}
.tk.blk.narrow .chk i{width:20px;height:20px;border-radius:6px;font-size:13px}
.tk.blk.narrow .tkbody{padding:4px 2px 3px 0}
.tk.blk.narrow .tt,.tk.blk.narrow.one .tt{font-size:13px;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:none;padding:0}
.chk i{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1;font-weight:900}
.tk.done .chk i{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tk.missed .chk i{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tkbody{flex:1;min-width:0;padding:10px 0 8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}
.tt{font-size:16px;word-break:break-word}
.tk.done .tt{color:var(--green);font-weight:600}
.tk.missed .tt{color:var(--redtxt)}
.meta{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.3}
.meta.bad{color:var(--redtxt)}
.mvlink{border:none;background:none;color:var(--redtxt);text-decoration:underline;padding:6px 0 2px;font-size:13.5px}
.kebab{width:36px;height:44px;flex:none;border:none;background:none;font-size:20px;color:var(--muted);opacity:.7;padding:0}
.hd{position:absolute;width:60px;height:28px;display:grid;place-items:center;touch-action:none;cursor:ns-resize;z-index:5;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.hd.t{top:-16px;right:22%}
.hd.b{bottom:-16px;left:22%}
.hd::after{content:"";width:34px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.tk.blk.narrow .hd{width:min(44px,calc(50% - 5px))}
.tk.blk.narrow .hd.t{right:2px}
.tk.blk.narrow .hd.b{left:2px}
.gline.cmp .st{font-size:11px;opacity:.6;top:4px}
.gline.hr.cmp .st{font-weight:600}
.gline.cmp{border-top-color:var(--line)}
.tk .det{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk.blk.one .det,.tk.blk.narrow .det{display:none}
.dta{display:block;width:100%;min-height:76px;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
.vtitle{font-size:19px;font-weight:700;margin:4px 0 2px;word-break:break-word}
.vdet{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;max-height:50vh;overflow:auto}
.ghost{position:fixed;z-index:95;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;left:0;top:0}
.foot{text-align:center;margin-top:16px}
.ver{color:var(--muted);font-size:12px;opacity:.7}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:10px}
#net{position:fixed;top:0;right:0;left:0;z-index:99;background:#7a4b00;color:#fff;text-align:center;font-size:13px;padding:calc(4px + env(safe-area-inset-top)) 10px 4px;display:none}
body.offline #net{display:block}
body.offline .wrap{padding-top:calc(34px + env(safe-area-inset-top))}
/* יעדים */
.goals .none{color:var(--muted);font-size:14px;padding:6px 4px}
.goals>.note{margin:8px 4px 0}
.gcard{background:var(--tint);border-radius:14px;padding:8px 12px 10px;margin-top:8px}
.gcard.arch{opacity:.75}
.gctop{display:flex;align-items:center;gap:8px}
.gname{flex:1;text-align:start;border:none;background:none;font-weight:700;font-size:16px;padding:6px 0;min-height:40px}
.gname small{font-weight:500;color:var(--muted);margin-inline-start:8px;font-size:12px}
.gbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 6px}
.gbar.big{height:12px;margin:8px 0}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.gbar.full i{background:var(--green)}
.gmeta{font-size:13.5px;color:var(--muted)}
.gmeta b{color:var(--ink)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchip{min-height:40px;padding:0 14px;border-radius:999px;border:1px dashed var(--accent);background:var(--surface);color:var(--accent);font-weight:600;font-size:14px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.gchip.solid{border-style:solid}
.ntgoals{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.gscr .gtitle{margin:6px 0 0;font-size:24px;word-break:break-word}
.gsub{color:var(--muted);font-size:14px;margin-top:2px}
.gdesc{margin-top:8px;white-space:pre-wrap;word-break:break-word}
.gcur{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px}
.gcl{font-size:13px;color:var(--muted);font-weight:600}
.gbig{font-size:26px;font-weight:800}
.gplan{color:var(--muted);margin-top:2px}
.gok{color:var(--green);font-weight:700;margin-top:6px}
.gsecn{background:var(--surface);border-radius:16px;padding:10px 12px 12px;margin-top:12px}
.gsecn h2{margin:0 0 6px;font-size:16px}
.gsecn h3{margin:12px 0 0;font-size:14px;color:var(--muted)}
.gupd{display:flex;gap:8px;margin-top:8px}
.gupd .pbtn{flex:1}
.gupd .gbtn:only-child{flex:1}
.stbl{width:100%;border-collapse:collapse;font-size:14px}
.stbl th{color:var(--muted);font-weight:600;text-align:start;padding:2px 4px}
.stbl td{padding:6px 4px;border-top:1px solid var(--line)}
.arow{display:flex;align-items:flex-start;gap:8px;margin-top:6px}
.arow .adate{flex:none;width:46px;padding-top:12px;font-size:13px;color:var(--muted);text-align:start;border:none;background:none;direction:ltr;unicode-bidi:isolate}
.arow .agrow{flex:1;min-width:0}
.arow .agrow .tk{display:flex}
.lrow{flex:1;display:flex;align-items:flex-start;gap:6px;background:var(--tint);border-radius:12px;padding:8px 4px 8px 0;min-width:0}
.lrow .lok{width:44px;flex:none;text-align:center;color:var(--green);font-weight:900;padding-top:2px}
.lrow .lbody{flex:1;min-width:0;word-break:break-word}
.hrow{border-top:1px solid var(--line);padding:8px 0}
.hrow .hl{display:flex;justify-content:space-between;gap:8px}
.hrow .hok{color:var(--green);font-weight:700}
.hrow .hno{color:var(--muted)}
.hrow .hent{font-size:12.5px;color:var(--muted);margin-top:2px}
.gfoot{text-align:center;margin-top:16px}
.stepper{direction:ltr;display:flex;align-items:center;gap:6px}
.stepper input{width:70px;height:44px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:18px}
.stepper .gbtn{width:44px;padding:0;font-size:20px}
.subadd{display:flex;gap:8px}
.sin{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
/* חלונות */
.mback{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mback.pk{z-index:70}
@media(min-width:640px){.mback{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:640px){.sheet{border-radius:22px}}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mhead h2{margin:0;font-size:18px;flex:1}
.xbtn{width:44px;height:44px;border:none;background:none;font-size:20px;color:var(--muted);border-radius:12px}
.big{display:block;width:100%;height:52px;margin:8px 0 4px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:17px}
.frow{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:44px}
.frow.top{align-items:flex-start}
.frow.col{flex-direction:column;align-items:stretch;gap:6px;margin-top:14px}
.frow.col .fl{width:auto}
.fl{width:74px;flex:none;color:var(--muted);font-size:14px}
.fbtn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;text-align:start}
.clr{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.seg button,.wk button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.seg button[aria-pressed=true],.wk button[aria-pressed=true],.mdg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rsub{margin-top:8px}

.rsub .mn{color:var(--muted);font-size:13px;margin-bottom:4px}

.err{color:var(--redtxt);min-height:20px;margin-top:8px;font-size:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;padding:0 14px;font-size:16px}
.note{color:var(--muted);font-size:14px;margin:6px 0}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rchips .chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 4px 0 12px;min-height:36px;font-weight:600}
.rchips .chip button{border:none;background:none;width:36px;height:36px;color:inherit;font-size:14px}
/* בוחרים */
.psheet{background:var(--surface);width:100%;max-width:340px;border-radius:22px;padding:12px 12px 14px;box-shadow:var(--shadow);margin:auto 12px}
@media(max-width:639px){.mback.pk{align-items:center}}
.pkhead{display:flex;align-items:center}
.pkhead b{flex:1;text-align:center}
.pkdow,.pkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pkdow div{color:var(--muted);font-size:12px;padding:6px 0 4px}
.pkgrid button{height:40px;border:none;background:none;border-radius:999px;font-size:15px;padding:0}
.pkgrid button:disabled{opacity:.3;cursor:default}
.pkgrid button.cur{outline:1.5px solid var(--accent);outline-offset:-2px}
.pkgrid button.on{background:var(--accent);color:#fff;font-weight:700}

.pkfoot input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px;font-size:16px}

</style></head><body>
<div id="net" role="status">אין חיבור · השינויים נשמרים במכשיר וישלחו כשהחיבור יחזור</div>

<div id="modalRoot"></div><div id="pickRoot"></div><div id="popRoot"></div>
<div id="toast" role="status"></div>
<div class="loginbox" id="login" hidden><div class="lcard"><h1>לוח משימות</h1><p>כדי לראות את המשימות שלך, היכנס עם חשבון Google.</p><button class="pbtn" id="loginBtn" type="button">כניסה עם Google</button><p id="loginErr" role="alert"></p></div></div>
<script src="fb.js"></script>
<script>
'use strict';
/* ===== זמן: כל הלוגיקה לפי שעון ישראל (Asia/Jerusalem), לא לפי אזור הזמן של המכשיר ===== */
const VERSION='0.4';
const TZ='Asia/Jerusalem';
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOWN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DOWS=['א','ב','ג','ד','ה','ו','ש'];
const HALF=48; /* גובה חצי שעה בציר הזמן, בפיקסלים (חייב להיות זהה ל־--half ב־CSS) */
const pad=n=>String(n).padStart(2,'0');
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function ilParts(){const p=_fmt.formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}
const todayIL=()=>ilParts().date;
/* תאריכים הם מחרוזות "YYYY-MM-DD" (תאריך לוח בלבד). חישובים ב-UTC כדי שלא יושפעו משעון המכשיר או משעון קיץ */
const P=s=>s.split('-').map(Number);
const F=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function addDays(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1,d+n));return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dowOf(s){const [y,m,d]=P(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addMonths(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1+n,1));const yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;return F(yy,mm,Math.min(d,dim(yy,mm)))}
const weekEnd=s=>addDays(s,6-dowOf(s));
const monthEnd=s=>{const [y,m]=P(s);return F(y,m,dim(y,m))};
const monthSpanEnd=s=>addDays(addMonths(s,1),-1); /* חודש מלא החל מ־s: מה־8/10 עד ה־7/11 */
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&addDays(s,0)===s;
const dm=s=>{const [,m,d]=P(s);return d+'/'+m};
const dayName=s=>{const [,m,d]=P(s);return d+' ב'+MONTHS[m-1]};
const longDay=s=>DOWN[dowOf(s)]+', '+dayName(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function occurrences(rule,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const ok=rule.type==='daily'||(rule.type==='weekdays'&&rule.days.includes(dowOf(d)))||(rule.type==='monthdays'&&rule.days.includes(+d.slice(8)));if(ok)out.push(d)}return out}
/* משימה כללית (בלי תאריך) אף פעם לא "הוחמצה" */
function status(t,today){if(t.movedTo)return 'moved';if(t.done)return 'done';if(!t.general&&t.date&&t.date<today)return 'missed';return 'open'}
const cmpT=(a,b)=>{const ta=a.time||'99:99',tb=b.time||'99:99';return ta<tb?-1:ta>tb?1:(a.createdAt||0)-(b.createdAt||0)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const floor30=n=>Math.floor(n/30)*30;
const snap30=n=>Math.round(n/30)*30;
/* טווח שעות: endTime קיים רק אם יש שעת התחלה, והוא אחרי ההתחלה. בלי endTime המשימה מוצגת כחצי שעה */
const endMin=t=>{if(!t.time||!t.endTime)return null;const s=toMin(t.time),e=toMin(t.endTime);return e>s?e:null};
const spanOf=t=>{const s=toMin(t.time),e=endMin(t);return [s,Math.max(e!==null?e:s+30,s+30)]};
function parseDateText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?$/.exec(s);if(!m)return '';
  let y=m[3]?+m[3]:+todayIL().slice(0,4);if(m[3]&&m[3].length===2)y+=2000;
  const r=F(y,+m[2],+m[1]);return isDate(r)?r:'';
}
function parseTimeText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[:.](\d{2})$/.exec(s)||/^(\d{2})(\d{2})$/.exec(s);if(!m)return '';
  const h=+m[1],mi=+m[2];return h<24&&mi<60?pad(h)+':'+pad(mi):'';
}

/* ===== תזכורות =====
   מבנה שמור במשימה: reminders=[{t:'before',m:5|15|60},{t:'at',time:'HH:MM'}]
   'before' = לפני שעת המשימה (רק למשימה עם שעה). 'at' = שעה מוחלטת באותו יום.
   האפליקציה הזו לא מפעילה שום התראה. reminderTimes מחזירה את הזמנים המחושבים כדי שגרסת אפליקציה (Capacitor) תוכל לתזמן התראות מקומיות. */
const REM_BEFORE=[5,15,60];
function remList(t){
  const a=Array.isArray(t.reminders)?t.reminders:[];
  return a.filter(r=>r&&((r.t==='before'&&t.time&&REM_BEFORE.includes(r.m))||(r.t==='at'&&/^\d{2}:\d{2}$/.test(r.time||''))));
}
function remSort(a){
  const b=a.filter(r=>r.t==='before').sort((x,y)=>y.m-x.m),c=a.filter(r=>r.t==='at').sort((x,y)=>x.time<y.time?-1:x.time>y.time?1:0);
  return [...b,...c];
}
const remLabel=r=>r.t==='at'?r.time:(r.m===60?'שעה':r.m+' דק׳');
const remText=a=>{const l=remSort(a);return l.length?'🔔 '+l.map(remLabel).join(' · '):''};
function reminderTimes(t){
  if(!t.date)return [];
  return remSort(remList(t)).map(r=>{
    if(r.t==='at')return {date:t.date,time:r.time};
    const n=toMin(t.time)-r.m;
    return n>=0?{date:t.date,time:fromMin(n)}:{date:addDays(t.date,-1),time:fromMin(n+1440)};
  });
}
const sameRem=(a,b)=>JSON.stringify(remSort(a||[]))===JSON.stringify(remSort(b||[]));

/* ===== מצב ===== */
const $=s=>document.querySelector(s);
const S={db:null,tasks:[],series:[],loaded:{t:false,s:false,g:false},view:'month',month:todayIL().slice(0,7),sel:todayIL(),modal:null,pick:null,pop:null,dismissed:new Set(),lastToday:todayIL(),dragging:false,pending:false,autoScroll:false,lastDay:{d:'',t:0},goals:[],glog:[],showArch:false,goalId:'',tl:{lo:360,occ:new Set(),exp:null}};
const T=id=>S.tasks.find(x=>x.id===id);
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function clean(o){const r={};for(const k in o){if(k==='id'||o[k]===undefined)continue;r[k]=o[k]}return r}
let toastT=0;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}

/* ===== שכבת נתונים: מתאימה לעבודה בלי אינטרנט =====
   כל כתיבה היא "שגר ושכח": הכתיבה נרשמת מיד במטמון המקומי של Firestore ומסונכרנת לשרת כשיש חיבור.
   לא מחכים לאישור השרת, ולכן אף פעולה לא נתקעת בלי רשת. עדכונים הם ברמת שדה (update), לא דריסה של כל המסמך.
   מחיקת שדה מתבצעת על ידי כתיבת ערך ריק ('' / false). מזהים של משימות חוזרות קבועים (סדרה_תאריך) כדי שלא ייווצרו כפילויות. */
function bg(fn){
  try{const p=fn();if(p&&p.catch)p.catch(e=>{console.error(e);toast('השינוי לא נשמר. נסה שוב.')})}
  catch(e){console.error(e);toast('השינוי לא נשמר. נסה שוב.')}
}
const dbSet=(c,id,o)=>bg(()=>S.db.doc(c+'/'+id).set(clean(o)));
const dbUpd=(c,id,p)=>bg(()=>S.db.doc(c+'/'+id).update(clean(p)));
const dbDel=(c,id)=>bg(()=>S.db.doc(c+'/'+id).delete());
function updTask(id,p){const t=T(id);if(t)Object.assign(t,p);dbUpd('cal_tasks',id,p)}
function updSeries(id,p){const s=S.series.find(x=>x.id===id);if(s)Object.assign(s,p);dbUpd('cal_series',id,p)}

/* ===== תצוגה: משימה אחת ===== */
function taskHtml(t,today,o){
  o=o||{};
  const st=status(t,today);
  const cls=st==='moved'?'missed':st;
  const glyph=st==='done'?'✓':(st==='missed'||st==='moved')?'✕':'';
  const meta=[];
  if(t.time){
    if(endMin(t)!==null)meta.push('<span class="ltr">'+esc(t.time)+'–'+esc(t.endTime)+'</span>');
    else if(o.blk&&toMin(t.time)%30)meta.push('<span class="ltr">'+esc(t.time)+'</span>');
  }
  if(t.seriesId)meta.push('🔁');
  const gl=t.goalId&&S.goals.find(x=>x.id===t.goalId);if(gl)meta.push('🎯 '+esc(gl.title));
  const rt=t.general?'':remText(remList(t));if(rt)meta.push(esc(rt));
  let m=meta.length?'<div class="meta">'+meta.join(' · ')+'</div>':'';
  if(t.movedTo)m+='<div class="meta bad">הועבר ל־'+dm(t.movedTo)+'</div>';
  if(t.movedFrom)m+='<div class="meta">הועבר מ־'+dm(t.movedFrom)+'</div>';
  if(t.details)m+='<div class="det">'+esc(t.details)+'</div>';
  const mv=st==='missed'?'<button type="button" class="mvlink" data-act="mv" data-id="'+t.id+'">העבר ליום אחר</button>':'';
  const dis=st==='moved',nar=!!(o.blk&&o.blk.narrow);
  const style=o.blk?' data-s="'+o.blk.s+'" data-e="'+o.blk.e+'" style="top:'+o.blk.top+'px;height:'+o.blk.h+'px;right:'+o.blk.r+'%;width:calc('+o.blk.w+'% - 3px)"':'';
  const bcls=o.blk?' blk'+(o.blk.h<=HALF+1?' one':'')+(o.blk.narrow?' narrow':''):'';
  const hd=o.blk&&!dis?'<i class="hd t" data-h="t" aria-hidden="true"></i><i class="hd b" data-h="b" aria-hidden="true"></i>':'';
  return '<div class="tk '+cls+bcls+'" data-id="'+t.id+'"'+(dis?' data-nodrag="1"':'')+style+'><button type="button" class="chk" data-act="tog" data-id="'+t.id+'" role="checkbox" aria-checked="'+(st==='done')+'" aria-label="סימון '+esc(t.title)+'"'+(dis?' disabled':'')+'><i>'+glyph+'</i></button><div class="tkbody"'+(nar?' data-act="menu" data-id="'+t.id+'"':'')+'><div class="tt">'+esc(t.title)+'</div>'+m+mv+'</div>'+(nar?'':'<button type="button" class="kebab" data-act="menu" data-id="'+t.id+'" aria-label="תפריט משימה">⋮</button>')+hd+'</div>';
}

/* ===== תצוגה: סיכומים ===== */
function summary(list){
  const c=list.filter(t=>!t.movedTo),n=c.length,d=c.filter(t=>t.done).length;
  if(!n)return 'אין משימות';
  return (n===1?'משימה אחת':n+' משימות')+' · '+(d===1?'הושלמה אחת':d+' הושלמו');
}
function generalList(){return S.tasks.filter(t=>t.general).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.createdAt||0)-(b.createdAt||0))}
function genHtml(today,quiet){const g=generalList();return g.length?g.map(t=>taskHtml(t,today)).join(''):(quiet?'':'<div class="none">אין משימות כלליות</div>')}

/* ===== תצוגה: לוח חודשי ===== */
function maxVisible(){return innerWidth<640?3:4}
function renderMonth(){
  const today=todayIL();
  const [y,m]=S.month.split('-').map(Number);
  const by={};S.tasks.forEach(t=>{if(t.general||!t.date)return;(by[t.date]=by[t.date]||[]).push(t)});Object.values(by).forEach(a=>a.sort(cmpT));
  const lead=dowOf(F(y,m,1)),n=dim(y,m),MV=maxVisible();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell empty" aria-hidden="true"></div>';
  for(let d=1;d<=n;d++){
    const ds=F(y,m,d),list=by[ds]||[];
    let items='';
    const shown=list.length>MV?MV-1:list.length;
    for(let i=0;i<shown;i++){const t=list[i],st=status(t,today);items+='<div class="t '+(st==='missed'||st==='moved'?'bad':st==='done'?'ok':'')+'"'+(st==='moved'?'':' data-tid="'+t.id+'"')+'>'+esc(t.title)+'</div>'}
    if(list.length>shown)items+='<div class="more"><span class="ltr">+'+(list.length-shown)+'</span> משימות</div>';
    cells+='<button type="button" class="cell'+(ds===today?' today':'')+(ds===S.sel?' sel':'')+'" data-act="day" data-d="'+ds+'" aria-label="'+esc(longDay(ds))+', '+list.length+' משימות"><span class="n">'+d+'</span>'+items+'</button>';
  }
  const sl=S.tasks.filter(t=>!t.general&&t.date===S.sel);
  const panel='<div class="dpanel" id="dpanel"><h2>'+esc(longDay(S.sel))+(S.sel===today?'<span class="tag">היום</span>':'')+'</h2><div class="dsum">'+summary(sl)+'</div><div class="btns"><button type="button" class="pbtn" data-act="add">＋ הוסף משימה</button><button type="button" class="gbtn" data-act="open-day">פתח את היום</button></div></div>';
  const gen='<div class="gsec" id="gen" data-drop="general"><div class="gh"><b>📌 משימות כלליות</b><button type="button" class="gbtn sm" data-act="addgen">＋ משימה כללית</button></div><div class="gl2">'+genHtml(today)+'</div></div>';
  return '<div class="wrap"><div class="mtop"><button type="button" class="arr" data-act="prev" aria-label="חודש קודם">→</button><h1 class="mtitle">'+MONTHS[m-1]+' '+y+'</h1><button type="button" class="arr" data-act="next" aria-label="חודש הבא">←</button></div><div class="mbar"><button type="button" class="tlink" data-act="today">היום</button></div><div class="cal"><div class="dow" aria-hidden="true">'+DOWS.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="grid">'+cells+'</div></div>'+panel+goalsHtml()+gen+'<div class="foot"><button type="button" class="link" data-act="signout">יציאה</button><div class="ver">גרסה '+VERSION+'</div></div></div>';
}

/* ===== תצוגה: מסך יום ===== */
/* פריסת משימות עם שעה: משימות שחופפות בזמן מוצגות זו לצד זו */
function layoutDay(timed){
  const it=timed.map(t=>{const [s,e]=spanOf(t);return {t,s,e}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],ce=0,cols=[];
  const flush=()=>{cl.forEach(x=>x.cols=cols.length);out.push(...cl);cl=[];cols=[];ce=0};
  for(const x of it){
    if(cl.length&&x.s>=ce)flush();
    let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}
    cols[c]=x.e;x.col=c;cl.push(x);ce=Math.max(ce,x.e);
  }
  flush();return out;
}
/* ציר הזמן הקומפקטי: שעה שיש בה משימה מוצגת בגובה מלא (96px), שעה ריקה בגובה מצומצם (24px).
   זה שינוי תצוגה בלבד: השעות והחישובים נשארים בדקות. בזמן גרירה השעה שמתחת לאצבע מורחבת (hoverHour). */
const CH=24,FH=2*HALF;
const hourH=h=>(S.tl.occ.has(h)||S.tl.exp===h)?FH:CH;
function yOfMin(m){const lo=S.tl.lo/60,hh=Math.floor(m/60);let y=0;for(let h=lo;h<hh&&h<24;h++)y+=hourH(h);if(hh<24)y+=(m-hh*60)/60*hourH(hh);return y}
function minOfY(y){let h=S.tl.lo/60;if(y<0)return S.tl.lo+y/hourH(h)*60;while(h<24){const k=hourH(h);if(y<k)return h*60+y/k*60;y-=k;h++}return 1440}
function linesHtml(){
  let s='';
  for(let h=S.tl.lo/60;h<24;h++){
    const full=S.tl.occ.has(h)||S.tl.exp===h,y=yOfMin(h*60);
    s+='<div class="gline hr'+(full?'':' cmp')+'" style="top:'+y+'px"><span class="st">'+pad(h)+':00</span></div>';
    if(full)s+='<div class="gline half" style="top:'+(y+HALF)+'px"><span class="st">'+pad(h)+':30</span></div>';
  }
  return s;
}
function applyScale(){
  const tl=$('#tl');if(!tl)return;
  tl.style.height=yOfMin(1440)+'px';
  $('#glines').innerHTML=linesHtml();
  tl.querySelectorAll('.blk').forEach(b=>{const s=+b.dataset.s,e=+b.dataset.e;b.style.top=(yOfMin(s)+1)+'px';b.style.height=(yOfMin(e)-yOfMin(s)-2)+'px'});
}
function renderDay(){
  const today=todayIL(),d=S.sel;
  const list=S.tasks.filter(t=>!t.general&&t.date===d).sort(cmpT);
  const timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let lo=360;timed.forEach(t=>{lo=Math.min(lo,Math.floor(toMin(t.time)/60)*60)});
  const occ=new Set();
  timed.forEach(t=>{const [s,e]=spanOf(t);for(let h=Math.floor(s/60);h<=Math.floor((Math.min(e,1440)-1)/60);h++)occ.add(h)});
  S.tl={lo,occ,exp:null};
  const blocks=layoutDay(timed).map(x=>taskHtml(x.t,today,{blk:{s:x.s,e:x.e,top:yOfMin(x.s)+1,h:yOfMin(x.e)-yOfMin(x.s)-2,r:x.col*100/x.cols,w:100/x.cols,narrow:x.cols>=2}})).join('');

  return '<div class="wrap"><div class="dtop"><button type="button" class="tlink" data-act="back">📅 חזרה ללוח</button><button type="button" class="pbtn sm" data-act="add">＋ הוסף משימה</button></div><div class="dnav"><button type="button" class="arr" data-act="dprev" aria-label="יום קודם"><span class="ltr">›</span></button><div class="dtitle"><small>'+DOWN[dowOf(d)]+'</small><h1>'+esc(dayName(d))+(d===today?'<span class="tag">היום</span>':'')+'</h1></div><button type="button" class="arr" data-act="dnext" aria-label="יום הבא"><span class="ltr">‹</span></button></div><div class="dsum">'+summary(list)+'</div><div class="tl" id="tl" style="height:'+yOfMin(1440)+'px"><div id="glines">'+linesHtml()+'</div><div class="lane" id="lane">'+blocks+'</div></div>'+nt+'</div>';
}

function render(){
  if(S.dragging){S.pending=true;return}
  const root=$('#app');
  if(!S.loaded.t||!S.loaded.s){root.innerHTML='<div class="loading">טוען…</div>';return}
  const y=window.scrollY;
  root.innerHTML=S.view==='day'?renderDay():S.view==='goal'?renderGoal():renderMonth();
  if(S.autoScroll&&S.view==='day'){S.autoScroll=false;scrollToRelevant()}else if(S.autoScroll){S.autoScroll=false;window.scrollTo(0,0)}else window.scrollTo(0,y);
}
function scrollToRelevant(){
  const first=S.tasks.filter(t=>!t.general&&t.date===S.sel&&t.time).sort(cmpT)[0];
  let m=first?toMin(first.time):null;
  if(m===null){const n=ilParts();m=S.sel===n.date?n.h*60+n.m:8*60}
  const tl=$('#tl');if(!tl)return;
  const y=tl.getBoundingClientRect().top+window.scrollY+yOfMin(Math.max(m,S.tl.lo));
  window.scrollTo(0,Math.max(0,y-150));
}

/* ===== ניווט ===== */
function route(){
  const m=/^#d=(\d{4}-\d{2}-\d{2})$/.exec(location.hash),gm=/^#g=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if(gm){if(S.view!=='goal')S.autoScroll=true;S.view='goal';S.goalId=gm[1]}
  else if(m&&isDate(m[1])){if(S.view!=='day')S.autoScroll=true;S.view='day';S.sel=m[1];S.month=m[1].slice(0,7)}
  else S.view='month';
  render();
}
function openDay(d){S.sel=d;S.month=d.slice(0,7);S.autoScroll=true;history.pushState({v:'day'},'','#d='+d);route()}
function stepDay(k){const d=addDays(S.sel,k);history.replaceState({v:'day'},'','#d='+d);S.autoScroll=true;route()}
function openGoal(id){S.autoScroll=true;history.pushState({v:'goal'},'','#g='+id);route()}
function backToMonth(){if(history.state&&(history.state.v==='day'||history.state.v==='goal'))history.back();else{history.replaceState(null,'',location.pathname+location.search);route()}}
function shiftMonth(k){const mk=addMonths(S.month+'-01',k).slice(0,7);S.month=mk;const t=todayIL();S.sel=t.slice(0,7)===mk?t:mk+'-01';render()}
/* לחיצה על יום בלוח: בחירה וסיכום. לחיצה כפולה (או הקשה כפולה במגע) פותחת את מסך היום */
function dayClick(d){
  const now=Date.now(),L=S.lastDay;
  if(L.d===d&&now-L.t<450){S.lastDay={d:'',t:0};openDay(d);return}
  S.lastDay={d,t:now};S.sel=d;render();
}
addEventListener('popstate',route);

/* ===== פעולות על נתונים ===== */
const mkInst=(s,d,i,now)=>({title:s.title,details:s.details||'',time:s.time||'',endTime:s.endTime||'',date:d,done:false,seriesId:s.id,reminders:s.reminders||[],createdAt:now+i});
function createQuick(title,time,date){
  dbSet('cal_tasks',newId(),{title,time:time||'',endTime:'',date,done:false,reminders:[],createdAt:Date.now()});
}
function createGeneral(title,details){
  dbSet('cal_tasks',newId(),{title,details:details||'',time:'',endTime:'',date:'',general:true,done:false,reminders:[],createdAt:Date.now()});
}
function createTask(v,r){
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'',details=(v.details||'').trim();
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(r.type==='none'){dbSet('cal_tasks',newId(),{title,details,time,endTime,date:v.date,done:false,reminders,createdAt:Date.now()});return {count:1}}
  const today=todayIL();
  const end=r.type==='monthdays'?monthEnd(today):r.type==='daily'?monthSpanEnd(today):weekEnd(today);
  const rule={type:r.type,days:r.type==='weekdays'?r.wd:r.type==='monthdays'?r.md:[]};
  const dates=occurrences(rule,today,end);
  const sid=newId(),now=Date.now();
  const s={id:sid,title,details,time,endTime,reminders,type:rule.type,days:rule.days,start:today,through:end,ended:false,createdAt:now};
  dbSet('cal_series',sid,s);
  dates.forEach((d,i)=>dbSet('cal_tasks',sid+'_'+d,mkInst(s,d,i,now)));
  return {count:dates.length,monthly:r.type==='monthdays',daily:r.type==='daily'};
}
function editTask(id,scope,v){
  const t=T(id);if(!t)return;
  const details=(v.details||'').trim();
  if(t.general){updTask(id,{title:v.title.trim(),details});return}
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'';
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date&&!x.movedTo);
    list.forEach(x=>updTask(x.id,{title,details,time,endTime,reminders}));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{title,details,time,endTime,reminders});
  }else{
    updTask(id,{title,details,time,endTime,reminders,date:isDate(v.date)?v.date:t.date});
  }
}
function deleteTask(id,scope){
  const t=T(id);if(!t)return;
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date);
    const ids=new Set(list.map(x=>x.id));
    S.tasks=S.tasks.filter(x=>!ids.has(x.id));
    list.forEach(x=>dbDel('cal_tasks',x.id));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{ended:true});
    return;
  }
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  if(t.movedToId&&T(t.movedToId))updTask(t.movedToId,{movedFrom:'',movedFromId:''});
  S.tasks=S.tasks.filter(x=>x.id!==id);
  dbDel('cal_tasks',id);
}
function moveTask(id,nd){
  const t=T(id);if(!t)return;
  const nid=newId();
  dbSet('cal_tasks',nid,{title:t.title,details:t.details||'',time:t.time||'',endTime:t.endTime||'',date:nd,done:false,reminders:t.reminders||[],movedFrom:t.date,movedFromId:t.id,...(t.seriesId?{seriesId:t.seriesId}:{}),...(t.goalId?{goalId:t.goalId,goalSub:t.goalSub||''}:{}),createdAt:Date.now()});
  updTask(t.id,{movedTo:nd,movedToId:nid});
}
/* הפיכת משימה עם תאריך למשימה כללית: מוחקים רק תאריך ושעה. שם, פרטים, תזכורות וקישור ליעד נשמרים.
   לא חלה על משימה חוזרת. אם זו משימה שהועברה מיום שהוחמץ, הקישור להיסטוריה מתנתק והמקור חוזר להיות "הוחמצה" */
const canGeneral=t=>!!t&&!t.general&&!t.seriesId&&!t.movedTo;
function toGeneral(id){
  const t=T(id);if(!canGeneral(t))return false;
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  updTask(id,{general:true,date:'',time:'',endTime:'',movedFrom:'',movedFromId:''});
  return true;
}
/* משימות חוזרות נוצרות רק לתקופה הנוכחית (שבוע, חודש או חודש מלא מהיום). בסוף התקופה שואלים אם להמשיך */
const periodEnd=(type,d)=>type==='monthdays'?monthEnd(d):type==='daily'?monthSpanEnd(d):weekEnd(d);
function seriesDue(s,today){return !s.ended&&today>=addDays(s.through,-1)}
function continueSeries(s){
  const today=todayIL();
  const from=addDays(s.through,1)>today?addDays(s.through,1):today;
  const end=periodEnd(s.type,from);
  const dates=occurrences(s,from,end).filter(d=>!T(s.id+'_'+d));
  const now=Date.now();
  /* קודם מעדכנים את סוף התקופה, כדי שהצצת הנתונים שמגיעה בזמן הכתיבה לא תשאל שוב */
  updSeries(s.id,{through:end});
  dates.forEach((d,i)=>dbSet('cal_tasks',s.id+'_'+d,mkInst(s,d,i,now)));
}
function checkSeries(){
  if(S.modal||S.pick||S.dragging||!S.loaded.t||!S.loaded.s)return;
  const today=todayIL();
  const s=S.series.find(x=>seriesDue(x,today)&&!S.dismissed.has(x.id));
  if(s)modal({type:'cont',sid:s.id});
}

function remHtml(m){

function renderModal(){

/* ===== גרירה =====

const DR={hv:null,on:false,mode:null,kind:'move',id:null,chip:null,sx:0,sy:0,x:0,y:0,timer:0,ghost:null,raf:0,zone:0,zoneT:0,prop:null,p0:0,fromTl:false,endT:-1e9};

function dragTask(){return DR.chip?{id:'',title:goalTaskTitle(DR.chip.gid,DR.chip.sub),general:true}:T(DR.id)}
function minAt(y){const tl=$('#tl');if(!tl)return null;return minOfY(y-tl.getBoundingClientRect().top)}
/* ציר קומפקטי: כשהמצביע נח מעל שעה ריקה (רבע שנייה בערך) היא מתרחבת לגובה מלא כדי לבחור זמן מדויק.
   עד אז עוברים מהר בין שעות ריקות בגובה המצומצם. מעגנים את הגלילה כך שהשעה נשארת מתחת למצביע */
const HOVER_MS=110;
function hoverCheck(y){
  DR.hvSeen=true;
  const tl=$('#tl');if(!tl){DR.hv=null;return}
  const m=minOfY(y-tl.getBoundingClientRect().top);
  if(m<S.tl.lo||m>=1440){DR.hv=null;return}
  const h=Math.floor(m/60),want=S.tl.occ.has(h)?null:h;
  if(want===S.tl.exp){DR.hv=null;return}

function hoverApply(){
  const hv=DR.hv,tl=$('#tl');
  if(!hv||!tl||performance.now()-hv.t<HOVER_MS)return false;
  DR.hv=null;
  const before=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  S.tl.exp=hv.want;applyScale();
  const after=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  if(Math.abs(after-before)>.5)window.scrollBy(0,after-before);
  /* שעה מורחבת שיורדת מתחת לתיבת "ללא שעה" הצמודה למטה: גוללים מעט כדי שתהיה נגישה, בלי להוציא את המצביע ממנה */
  if(hv.want!==null){
    const nt=$('#nt'),lim=(nt?nt.getBoundingClientRect().top:innerHeight)-10,bottom=tl.getBoundingClientRect().top+yOfMin((hv.h+1)*60);
    if(bottom>lim&&DR.y<lim-2){const d=Math.min(bottom-lim,bottom-DR.y-2);if(d>0)window.scrollBy(0,d)}
  }

}
function proposeMove(t,min){
  const em=t.time?endMin(t):null,dur=em!==null?em-toMin(t.time):0;
  let s;
  if(DR.fromTl&&t.time){const s0=toMin(t.time),delta=min-DR.p0;s=Math.abs(delta)<15?s0:Math.max(0,Math.min(snap30(s0+delta),dur?floor30(1439-dur):1410))}
  else s=Math.max(0,Math.min(floor30(min),dur?floor30(1439-dur):1410));
  return {k:'tl',s,e:dur?s+dur:null};
}
function proposeResize(t,kind,min){
  const [s0,e0]=spanOf(t);
  if(kind==='rb'){let ne=snap30(min);if(ne<s0+30)ne=s0+30;if(ne>1439)ne=1439;return {k:'tl',s:s0,e:ne,same:ne===e0}}
  let ns=snap30(min);ns=Math.max(0,Math.min(ns,e0-30));

}
function showInd(prop){

  ind.innerHTML='<span class="ltr">'+fromMin(prop.s)+(prop.e?'–'+fromMin(Math.min(prop.e,1439)):'')+'</span>';

function dragStart(x,y){
  const t=dragTask();if(!t){DR.mode=null;return}
  DR.on=true;S.dragging=true;document.body.classList.add('dragging');
  const src=DR.chip?null:document.querySelector('.tk[data-id="'+DR.id+'"]');
  DR.fromTl=!!(src&&src.classList.contains('blk'));
  DR.p0=S.view==='day'?minAt(DR.sy):0;
  DR.prop=null;
  if(src&&DR.kind==='move')src.classList.add('lifted');
  if(DR.kind==='move'){const g=document.createElement('div');g.className='ghost';g.textContent=t.title;document.body.appendChild(g);DR.ghost=g}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  dragMove(x,y);
  const loop=()=>{
    if(!DR.on)return;
    const nt=$('#nt'),boxTop=nt?nt.getBoundingClientRect().top:innerHeight;
    let sp=0,zone=0;
    if(DR.y<90){zone=-1;sp=-Math.ceil((90-DR.y)/90*16)}

    /* גלילה אוטומטית רק אחרי שהאצבע נשארת בקצה רבע שנייה, כדי שלא תתחיל בטעות בזמן שגוררים החוצה מ"ללא שעה" */

function genZone(el,t){

}
function dragMove(x,y){

  const t=dragTask();if(!t)return;
  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  let prop=null;DR.hvSeen=false;
  if(DR.kind==='move'){
    const el=document.elementFromPoint(x,y);
    if(S.view==='month'){
      const c=el&&el.closest?el.closest('.cell[data-d]'):null;
      if(c){
        const d=c.dataset.d;
        if(!t.general&&d===t.date)prop={k:'cell',d,same:true};
        else if(d<todayIL())prop={k:'cell',d,bad:true};
        else{c.classList.add('over');prop={k:'cell',d}}
      }else prop=genZone(el,t);
    }else if(S.view==='day'&&el&&el.closest){
      const gz=genZone(el,t);

        const nz=el.closest('[data-drop="none"]');

function dropChip(prop){

  else return;

  planGoalTask(DR.chip.gid,DR.chip.sub,d,time);
  if(S.view==='month'){S.sel=d;S.month=d.slice(0,7)}
  toast('הפעילות תוכננה ל־'+dayName(d)+(time?' בשעה '+time:''));
}
function applyDrop(t,prop){
  const today=todayIL();
  const pastBlock=()=>{toast('אי אפשר להוסיף משימה ליום שעבר.')};
  if(DR.chip){dropChip(prop);return}
  let patch=null;
  if(prop.k==='gen'){
    if(prop.bad){toast('משימה חוזרת לא הופכת למשימה כללית.');return}
    if(toGeneral(t.id))toast('המשימה הפכה למשימה כללית'+(t.goalId?'. משימה כללית לא נספרת ביעד עד ששובצה ליום.':''));
    return;
  }
  if(prop.k==='cell'){
    if(prop.same)return;
    if(prop.d<today){if(t.general)pastBlock();else toast('אי אפשר להעביר משימה ליום שעבר.');return}
    if(t.general){
      patch={general:false,date:prop.d,time:'',endTime:''};S.sel=prop.d;S.month=prop.d.slice(0,7);
      toast('המשימה עברה ל־'+dayName(prop.d));
    }else{
      /* משימה עם תאריך: משנים רק את התאריך. שעה, טווח, שם, פרטים, תזכורות ושאר הנתונים נשארים.
         משימה שהוחמצה עוברת דרך מנגנון ההעברה הקיים, ששומר היסטוריה */
      S.sel=prop.d;S.month=prop.d.slice(0,7);
      if(status(t,today)==='missed'){moveTask(t.id,prop.d);toast('הועבר ל־'+dm(prop.d));return}
      patch={date:prop.d};toast('המשימה עברה ל־'+dayName(prop.d));
    }
  }else if(prop.k==='none'){
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:'',endTime:''};toast('המשימה עברה ל־'+dayName(S.sel))}
    else if(t.time)patch={time:'',endTime:''};
  }else if(prop.k==='tl'&&!prop.same){
    const nt=fromMin(prop.s),ne=prop.e?fromMin(Math.min(prop.e,1439)):'';
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:nt,endTime:ne};toast('המשימה עברה ל־'+dayName(S.sel))}
    else if(t.time!==nt||(t.endTime||'')!==ne)patch={time:nt,endTime:ne};
  }
  if(patch)updTask(t.id,patch);
}

/* ===== יעדים =====
   cal_goals:    {title,desc,period:'week'|'month',target,targetHist:[{from,target}],subs:[{id,name}],archived,createdAt}
   cal_goal_log: {goalId,date,subId,subName,note,createdAt}   (עדכון ידני: פעילות שבוצעה בלי משימה ביומן)
   משימה ביומן שקשורה ליעד: cal_tasks עם goalId (ו־goalSub אופציונלי).
   ההתקדמות לא נשמרת כמספר: היא תמיד מחושבת מהרשומות, לכן אי אפשר לספור פעילות פעמיים:
   הושלמו = משימות מקושרות שסומנו כבוצעו (לפי תאריך המשימה ביומן, בתוך התקופה) + רשומות ידניות בתקופה.
   מתוכננות = משימות מקושרות שלא בוצעו ותאריכן היום או אחר כך, בתוך התקופה.
   תקופה חדשה = טווח תאריכים חדש, ולכן הספירה מתחילה מאפס. תקופות קודמות נשארות כהיסטוריה (שום דבר לא נמחק). */
const gById=id=>S.goals.find(g=>g.id===id);
const gActive=()=>S.goals.filter(g=>!g.archived).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const pStart=(per,d)=>per==='week'?addDays(d,-dowOf(d)):d.slice(0,7)+'-01';
const pEnd=(per,ps)=>per==='week'?addDays(ps,6):monthEnd(ps);
const pNext=(per,ps)=>per==='week'?addDays(ps,7):addMonths(ps,1);
const pLabel=(per,ps)=>{if(per==='week')return 'שבוע '+dm(ps)+'–'+dm(pEnd(per,ps));const [y,m]=P(ps);return MONTHS[m-1]+' '+y};
const perName=per=>per==='week'?'שבועי':'חודשי';
const perUnit=per=>per==='week'?'בשבוע':'בחודש';
function dateOfTs(ts){const p=_fmt.formatToParts(new Date(ts));const g=t=>p.find(x=>x.type===t).value;return g('year')+'-'+g('month')+'-'+g('day')}
function targetFor(g,ps){
  const h=Array.isArray(g.targetHist)?g.targetHist:[];let best=null;
  for(const x of h)if(x.from<=ps&&(!best||x.from>=best.from))best=x;
  return best?best.target:(h.length?h[0].target:g.target);
}
function subName(g,id){const s=(g.subs||[]).find(x=>x.id===id);return s?s.name:''}
function goalTaskTitle(gid,sub){const g=gById(gid);if(!g)return 'פעילות';const n=sub?subName(g,sub):'';return g.title+(n?' · '+n:'')}
function goalStats(g,ps,today){
  const pe=pEnd(g.period,ps);
  const tasks=S.tasks.filter(t=>t.goalId===g.id&&!t.general&&t.date&&t.date>=ps&&t.date<=pe&&!t.movedTo);
  const doneT=tasks.filter(t=>t.done),planT=tasks.filter(t=>!t.done&&t.date>=today),missT=tasks.filter(t=>!t.done&&t.date<today);
  const logs=S.glog.filter(l=>l.goalId===g.id&&l.date>=ps&&l.date<=pe);
  const subs={};const add=(id,k)=>{id=id||'';(subs[id]=subs[id]||{done:0,planned:0})[k]++};
  doneT.forEach(t=>add(t.goalSub,'done'));logs.forEach(l=>add(l.subId,'done'));planT.forEach(t=>add(t.goalSub,'planned'));
  return {ps,pe,target:targetFor(g,ps),done:doneT.length+logs.length,planned:planT.length,doneT,planT,missT,logs,subs};
}
const plannedText=n=>n===0?'אין פעילויות מתוכננות':n===1?'פעילות אחת מתוכננת':n+' פעילויות מתוכננות';
const doneText=st=>'<span class="ltr">'+st.done+'/'+st.target+'</span> הושלמו';
const pct=st=>Math.max(0,Math.min(100,Math.round(st.done/st.target*100)));

/* ===== פעולות על נתונים ===== */
function planGoalTask(gid,sub,date,time){
  if(!gById(gid))return;
  dbSet('cal_tasks',newId(),{title:goalTaskTitle(gid,sub),details:'',time:time||'',endTime:'',date,done:false,reminders:[],goalId:gid,goalSub:sub||'',createdAt:Date.now()});
}
function addGoalLog(gid,date,sub,note){
  const g=gById(gid);if(!g)return;
  const id=newId(),o={goalId:gid,date,subId:sub||'',subName:sub?subName(g,sub):'',note:(note||'').trim(),createdAt:Date.now()};
  S.glog.push({id,...o});dbSet('cal_goal_log',id,o);
}
function delGoalLog(id){S.glog=S.glog.filter(l=>l.id!==id);dbDel('cal_goal_log',id)}
function updGoal(id,p){const g=gById(id);if(g)Object.assign(g,p);dbUpd('cal_goals',id,p)}
function saveGoal(v,id){
  const title=v.title.trim(),desc=(v.desc||'').trim(),target=parseInt(v.target,10),subs=v.subs.map(s=>({id:s.id,name:s.name}));
  const today=todayIL();
  if(!id){
    const nid=newId(),ps=pStart(v.period,today);
    const g={title,desc,period:v.period,target,targetHist:[{from:ps,target}],subs,archived:false,createdAt:Date.now()};
    S.goals.push({id:nid,...g});dbSet('cal_goals',nid,g);return nid;
  }
  const g=gById(id);if(!g)return id;
  const patch={title,desc,subs};
  const ps=pStart(g.period,today);
  if(target!==targetFor(g,ps)){
    patch.target=target;
    patch.targetHist=[...(g.targetHist||[]).filter(x=>x.from!==ps),{from:ps,target}].sort((a,b)=>a.from<b.from?-1:1);
  }
  updGoal(id,patch);return id;
}

function entriesLine(g,st){
  const items=[...st.doneT.map(t=>({d:t.date,s:t.goalSub})),...st.logs.map(l=>({d:l.date,s:l.subId}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);

function renderGoal(){
  const back='<div class="dtop"><button type="button" class="tlink" data-act="back">📅 חזרה ללוח</button></div>';
  if(!S.loaded.g)return '<div class="wrap">'+back+'<div class="loading">טוען…</div></div>';
  const g=gById(S.goalId);
  if(!g)return '<div class="wrap">'+back+'<div class="loading">היעד לא נמצא.</div></div>';
  try{
    const today=todayIL(),ps=pStart(g.period,today),st=goalStats(g,ps,today);
    let h='<div class="wrap gscr"><div class="dtop"><button type="button" class="tlink" data-act="back">📅 חזרה ללוח</button><button type="button" class="gbtn sm" data-act="g-edit" data-id="'+g.id+'">✏️ עריכה</button></div>';
    h+='<h1 class="gtitle">🎯 '+esc(g.title)+'</h1><div class="gsub">יעד '+perName(g.period)+' · '+esc(String(st.target))+' '+perUnit(g.period)+'</div>';
    if(g.desc)h+='<div class="gdesc">'+esc(g.desc)+'</div>';
    if(g.archived)h+='<div class="note">היעד בארכיון. ההיסטוריה שלו נשמרת.</div>';

    if((g.subs||[]).length)h+='<div class="gchips">'+g.subs.map(s=>'<button type="button" class="gchip solid" data-act="g-inc" data-id="'+g.id+'" data-sub="'+esc(s.id)+'">＋ '+esc(s.name)+'</button>').join('')+'</div>';
    h+='<div class="gupd"><button type="button" class="gbtn" data-act="g-addlog" data-id="'+g.id+'">הוסף פעילות שבוצעה בעבר…</button></div>';
    h+='<h3>תכנון ביומן</h3><div class="gchips">'+(g.subs&&g.subs.length?'':'')+chipsHtml(g,false).replace(/data-act="g-plan"/g,'data-act="g-plan" data-pick="1"')+'</div><div class="note">אחרי שהפעילות מסומנת כבוצעה ביומן היא נספרת ביעד. תכנון לבדו לא נספר כהתקדמות.</div></div>';
    /* פירוט לפי סוגים */
    if((g.subs||[]).length){
      const rows=g.subs.map(s=>{const x=st.subs[s.id]||{done:0,planned:0};return '<tr><td>'+esc(s.name)+'</td><td>'+x.done+'</td><td>'+x.planned+'</td></tr>'}).join('');
      const o=st.subs['']||{done:0,planned:0};
      const known=new Set(g.subs.map(s=>s.id)),other={done:0,planned:0};
      Object.keys(st.subs).forEach(k=>{if(k&&!known.has(k)){other.done+=st.subs[k].done;other.planned+=st.subs[k].planned}});
      h+='<div class="gsecn"><h2>פירוט לפי סוג</h2><table class="stbl"><tr><th></th><th>הושלמו</th><th>מתוכננות</th></tr>'+rows+'<tr><td>ללא סוג</td><td>'+o.done+'</td><td>'+o.planned+'</td></tr>'+(other.done||other.planned?'<tr><td>סוג שהוסר</td><td>'+other.done+'</td><td>'+other.planned+'</td></tr>':'')+'</table></div>';
    }
    /* פעילויות בתקופה */
    const acts=[...st.doneT,...st.planT,...st.missT].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:cmpT(a,b));
    h+='<div class="gsecn"><h2>פעילויות בתקופה</h2>';
    if(!acts.length&&!st.logs.length)h+='<div class="none">אין עדיין פעילויות בתקופה הזו.</div>';
    acts.forEach(t=>{h+='<div class="arow"><button type="button" class="adate" data-act="g-day" data-d="'+t.date+'">'+esc(dm(t.date))+'</button><div class="agrow">'+taskHtml(t,today)+'</div></div>'});
    st.logs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)).forEach(l=>{
      h+='<div class="arow"><span class="adate">'+esc(dm(l.date))+'</span><div class="lrow"><span class="lok">✓</span><div class="lbody"><div>עדכון ידני'+(l.subId&&(subName(g,l.subId)||l.subName)?' · '+esc(subName(g,l.subId)||l.subName):'')+'</div>'+(l.note?'<div class="det">'+esc(l.note)+'</div>':'')+'</div><button type="button" class="kebab" data-act="g-dellog" data-id="'+l.id+'" aria-label="הסר עדכון">✕</button></div></div>';

    h+='</div>';
    const gen=S.tasks.filter(t=>t.goalId===g.id&&t.general);
    if(gen.length)h+='<div class="gsecn"><h2>משימות כלליות של היעד</h2><div class="note">משימה כללית אינה נספרת ביעד עד ששובצה ליום.</div>'+gen.map(t=>taskHtml(t,today)).join('')+'</div>';
    /* היסטוריה */
    let first=pStart(g.period,dateOfTs(g.createdAt||Date.now()));
    S.tasks.forEach(t=>{if(t.goalId===g.id&&t.date&&!t.general){const s=pStart(g.period,t.date);if(s<first)first=s}});
    S.glog.forEach(l=>{if(l.goalId===g.id){const s=pStart(g.period,l.date);if(s<first)first=s}});
    const past=[];for(let p=first,i=0;p<ps&&i<400;p=pNext(g.period,p),i++)past.push(p);
    h+='<div class="gsecn"><h2>היסטוריה</h2>';
    if(!past.length)h+='<div class="none">עדיין אין תקופות קודמות.</div>';
    past.reverse().slice(0,60).forEach(p=>{
      const x=goalStats(g,p,today),ok=x.done>=x.target,ent=entriesLine(g,x);
      h+='<div class="hrow"><div class="hl"><b>'+esc(pLabel(g.period,p))+'</b><span class="'+(ok?'hok':'hno')+'"><span class="ltr">'+x.done+'/'+x.target+'</span> '+(ok?'✓':'')+'</span></div>'+(ent?'<div class="hent">'+ent+'</div>':'')+'</div>';
    });
    h+='</div>';
    h+='<div class="gfoot"><button type="button" class="gbtn" data-act="g-archive" data-id="'+g.id+'">'+(g.archived?'החזר מהארכיון':'העבר לארכיון')+'</button><div class="note">אין מחיקה של יעד: ההיסטוריה נשמרת תמיד.</div></div></div>';
    return h;
  }catch(e){console.error('goalscreen',e);return '<div class="wrap">'+back+'<div class="loading">אירעה שגיאה בתצוגת היעד.</div></div>'}
}

function collectGoalForm(){
  const m=S.modal;if(!m)return;

function rerenderGoalForm(){collectGoalForm();S.modal.noFocus=true;renderModal()}
function addSubFromInput(silent){
  const m=S.modal;if(!m||m.type!=='goal')return true;
  collectGoalForm();
  const name=(m.vals.subin||'').trim();
  if(!name)return true;
  if(m.vals.subs.some(s=>s.name.toLowerCase()===name.toLowerCase())){if(silent){m.vals.subin='';return true}const e=$('#f_err');if(e)e.textContent='הסוג הזה כבר קיים.';return false}

}
function goalSubmit(fid){
  const m=S.modal;if(!m)return;
  const err=$('#f_err');
  if(fid==='g_form'){
    collectGoalForm();
    const v=m.vals;
    if(!v.title.trim()){err.textContent='כתוב שם ליעד.';return}
    const tg=parseInt(String(v.target).trim(),10);
    if(!/^\d+$/.test(String(v.target).trim())||tg<1||tg>999){err.textContent='הכמות חייבת להיות מספר שלם בין 1 ל־999.';return}
    if(!addSubFromInput(true))return;
    v.target=tg;
    const id=m.id;closeModal();
    const nid=saveGoal(v,id);
    render();toast(id?'היעד עודכן':'היעד נוצר');
    return;
  }
  if(fid==='gl_form'){
    collectGoalForm();
    const v=m.vals,today=todayIL();
    if(!isDate(v.date)){err.textContent='בחר תאריך.';return}
    if(v.date>today){err.textContent='אי אפשר להוסיף פעילות עתידית. לתכנון עתידי השתמש בלוח.';return}
    const gid=m.gid;closeModal();
    addGoalLog(gid,v.date,v.sub,v.note);
    render();toast('הפעילות נוספה ליעד');
  }
}

function goalClick(a,el,id,e){
  if(a.charAt(0)!=='g'||(a.charAt(1)!=='-'&&a.charAt(1)!=='l'))return false;
  const today=todayIL(),m=S.modal;
  if(a==='g-new'){modal({type:'goal',vals:{title:'',desc:'',period:'week',target:'3',subs:[],subin:''}});return true}
  if(a==='g-open'){openGoal(id);return true}
  if(a==='g-edit'){const g=gById(id);if(!g)return true;modal({type:'goal',id:g.id,vals:{title:g.title,desc:g.desc||'',period:g.period,target:String(targetFor(g,pStart(g.period,today))),subs:(g.subs||[]).map(s=>({...s})),subin:''}});return true}
  if(a==='g-arch-toggle'){S.showArch=!S.showArch;render();return true}
  if(a==='g-archive'){const g=gById(id);if(!g)return true;updGoal(id,{archived:!g.archived});toast(g.archived?'היעד הועבר לארכיון':'היעד הוחזר מהארכיון');render();return true}
  if(a==='g-day'){openDay(el.dataset.d);return true}
  if(a==='g-plan'){
    const gid=el.dataset.gid,sub=el.dataset.sub||'';
    if(el.dataset.day){
      if(S.sel<today){toast('אי אפשר לתכנן פעילות ליום שעבר.');return true}
      planGoalTask(gid,sub,S.sel,'');toast('הפעילות נוספה ל־'+dayName(S.sel));return true;
    }
    openDatePicker(today,today,d=>{
      planGoalTask(gid,sub,d,'');
      if(S.view==='month'){S.sel=d;S.month=d.slice(0,7)}
      render();toast('הפעילות תוכננה ל־'+dayName(d));
    });
    return true;
  }
  if(a==='g-inc'){addGoalLog(id,today,el.dataset.sub||'','');render();toast('נוספה פעילות אחת');return true}
  if(a==='g-dec'){
    const g=gById(id);if(!g)return true;
    const ps=pStart(g.period,today),pe=pEnd(g.period,ps);
    const l=S.glog.filter(x=>x.goalId===id&&x.date>=ps&&x.date<=pe).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))[0];
    if(!l){toast('אין עדכון ידני להסרה בתקופה הזו. פעילות מהיומן מבטלים בסימון המשימה ביומן.');return true}
    delGoalLog(l.id);render();toast('העדכון האחרון הוסר');return true;
  }
  if(a==='g-addlog'){modal({type:'glog',gid:id,vals:{date:today,sub:'',note:''}});return true}
  if(a==='g-dellog'){modal({type:'gdel',id});return true}
  if(a==='g-dellog-yes'){const i=m&&m.id;closeModal();if(i)delGoalLog(i);render();return true}
  /* חלון יעד */
  if(!m)return false;
  if(a==='g-per'){collectGoalForm();m.vals.period=el.dataset.k;rerenderGoalForm();return true}
  if(a==='g-tm'||a==='g-tp'){collectGoalForm();const n=parseInt(String(m.vals.target).trim(),10);const base=isNaN(n)?1:n;m.vals.target=String(Math.max(1,Math.min(999,base+(a==='g-tp'?1:-1))));rerenderGoalForm();return true}
  if(a==='g-subadd'){if(addSubFromInput())rerenderGoalForm();return true}
  if(a==='g-subdel'){collectGoalForm();m.vals.subs=m.vals.subs.filter(s=>s.id!==el.dataset.sid);rerenderGoalForm();return true}
  if(a==='gl-date'){collectGoalForm();openDatePicker(m.vals.date,'',d=>{m.vals.date=d;rerenderGoalForm()},todayIL());return true}
  if(a==='gl-sub'){collectGoalForm();m.vals.sub=el.dataset.sid||'';rerenderGoalForm();return true}
  return false;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='g_subin'){e.preventDefault();if(addSubFromInput())rerenderGoalForm()}
});

function makeDb(fs,uid){
  return {
    collection:c=>({onSnapshot:(ok,err)=>FB.onSnapshot(FB.collection(fs,'users',uid,c),sn=>ok({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    doc:p=>{const [c,id]=p.split('/');const r=FB.doc(fs,'users',uid,c,id);return {set:d=>FB.setDoc(r,d),update:d=>FB.updateDoc(r,d),delete:()=>FB.deleteDoc(r)}}
  };
}
function showLogin(msg){$('#login').hidden=false;$('#loginErr').textContent=msg||''}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return 'הכתובת של האתר עדיין לא אושרה ב-Firebase.';if(c==='auth/network-request-failed')return 'אין חיבור לרשת. נסה שוב.';return 'הכניסה נכשלה. נסה שוב.'}
let startedFor=null;
function boot(){
  route();
  if(!window.FB){$('#app').innerHTML='<div class="loading">לא ניתן לטעון את רכיבי החיבור. רענן את הדף.</div>';return}
  const app=FB.initializeApp(FIREBASE_CONFIG),auth=FB.getAuth(app);
  let fs;try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){fs=FB.initializeFirestore(app,{})}
  /* בלי אינטרנט, בדיקת ה־redirect עלולה להיכשל. אם המשתמש כבר מחובר לא מציגים מסך כניסה */
  FB.getRedirectResult(auth).catch(e=>{if(!auth.currentUser)showLogin(authMsg(e))});
  const provider=new FB.GoogleAuthProvider();
  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    try{await FB.signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await FB.signInWithRedirect(auth,provider)}catch(x){showLogin(authMsg(x))}}
      else if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){}
      else showLogin(authMsg(e));
    }
  });
  S.signOut=async()=>{try{await FB.signOut(auth)}catch(e){}location.reload()};
  FB.onAuthStateChanged(auth,user=>{
    if(!user){showLogin();return}
    $('#login').hidden=true;
    if(startedFor===user.uid)return;startedFor=user.uid;
    start(makeDb(fs,user.uid));
  });
}
function start(db){
  S.db=db;
  const bad=()=>{$('#app').innerHTML='<div class="loading">אין גישה למסד הנתונים. נסה לרענן או להתחבר מחדש.</div>'};
  db.collection('cal_series').onSnapshot(sn=>{S.series=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.s=true;render();checkSeries()},bad);
  /* יעדים: ההאזנה לא חוסמת את שאר האפליקציה, ושגיאה בה לא דורסת את המסך */
  db.collection('cal_goals').onSnapshot(sn=>{S.goals=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.g=true;render()},e=>{console.error('goals',e);S.loaded.g=true;render()});
  db.collection('cal_goal_log').onSnapshot(sn=>{S.glog=sn.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error('goal log',e));
  db.collection('cal_tasks').onSnapshot(sn=>{S.tasks=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;render();checkSeries()},bad);
}
