<style>

const VERSION='2.0';
/* ===== העדפות (מראה ושפה): נשמרות במכשיר ב-localStorage. מפתח חדש ונפרד, שום נתון קיים לא נוגע ===== */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
function loadPrefs(){let p={};try{p=JSON.parse(lsGet('cal.prefs')||'{}')||{}}catch(e){p={}}return {theme:['light','dark'].includes(p.theme)?p.theme:'auto',lang:p.lang==='en'?'en':'he',hol:p.hol!==false,hdate:p.hdate!==false,hmonth:p.hmonth===true}}

function _(s,p){let r=(LANG==='en'&&Object.prototype.hasOwnProperty.call(EN,s))?EN[s]:s.split('¦')[0];if(p)r=r.replace(/\{(\w+)\}/g,(m,k)=>p[k]===undefined?'':p[k]);return r}
const MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWN_HE=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DOWN_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOWS_HE=['א','ב','ג','ד','ה','ו','ש'];
const DOWS_EN=['S','M','T','W','T','F','S'];
let MONTHS=MONTHS_HE,DOWN=DOWN_HE,DOWS=DOWS_HE;
/* צבע שורת הכתובת במכשירים שתומכים: בכהה כהה, בבהיר נשאר הצבע המקורי */
function themeColor(){
  const mt=document.querySelector('meta[name="theme-color"]');if(!mt)return;
  const dark=PREFS.theme==='dark'||(PREFS.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  mt.setAttribute('content',dark?'#12131a':'#4a55d0');

  const d=document.documentElement;

const TZ='Asia/Jerusalem';
const HALF=48; /* גובה חצי שעה בציר הזמן, בפיקסלים (חייב להיות זהה ל־--half ב־CSS) */
const pad=n=>String(n).padStart(2,'0');
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function ilParts(){const p=_fmt.formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}

const P=s=>s.split('-').map(Number);
const F=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function addDays(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1,d+n));return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dowOf(s){const [y,m,d]=P(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addMonths(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1+n,1));const yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;return F(yy,mm,Math.min(d,dim(yy,mm)))}
const weekEnd=s=>addDays(s,6-dowOf(s));
const monthEnd=s=>{const [y,m]=P(s);return F(y,m,dim(y,m))};
const monthSpanEnd=s=>addDays(addMonths(s,1),-1); /* חודש מלא החל מ־s: מה־8/10 עד ה־7/11 */

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function occurrences(rule,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const ok=rule.type==='daily'||(rule.type==='weekdays'&&rule.days.includes(dowOf(d)))||(rule.type==='monthdays'&&rule.days.includes(+d.slice(8)));if(ok)out.push(d)}return out}

function status(t,today){if(t.movedTo)return 'moved';if(t.done)return 'done';if(!t.general&&t.date&&t.date<today)return 'missed';return 'open'}

const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

/* טווח שעות: endTime קיים רק אם יש שעת התחלה, והוא אחרי ההתחלה. בלי endTime המשימה מוצגת כחצי שעה */
const endMin=t=>{if(!t.time||!t.endTime)return null;const s=toMin(t.time),e=toMin(t.endTime);return e>s?e:null};
const spanOf=t=>{const s=toMin(t.time),e=endMin(t);return [s,Math.max(e!==null?e:s+30,s+30)]};
function parseDateText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?$/.exec(s);if(!m)return '';
  let y=m[3]?+m[3]:+todayIL().slice(0,4);if(m[3]&&m[3].length===2)y+=2000;
  const r=F(y,+m[2],+m[1]);return isDate(r)?r:'';
}
function parseTimeText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[:.](\d{2})$/.exec(s)||/^(\d{2})(\d{2})$/.exec(s);if(!m)return '';
  const h=+m[1],mi=+m[2];return h<24&&mi<60?pad(h)+':'+pad(mi):'';
}

/* ===== תזכורות =====
   מבנה שמור במשימה: reminders=[{t:'before',m:0|5|15|60},{t:'at',time:'HH:MM'}]
   'before' = לפני שעת המשימה (רק למשימה עם שעה; m=0 = "בזמן המשימה", מגרסה 2.0). 'at' = שעה מוחלטת באותו יום.
   reminderTimes מחזירה את הזמנים המחושבים. השליחה עצמה בשרת ("סוכן המשימות"), לפי הרשימה push_jobs שהאפליקציה מחשבת */
const REM_BEFORE=[0,5,15,60];
function remList(t){
  const a=Array.isArray(t.reminders)?t.reminders:[];
  return a.filter(r=>r&&((r.t==='before'&&t.time&&REM_BEFORE.includes(r.m))||(r.t==='at'&&/^\d{2}:\d{2}$/.test(r.time||''))));
}
function remSort(a){
  const b=a.filter(r=>r.t==='before').sort((x,y)=>y.m-x.m),c=a.filter(r=>r.t==='at').sort((x,y)=>x.time<y.time?-1:x.time>y.time?1:0);
  return [...b,...c];
}
const remLabel=r=>r.t==='at'?r.time:r.m===0?_('בזמן המשימה'):(r.m===60?_('שעה¦h'):r.m+(' '+_('דק׳')));
/* ליד התזכורות מופיעה הערה רק כשאף מכשיר בחשבון לא הפעיל התראות (ואז אין לאן לשלוח) */
const remText=a=>{const l=remSort(a);if(!l.length)return '';const off=S.loaded.ps&&!S.pushSubs.length;return '🔔 '+l.map(remLabel).join(' · ')+(off?' ('+_('התראות לא הופעלו באף מכשיר')+')':'')};
function reminderTimes(t){
  if(!t.date)return [];
  return remSort(remList(t)).map(r=>{
    if(r.t==='at')return {date:t.date,time:r.time,k:'at'};
    const n=toMin(t.time)-r.m;
    return n>=0?{date:t.date,time:fromMin(n),k:'before'}:{date:addDays(t.date,-1),time:fromMin(n+1440),k:'before'};
  });
}
const sameRem=(a,b)=>JSON.stringify(remSort(a||[]))===JSON.stringify(remSort(b||[]));

/* ===== שכבת נתונים: מתאימה לעבודה בלי אינטרנט =====
   כל כתיבה היא "שגר ושכח": הכתיבה נרשמת מיד במטמון המקומי של Firestore ומסונכרנת לשרת כשיש חיבור.
   לא מחכים לאישור השרת, ולכן אף פעולה לא נתקעת בלי רשת. עדכונים הם ברמת שדה (update), לא דריסה של כל המסמך.
   מחיקת שדה מתבצעת על ידי כתיבת ערך ריק ('' / false). מזהים של משימות חוזרות קבועים (סדרה_תאריך) כדי שלא ייווצרו כפילויות. */
function bg(fn){
  try{const p=fn();if(p&&p.catch)p.catch(e=>{console.error(e);toast(_('השינוי לא נשמר. נסה שוב.'))})}
  catch(e){console.error(e);toast(_('השינוי לא נשמר. נסה שוב.'))}
}
const dbSet=(c,id,o)=>{undoMark(c,id);bg(()=>S.db.doc(c+'/'+id).set(clean(o)))};
const dbUpd=(c,id,p)=>{undoMark(c,id);bg(()=>S.db.doc(c+'/'+id).update(clean(p)))};

/* ===== ביטול (Undo) אחרי מחיקה וגרירה =====
   לפני הפעולה מצלמים את הנתונים בזיכרון, בזמן הפעולה רושמים בדיוק אילו מסמכים נכתבו,
   ובביטול מחזירים רק אותם למצבם הקודם (מסמך שנוצר בפעולה נמחק, מסמך שנמחק או השתנה נכתב מחדש כמו שהיה) */
const UNDO_COLL={cal_tasks:'tasks',cal_series:'series',cal_goals:'goals',cal_goal_log:'glog'};
let UNDO_REC=null,UNDO_LAST=null,undoT=0;
function undoMark(c,id){if(UNDO_REC&&UNDO_COLL[c]&&!UNDO_REC.ids.some(x=>x[0]===c&&x[1]===id))UNDO_REC.ids.push([c,id])}
function withUndo(label,fn){
  const snap={};for(const c in UNDO_COLL)snap[c]=new Map((S[UNDO_COLL[c]]||[]).map(d=>[d.id,JSON.parse(JSON.stringify(d))]));
  const rec={ids:[],snap,label,msg:''},prev=UNDO_REC;UNDO_REC=rec;
  try{fn()}finally{UNDO_REC=prev}
  if(rec.ids.length)offerUndo(rec);else if(rec.msg)toast(rec.msg);
}
function offerUndo(rec){
  UNDO_LAST=rec;const e=$('#undo');if(!e)return;
  const tt=$('#toast');if(tt)tt.style.display='none';
  e.innerHTML='<span>'+esc(rec.msg||rec.label)+'</span><button type="button" data-act="undo">'+_('בטל')+'</button>';
  e.style.display='flex';clearTimeout(undoT);undoT=setTimeout(hideUndo,6000);
}
function hideUndo(){UNDO_LAST=null;const e=$('#undo');if(e)e.style.display='none'}
function doUndo(){
  const rec=UNDO_LAST;hideUndo();if(!rec)return;
  rec.ids.forEach(([c,id])=>{
    const b=rec.snap[c].get(id),arr=S[UNDO_COLL[c]],i=arr.findIndex(x=>x.id===id);
    if(b){const data={...b};delete data.id;dbSet(c,id,data);if(i>=0)arr[i]=b;else arr.push(b)}
    else{dbDel(c,id);if(i>=0)arr.splice(i,1)}

/* פריסת משימות עם שעה: משימות שחופפות בזמן מוצגות זו לצד זו */
function layoutDay(timed){
  const it=timed.map(t=>{const [s,e]=spanOf(t);return {t,s,e}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],ce=0,cols=[];
  const flush=()=>{cl.forEach(x=>x.cols=cols.length);out.push(...cl);cl=[];cols=[];ce=0};
  for(const x of it){
    if(cl.length&&x.s>=ce)flush();
    let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}
    cols[c]=x.e;x.col=c;cl.push(x);ce=Math.max(ce,x.e);
  }
  flush();return out;
}
/* ציר הזמן הקומפקטי: שעה שיש בה משימה מוצגת בגובה מלא (96px), שעה ריקה בגובה מצומצם (24px).
   זה שינוי תצוגה בלבד: השעות והחישובים נשארים בדקות. בזמן גרירה השעה שמתחת לאצבע מורחבת (hoverHour). */
const CH=24,FH=2*HALF;
const hourH=h=>(S.tl.occ.has(h)||S.tl.exp===h)?FH:CH;
function yOfMin(m){const lo=S.tl.lo/60,hh=Math.floor(m/60);let y=0;for(let h=lo;h<hh&&h<24;h++)y+=hourH(h);if(hh<24)y+=(m-hh*60)/60*hourH(hh);return y}
function minOfY(y){let h=S.tl.lo/60;if(y<0)return S.tl.lo+y/hourH(h)*60;while(h<24){const k=hourH(h);if(y<k)return h*60+y/k*60;y-=k;h++}return 1440}
function linesHtml(){
  let s='';
  for(let h=S.tl.lo/60;h<24;h++){
    const full=S.tl.occ.has(h)||S.tl.exp===h,y=yOfMin(h*60);
    s+='<div class="gline hr'+(full?'':' cmp')+'" style="top:'+y+'px"><span class="st">'+pad(h)+':00</span></div>';
    if(full)s+='<div class="gline half" style="top:'+(y+HALF)+'px"><span class="st">'+pad(h)+':30</span></div>';
  }
  return s;
}
function applyScale(){
  const tl=$('#tl');if(!tl)return;
  tl.style.height=yOfMin(1440)+'px';
  $('#glines').innerHTML=linesHtml();
  tl.querySelectorAll('.blk').forEach(b=>{const s=+b.dataset.s,e=+b.dataset.e;b.style.top=(yOfMin(s)+1)+'px';b.style.height=(yOfMin(e)-yOfMin(s)-2)+'px'});
}
function renderDay(){

  const list=S.tasks.filter(t=>!t.general&&t.date===d).sort(cmpT);
  const timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let lo=360;timed.forEach(t=>{lo=Math.min(lo,Math.floor(toMin(t.time)/60)*60)});
  const occ=new Set();
  timed.forEach(t=>{const [s,e]=spanOf(t);for(let h=Math.floor(s/60);h<=Math.floor((Math.min(e,1440)-1)/60);h++)occ.add(h)});
  S.tl={lo,occ,exp:null};

  const pv=S.view+'|'+S.sel;S.expand='';

const mkInst=(s,d,i,now)=>({title:s.title,details:s.details||'',time:s.time||'',endTime:s.endTime||'',date:d,done:false,seriesId:s.id,reminders:s.reminders||[],createdAt:now+i});
function createQuick(title,time,date){
  dbSet('cal_tasks',newId(),{title,time:time||'',endTime:'',date,done:false,reminders:[],createdAt:Date.now()});
}
function createGeneral(title,details,o){
  o=o||{};
  dbSet('cal_tasks',newId(),{title,details:details||'',time:'',endTime:'',date:'',general:true,done:false,reminders:[],createdAt:Date.now(),genAt:todayIL(),exp:o.exp||'',...(o.subs&&o.subs.length?{subs:o.subs}:{})});
}
function createTask(v,r){
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'',details=(v.details||'').trim();
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(r.type==='none'){dbSet('cal_tasks',newId(),{title,details,time,endTime,date:v.date,done:false,reminders,createdAt:Date.now(),...(v.subs&&v.subs.length?{subs:cleanSubs(v.subs)}:{})});return {count:1}}
  const today=todayIL();
  const end=r.type==='monthdays'?monthEnd(today):r.type==='daily'?monthSpanEnd(today):weekEnd(today);
  const rule={type:r.type,days:r.type==='weekdays'?r.wd:r.type==='monthdays'?r.md:[]};
  const dates=occurrences(rule,today,end);
  const sid=newId(),now=Date.now();
  const s={id:sid,title,details,time,endTime,reminders,type:rule.type,days:rule.days,start:today,through:end,ended:false,createdAt:now};
  dbSet('cal_series',sid,s);
  dates.forEach((d,i)=>dbSet('cal_tasks',sid+'_'+d,mkInst(s,d,i,now)));
  return {count:dates.length,monthly:r.type==='monthdays',daily:r.type==='daily'};
}
function editTask(id,scope,v){
  const t=T(id);if(!t)return;
  const details=(v.details||'').trim();
  if(t.general){updTask(id,{title:v.title.trim(),details,subs:cleanSubs(v.subs||[]),exp:v.exp||'',genAt:genStart(t)});return}
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'';
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(scope==='from'&&t.seriesId){
    /* "מהיום והלאה" לא משנה ימים שכבר עברו, גם כשהתחלנו ממופע של יום שעבר */
    const from=t.date<todayIL()?todayIL():t.date;
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=from&&!x.movedTo);
    list.forEach(x=>updTask(x.id,{title,details,time,endTime,reminders}));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{title,details,time,endTime,reminders});
  }else{
    const sp=t.seriesId?{}:subsPatch(t,cleanSubs(v.subs||[]));
    updTask(id,{title,details,time,endTime,reminders,date:isDate(v.date)?v.date:t.date,...sp});
  }
}
function deleteTask(id,scope){
  const t=T(id);if(!t)return;
  if(scope==='from'&&t.seriesId){
    /* "מהיום והלאה" לא מוחק ימים שכבר עברו, גם כשהתחלנו ממופע של יום שעבר */
    const from=t.date<todayIL()?todayIL():t.date;
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=from);
    const ids=new Set(list.map(x=>x.id));
    S.tasks=S.tasks.filter(x=>!ids.has(x.id));
    list.forEach(x=>dbDel('cal_tasks',x.id));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{ended:true});
    return;
  }
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  if(t.movedToId&&T(t.movedToId))updTask(t.movedToId,{movedFrom:'',movedFromId:''});
  S.tasks=S.tasks.filter(x=>x.id!==id);
  dbDel('cal_tasks',id);
}
function moveTask(id,nd){
  const t=T(id);if(!t)return;
  const nid=newId();
  dbSet('cal_tasks',nid,{title:t.title,details:t.details||'',time:t.time||'',endTime:t.endTime||'',date:nd,done:false,reminders:t.reminders||[],movedFrom:t.date,movedFromId:t.id,...(t.seriesId?{seriesId:t.seriesId}:{}),...(t.goalId?{goalId:t.goalId,goalSub:t.goalSub||''}:{}),...(t.subs&&t.subs.length?{subs:t.subs.map(x=>({...x}))}:{}),createdAt:Date.now()});
  updTask(t.id,{movedTo:nd,movedToId:nid});
}
/* הפיכת משימה עם תאריך למשימה כללית: מוחקים רק תאריך ושעה. שם, פרטים, תזכורות וקישור ליעד נשמרים.
   לא חלה על משימה חוזרת. אם זו משימה שהועברה מיום שהוחמץ, הקישור להיסטוריה מתנתק והמקור חוזר להיות "הוחמצה" */
const canGeneral=t=>!!t&&!t.general&&!t.seriesId&&!t.movedTo;
function toGeneral(id){
  const t=T(id);if(!canGeneral(t))return false;
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  updTask(id,{general:true,date:'',time:'',endTime:'',movedFrom:'',movedFromId:'',genAt:todayIL(),exp:''});

}
/* משימות חוזרות נוצרות רק לתקופה הנוכחית (שבוע, חודש או חודש מלא מהיום). בסוף התקופה שואלים אם להמשיך */
const periodEnd=(type,d)=>type==='monthdays'?monthEnd(d):type==='daily'?monthSpanEnd(d):weekEnd(d);
function seriesDue(s,today){return !s.ended&&today>=addDays(s.through,-1)}
function continueSeries(s){
  const today=todayIL();
  const from=addDays(s.through,1)>today?addDays(s.through,1):today;
  const end=periodEnd(s.type,from);
  const dates=occurrences(s,from,end).filter(d=>!T(s.id+'_'+d));
  const now=Date.now();
  /* קודם מעדכנים את סוף התקופה, כדי שהצצת הנתונים שמגיעה בזמן הכתיבה לא תשאל שוב */
  updSeries(s.id,{through:end});
  dates.forEach((d,i)=>dbSet('cal_tasks',s.id+'_'+d,mkInst(s,d,i,now)));
}
function checkSeries(){
  if(S.modal||S.pick||S.dragging||!S.loaded.t||!S.loaded.s)return;
  const today=todayIL();
  /* כל הסדרות שנגמרות בקרוב, בחלון אחד. לא שואלים ביום שבו הסדרה נוצרה */
  const due=S.series.filter(x=>seriesDue(x,today)&&!S.dismissed.has(x.id)&&x.start!==today);
  if(due.length)modal({type:'cont',sids:due.map(x=>x.id)});

/* ===== גרירה =====

   ידיות למעלה ולמטה של משימה בציר הזמן: גרירה מיידית (בלי לחיצה ארוכה) שמשנה את שעת ההתחלה או הסיום.

const DR={imm:false,hv:null,on:false,mode:null,kind:'move',id:null,chip:null,sx:0,sy:0,x:0,y:0,timer:0,ghost:null,raf:0,zone:0,zoneT:0,prop:null,p0:0,fromTl:false,endT:-1e9};

/* ציר קומפקטי: כשהמצביע נח מעל שעה ריקה (רבע שנייה בערך) היא מתרחבת לגובה מלא כדי לבחור זמן מדויק.
   עד אז עוברים מהר בין שעות ריקות בגובה המצומצם. מעגנים את הגלילה כך שהשעה נשארת מתחת למצביע */
const HOVER_MS=110;
function hoverCheck(y){
  DR.hvSeen=true;
  const tl=$('#tl');if(!tl){DR.hv=null;return}
  const m=minOfY(y-tl.getBoundingClientRect().top);
  if(m<S.tl.lo||m>=1440){DR.hv=null;return}
  const h=Math.floor(m/60),want=S.tl.occ.has(h)?null:h;
  if(want===S.tl.exp){DR.hv=null;return}
  if(!DR.hv||DR.hv.h!==h)DR.hv={h,want,t:performance.now()};
}
function hoverApply(){
  const hv=DR.hv,tl=$('#tl');
  if(!hv||!tl||performance.now()-hv.t<HOVER_MS)return false;
  DR.hv=null;
  const before=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  S.tl.exp=hv.want;applyScale();
  const after=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  if(Math.abs(after-before)>.5)window.scrollBy(0,after-before);
  /* שעה מורחבת שיורדת מתחת לתיבת "ללא שעה" הצמודה למטה: גוללים מעט כדי שתהיה נגישה, בלי להוציא את המצביע ממנה */
  if(hv.want!==null){
    const nt=$('#nt'),lim=(nt?nt.getBoundingClientRect().top:innerHeight)-10,bottom=tl.getBoundingClientRect().top+yOfMin((hv.h+1)*60);
    if(bottom>lim&&DR.y<lim-2){const d=Math.min(bottom-lim,bottom-DR.y-2);if(d>0)window.scrollBy(0,d)}
  }
  return true;
}
function proposeMove(t,min){
  const em=t.time?endMin(t):null,dur=em!==null?em-toMin(t.time):0;
  let s;
  if(DR.fromTl&&t.time){const s0=toMin(t.time),delta=min-DR.p0;s=Math.abs(delta)<15?s0:Math.max(0,Math.min(snap30(s0+delta),dur?floor30(1439-dur):1410))}
  else s=Math.max(0,Math.min(floor30(min),dur?floor30(1439-dur):1410));
  return {k:'tl',s,e:dur?s+dur:null};
}

  return {k:'tl',s:ns,e:e0,same:ns===s0};
}

  const src=DR.chip?null:document.querySelector('.tk[data-id="'+DR.id+'"]');
  DR.fromTl=!!(src&&src.classList.contains('blk'));
  DR.p0=S.view==='day'?minAt(DR.sy):0;
  DR.prop=null;
  /* המקום שממנו גוררים נשאר מסומן במסגרת מקווקוות ריקה, והמשימה עצמה לא מוצגת שם בזמן הגרירה */
  if(DR.kind==='move'&&!DR.chip&&DR.id)document.querySelectorAll('.tk[data-id="'+DR.id+'"],.cell .t[data-tid="'+DR.id+'"]').forEach(e=>e.classList.add('lifted'));
  if(DR.kind==='move'){const g=document.createElement('div');g.className='ghost';g.textContent=t.title;document.body.appendChild(g);DR.ghost=g}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  dragMove(x,y);
  const loop=()=>{
    if(!DR.on)return;
    const nt=$('#nt'),boxTop=nt?nt.getBoundingClientRect().top:innerHeight;
    let sp=0,zone=0;
    if(DR.y<90){zone=-1;sp=-Math.ceil((90-DR.y)/90*16)}
    else if(DR.y>boxTop-70&&DR.y<boxTop){zone=1;sp=Math.ceil((DR.y-(boxTop-70))/70*16)}
    const now=performance.now();
    if(zone!==DR.zone){DR.zone=zone;DR.zoneT=now}
    /* גלילה אוטומטית רק אחרי שהאצבע נשארת בקצה רבע שנייה, כדי שלא תתחיל בטעות בזמן שגוררים החוצה מ"ללא שעה" */
    if(sp&&now-DR.zoneT>250){window.scrollBy(0,sp);dragMove(DR.x,DR.y)}

}
function genZone(el,t){
  /* אזור "משימות כלליות": משימה עם תאריך נגררת אליו והופכת לכללית. משימה חוזרת לא */
  const z=el&&el.closest?el.closest('[data-drop="general"]'):null;

  if(canGeneral(t)){z.classList.add('over');return {k:'gen'}}

}
function dragMove(x,y){

  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  let prop=null;DR.hvSeen=false;
  if(DR.kind==='move'){
    const el=document.elementFromPoint(x,y);
    if(S.view==='month'){
      const c=el&&el.closest?el.closest('.cell[data-d]'):null;
      if(c){
        const d=c.dataset.d;
        if(!t.general&&d===t.date)prop={k:'cell',d,same:true};
        else if(S.moving&&S.moving.complete&&S.moving.id===DR.id?d>todayIL():(d<todayIL()&&!DR.chip))prop={k:'cell',d,bad:true};
        else{c.classList.add('over');prop={k:'cell',d}}
      }else prop=genZone(el,t);
    }else if(S.view==='day'&&el&&el.closest){
      const gz=genZone(el,t);
      if(gz)prop=gz;
      else{
        const nz=el.closest('[data-drop="none"]');
        if(nz){nz.classList.add('over');prop={k:'none'}}

    hoverCheck(y);

  }

}
function dropChip(prop){

  planGoalTask(DR.chip.gid,DR.chip.sub,d,time);

function applyDrop(t,prop){
  const today=todayIL();
  const pastBlock=()=>{toast(_('אי אפשר להוסיף משימה ליום שעבר.'))};
  if(DR.chip){dropChip(prop);return}
  let patch=null;
  if(prop.k==='gen'){
    if(prop.bad){toast(_('משימה חוזרת לא הופכת למשימה כללית.'));return}
    if(toGeneral(t.id))toast(_('המשימה הפכה למשימה כללית')+(t.goalId?('. '+_('משימה כללית לא נספרת ביעד עד ששובצה ליום.')):''));
    return;
  }
  if(prop.k==='cell'){
    if(prop.same)return;
    if(prop.d<today){if(t.general)pastBlock();else toast(_('אי אפשר להעביר משימה ליום שעבר.'));return}
    if(t.general){
      patch={general:false,date:prop.d,time:'',endTime:''};S.sel=prop.d;S.month=prop.d.slice(0,7);
      toast(_('המשימה עברה ל־')+dayName(prop.d));
    }else{
      /* משימה עם תאריך: משנים רק את התאריך. שעה, טווח, שם, פרטים, תזכורות ושאר הנתונים נשארים.
         משימה שהוחמצה עוברת דרך מנגנון ההעברה הקיים, ששומר היסטוריה */
      S.sel=prop.d;S.month=prop.d.slice(0,7);
      relocate(t,prop.d);toast(_('המשימה עברה ל־')+dayName(prop.d));return;
    }
  }else if(prop.k==='none'){
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:'',endTime:''};toast(_('המשימה עברה ל־')+dayName(S.sel))}
    else if(t.time)patch={time:'',endTime:''};
  }else if(prop.k==='tl'&&!prop.same){
    const nt=fromMin(prop.s),ne=prop.e?fromMin(Math.min(prop.e,1439)):'';
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:nt,endTime:ne};toast(_('המשימה עברה ל־')+dayName(S.sel))}
    else if(t.time!==nt||(t.endTime||'')!==ne)patch={time:nt,endTime:ne};
  }
  if(patch)updTask(t.id,patch);
}
function dragEnd(commit){
  if(!DR.on)return;
  cancelAnimationFrame(DR.raf);
  const prop=DR.prop,t=dragTask();
  DR.on=false;S.dragging=false;DR.prop=null;DR.hv=null;DR.endT=performance.now();
  document.body.classList.remove('dragging');
  if(DR.ghost){DR.ghost.remove();DR.ghost=null}
  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  const ind=$('#ind');if(ind)ind.remove();
  /* אחרי השחרור הציר מתכווץ מחדש. מעגנים את הגלילה לשעה שבה הונחה המשימה */
  let hh=null,y0=0;
  const tl0=$('#tl');
  if(commit&&prop&&prop.k==='tl'&&tl0){hh=Math.floor(prop.s/60);y0=tl0.getBoundingClientRect().top+yOfMin(hh*60)}
  if(commit&&prop&&t&&S.moving&&S.moving.complete&&S.moving.id===DR.id&&!DR.chip){
    DR.chip=null;DR.imm=false;S.pending=false;
    if(prop.k==='cell'&&!prop.bad)completePick(prop.d);else render();
    return;
  }
  if(commit&&prop&&t){
    withUndo(_('המשימה הועברה'),()=>applyDrop(t,prop));
    if(S.moving&&S.moving.id===DR.id&&prop.k==='cell'&&!prop.same&&!prop.bad&&!DR.chip)S.moving=null;
  }
  DR.chip=null;DR.imm=false;
  S.pending=false;render();
  if(hh!==null){const tl=$('#tl');if(tl){const y1=tl.getBoundingClientRect().top+yOfMin(hh*60);if(Math.abs(y1-y0)>1)window.scrollBy(0,y1-y0)}}
}

function slotTap(e){
  /* לא בהקשה השנייה של הקשה כפולה, ולא מיד אחרי פתיחת מסך היום (כדי שהקשה שפתחה את היום לא תפתח גם את החלון) */

/* ===== יעדים =====
   cal_goals:    {title,desc,period:'week'|'month',target,targetHist:[{from,target}],subs:[{id,name}],archived,createdAt}
   cal_goal_log: {goalId,date,subId,subName,note,createdAt}   (עדכון ידני: פעילות שבוצעה בלי משימה ביומן)
   משימה ביומן שקשורה ליעד: cal_tasks עם goalId (ו־goalSub אופציונלי).
   ההתקדמות לא נשמרת כמספר: היא תמיד מחושבת מהרשומות, לכן אי אפשר לספור פעילות פעמיים:
   הושלמו = משימות מקושרות שסומנו כבוצעו (לפי תאריך המשימה ביומן, בתוך התקופה) + רשומות ידניות בתקופה.
   מתוכננות = משימות מקושרות שלא בוצעו ותאריכן היום או אחר כך, בתוך התקופה.
   תקופה חדשה = טווח תאריכים חדש, ולכן הספירה מתחילה מאפס. תקופות קודמות נשארות כהיסטוריה (שום דבר לא נמחק). */
const gById=id=>S.goals.find(g=>g.id===id);
/* מצבי יעד: פעיל (ברירת מחדל), הוסר מהפעילים (removed), בארכיון (archived). בשני המצבים הלא־פעילים כל הנתונים נשמרים: המשימות, הרשומות והיסטוריית התקופות */
const gIsActive=()=>true;
const gSort=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
/* אין יעדים "לא פעילים" ואין ארכיון: כל היעדים מוצגים (גם כאלה שסומנו בעבר כהוסרו/בארכיון), ויעד שלא רוצים מוחקים */
const gActive=()=>S.goals.slice().sort(gSort);
const gInactive=()=>[];
const pStart=(per,d)=>per==='week'?addDays(d,-dowOf(d)):d.slice(0,7)+'-01';
const pEnd=(per,ps)=>per==='week'?addDays(ps,6):monthEnd(ps);
const pNext=(per,ps)=>per==='week'?addDays(ps,7):addMonths(ps,1);
const pLabel=(per,ps)=>{if(per==='week')return (_('שבוע')+' ')+dm(ps)+'–'+dm(pEnd(per,ps));const [y,m]=P(ps);return MONTHS[m-1]+' '+y};
const perName=per=>per==='week'?_('שבועי'):_('חודשי');
const perUnit=per=>per==='week'?_('בשבוע'):_('בחודש');
function dateOfTs(ts){const p=_fmt.formatToParts(new Date(ts));const g=t=>p.find(x=>x.type===t).value;return g('year')+'-'+g('month')+'-'+g('day')}
function targetFor(g,ps){
  const h=Array.isArray(g.targetHist)?g.targetHist:[];let best=null;
  for(const x of h)if(x.from<=ps&&(!best||x.from>=best.from))best=x;
  return best?best.target:(h.length?h[0].target:g.target);
}
function subName(g,id){const s=(g.subs||[]).find(x=>x.id===id);return s?s.name:''}
function goalTaskTitle(gid,sub){const g=gById(gid);if(!g)return _('פעילות');const n=sub?subName(g,sub):'';return g.title+(n?' · '+n:'')}
function goalStats(g,ps,today){
  const pe=pEnd(g.period,ps);
  const tasks=S.tasks.filter(t=>t.goalId===g.id&&!t.general&&t.date&&t.date>=ps&&t.date<=pe&&!t.movedTo);
  const doneT=tasks.filter(t=>t.done),planT=tasks.filter(t=>!t.done&&t.date>=today),missT=tasks.filter(t=>!t.done&&t.date<today);
  const logs=S.glog.filter(l=>l.goalId===g.id&&l.date>=ps&&l.date<=pe);
  const subs={};const add=(id,k)=>{id=id||'';(subs[id]=subs[id]||{done:0,planned:0})[k]++};
  doneT.forEach(t=>add(t.goalSub,'done'));logs.forEach(l=>add(l.subId,'done'));planT.forEach(t=>add(t.goalSub,'planned'));
  return {ps,pe,target:targetFor(g,ps),done:doneT.length+logs.length,planned:planT.length,doneT,planT,missT,logs,subs};
}
const plannedText=n=>n===0?_('אין פעילויות מתוכננות'):n===1?_('פעילות אחת מתוכננת'):n+(' '+_('פעילויות מתוכננות'));
const doneText=st=>'<span class="ltr">'+st.done+'/'+st.target+('</span> '+_('הושלמו'));
const pct=st=>Math.max(0,Math.min(100,Math.round(st.done/st.target*100)));

function planGoalTask(gid,sub,date,time,done){

function addGoalLog(gid,date,sub,note){
  const g=gById(gid);if(!g)return;

function delGoalLog(id){S.glog=S.glog.filter(l=>l.id!==id);dbDel('cal_goal_log',id)}
/* מחיקת יעד: היעד והעדכונים הידניים שלו נמחקים. משימות שתוכננו לו נשארות ביומן כמשימות רגילות (רק הקישור ליעד מוסר) */
function deleteGoal(id){
  S.tasks.filter(t=>t.goalId===id).forEach(t=>updTask(t.id,{goalId:'',goalSub:''}));
  S.glog.filter(l=>l.goalId===id).forEach(l=>delGoalLog(l.id));
  S.goals=S.goals.filter(g=>g.id!==id);S.gOpen.delete(id);dbDel('cal_goals',id);
  if(S.view==='goal'&&S.goalId===id)backToMonth();else render();

function updGoal(id,p){const g=gById(id);if(g)Object.assign(g,p);dbUpd('cal_goals',id,p)}
function saveGoal(v,id){
  const title=v.title.trim(),desc=(v.desc||'').trim(),target=parseInt(v.target,10),subs=v.subs.map(s=>({id:s.id,name:s.name}));
  const today=todayIL();
  if(!id){
    const nid=newId(),ps=pStart(v.period,today);
    const g={title,desc,period:v.period,target,targetHist:[{from:ps,target}],subs,archived:false,createdAt:Date.now()};
    S.goals.push({id:nid,...g});dbSet('cal_goals',nid,g);return nid;
  }
  const g=gById(id);if(!g)return id;
  const patch={title,desc,subs};
  const ps=pStart(g.period,today);
  if(target!==targetFor(g,ps)){
    patch.target=target;
    patch.targetHist=[...(g.targetHist||[]).filter(x=>x.from!==ps),{from:ps,target}].sort((a,b)=>a.from<b.from?-1:1);
  }
  updGoal(id,patch);return id;
}

/* פתיחה וסגירה אוטומטית לפי הגלילה: מגיעים לסוף ציר השעות = נפתחים, חוזרים לשעות = חוזרים לקומפקטי.
   רק על גלילה של המשתמש, עם היסטרזיס ועם השהיה, ובלי רינדור מחדש (כדי שלא יהיו קפיצות). פתיחה ידנית מבטלת את האוטומט עד שמחליפים יום */
function applyDayUI(){
  [['gen','#gen'],['goals','#dgoals']].forEach(([k,sel])=>{
    const e=$(sel);if(!e)return;e.classList.toggle('open',secOpen(k));
    const b=e.querySelector('.sechb');if(b)b.setAttribute('aria-expanded',secOpen(k));
  });
  /* כששני החלקים פתוחים, התיבה התחתונה מוצגת במלואה (בלי הגבלת הגובה) והדף עצמו נגלל */
  const nt=$('#nt');if(nt)nt.classList.toggle('full',secOpen('gen')&&secOpen('goals'));
}
function dayScrollCheck(){
  if(S.view!=='day')return;
  const u=S.dayUI,sy=window.scrollY,prev=u.ly==null?sy:u.ly;u.ly=sy;
  const vh=innerHeight,max=document.documentElement.scrollHeight-vh,open=!!(u.gen&&u.goals);
  /* השיא נמדד עד תחתית הדף בלבד, כדי שקפיצת הקצה של iOS לא תיחשב גלילה למעלה */
  if(open)u.peak=Math.max(u.peak||0,Math.min(sy,max));
  if(S.dragging||BAR_DRAG||u.manual||S.modal||S.pick)return;
  if(performance.now()<(S.noAutoUntil||0))return;
  const tl=$('#tl');if(!tl)return;
  if(!open){
    /* פתיחה: רק בגלילה כלפי מטה, כשמגיעים לסוף הדף וסוף ציר השעות נראה */
    if(sy>prev&&sy>0&&sy>=max-40&&tl.getBoundingClientRect().bottom<=vh-6)dayOpenSecs();
    return;
  }
  /* סגירה רק כשחוזרים בפועל לתוך ציר השעות: סוף הציר יצא מהמסך למטה (או, ביום שהציר שלו קצר ונכנס כולו במסך, חזרה לראש הדף). גלילה קטנה למעלה מעל החלקים הפתוחים לא סוגרת */
  if((tl.getBoundingClientRect().bottom>vh+40||(sy<=2&&(u.peak||0)>=80))&&performance.now()-(u.openT||0)>250){u.gen=false;u.goals=false;u.peak=0;applyDayUI()}
}
function dayOpenSecs(){const u=S.dayUI;u.gen=true;u.goals=true;u.peak=Math.min(window.scrollY,document.documentElement.scrollHeight-innerHeight);u.openT=performance.now();applyDayUI()}
/* כשהדף כבר בתחתית אין אירוע גלילה, לכן ניסיון לגלול למטה (גלגלת או החלקה באצבע) בתחתית פותח את החלקים */
function dayPushDown(){
  if(S.view!=='day')return;const u=S.dayUI;
  if((u.gen&&u.goals)||S.dragging||u.manual||S.modal||S.pick||performance.now()<(S.noAutoUntil||0))return;
  const tl=$('#tl');if(!tl)return;
  const vh=innerHeight,max=document.documentElement.scrollHeight-vh;
  if(window.scrollY>=max-2&&tl.getBoundingClientRect().bottom<=vh-6)dayOpenSecs();
}
addEventListener('wheel',e=>{if(e.deltaY>0)dayPushDown()},{passive:true});
let dayTY=null;
addEventListener('touchstart',e=>{dayTY=e.touches.length===1?e.touches[0].clientY:null},{passive:true});
addEventListener('touchmove',e=>{if(dayTY===null||e.touches.length!==1)return;if(dayTY-e.touches[0].clientY>12){dayTY=null;dayPushDown()}},{passive:true});
/* גרירת פס הגלילה בעכבר (הלחיצה מגיעה ל-html עצמו): בזמן הגרירה לא פותחים ולא סוגרים את החלקים, כי שינוי גובה הדף מקפיץ את פס הגלילה מתחת לעכבר.
   אחרי השחרור בודקים פעם אחת לפי המקום שבו נעצרו */
let BAR_DRAG=false;
document.addEventListener('mousedown',e=>{if(e.button===0&&e.target===document.documentElement)BAR_DRAG=true},true);
addEventListener('mouseup',()=>{if(!BAR_DRAG)return;BAR_DRAG=false;if(S.dayUI)S.dayUI.ly=-1;dayScrollCheck()},true);
function entriesLine(g,st){

  return items.slice(0,14).map(x=>dm(x.d)+(x.s&&subName(g,x.s)?' '+esc(subName(g,x.s)):'')).join(' · ');
}

/* ===== לוח עברי: חישוב מקומי (בלי אינטרנט ובלי ספריות), לפי האלגוריתם הסטנדרטי של הלוח העברי (מולד ודחיות).
   תאריכים לועזיים הם מחרוזות "YYYY-MM-DD". החגים לפי מנהג ארץ ישראל (יום טוב אחד), כולל הזזות של ימי זיכרון ועצמאות וצומות ===== */
const HEB_EPOCH=-1373427;
const hebLeap=y=>(7*y+1)%19<7;
function hebElapsed(y){const m=Math.floor((235*y-234)/19),p=12084+13753*m;let d=29*m+Math.floor(p/25920);if((3*(d+1))%7<3)d++;return d}
const hebNY=y=>{const l=hebElapsed(y-1),p=hebElapsed(y),n=hebElapsed(y+1);return HEB_EPOCH+p+(n-p===356?2:p-l===382?1:0)};
const fixedOf=s=>{const [y,m,d]=P(s);return Math.round(Date.UTC(y,m-1,d)/86400000)+719163};
const dateOfFixed=f=>{const t=new Date((f-719163)*86400000);return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())};
/* חודשי השנה לפי הסדר מתשרי. במקום "אדר" בשנה מעוברת יש "אדר א׳" ו"אדר ב׳" (המפתח adar הוא אדר ב׳) */
function hebMonths(y){
  const len=hebNY(y+1)-hebNY(y);
  const m=[['tishrei',30],['cheshvan',len%10===5?30:29],['kislev',len%10===3?29:30],['tevet',29],['shevat',30]];
  if(hebLeap(y))m.push(['adar1',30]);
  m.push(['adar',29],['nisan',30],['iyar',29],['sivan',30],['tamuz',29],['av',30],['elul',29]);
  return m;
}
const HEB_CACHE=new Map();
function hebDate(s){
  if(HEB_CACHE.has(s))return HEB_CACHE.get(s);
  const f=fixedOf(s);let y=Math.floor((f-HEB_EPOCH)/365.2468)+1;
  while(hebNY(y)>f)y--;while(hebNY(y+1)<=f)y++;
  let rem=f-hebNY(y),mo=null;
  for(const [k,n] of hebMonths(y)){if(rem<n){mo=k;break}rem-=n}
  const r={y,m:mo,d:rem+1,leap:hebLeap(y)};HEB_CACHE.set(s,r);return r;
}
/* תאריך לועזי של יום בחודש עברי בשנה נתונה */
function gregOf(y,mo,d){let f=hebNY(y);for(const [k,n] of hebMonths(y)){if(k===mo)return dateOfFixed(f+d-1);f+=n}return null}
/* מספרים באותיות */
function gem(n){
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],huns=['','ק','ר','ש','ת'];
  let s='';n=n%1000;while(n>=400){s+='ת';n-=400}if(n>=100){s+=huns[Math.floor(n/100)];n%=100}
  if(n===15)s+='טו';else if(n===16)s+='טז';else{s+=tens[Math.floor(n/10)]+ones[n%10]}
  return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1);
}
const HEB_MN={tishrei:'תשרי',cheshvan:'חשוון',kislev:'כסלו',tevet:'טבת',shevat:'שבט',adar1:'אדר א׳',adar:'אדר',nisan:'ניסן',iyar:'אייר',sivan:'סיוון',tamuz:'תמוז',av:'אב',elul:'אלול'};
const hebMonthName=(h)=>h.m==='adar'&&h.leap?'אדר ב׳':HEB_MN[h.m];
const hebDayStr=s=>gem(hebDate(s).d);
const hebFull=s=>{const h=hebDate(s);return gem(h.d)+' '+hebMonthName(h)+' '+gem(h.y)};
/* כותרת חודש: החודשים העבריים שהחודש הלועזי עובר בהם, למשל "תשרי–חשוון תשפ״ז" */
function hebMonthRange(ym){
  const a=hebDate(ym+'-01'),b=hebDate(monthEnd(ym+'-01'));
  if(a.m===b.m&&a.y===b.y)return hebMonthName(a)+' '+gem(a.y);
  return hebMonthName(a)+(a.y!==b.y?' '+gem(a.y):'')+'–'+hebMonthName(b)+' '+gem(b.y);
}
/* חגים בשנה עברית: [מפתח, תאריך לועזי, האם יום חופש (חג)] */
const HOL_CACHE=new Map();
function holidaysOfYear(y){
  if(HOL_CACHE.has(y))return HOL_CACHE.get(y);
  const g=(m,d)=>gregOf(y,m,d),out=[];
  const add=(k,s,chag)=>out.push([k,s,!!chag]);
  const dow=s=>dowOf(s);
  const ifSat=(s,delta)=>dow(s)===6?addDays(s,delta):s;
  add('erev_rh',addDays(g('tishrei',1),-1));
  add('rh1',g('tishrei',1),1);add('rh2',g('tishrei',2),1);
  add('gedalia',ifSat(g('tishrei',3),1));
  add('erev_yk',g('tishrei',9));add('yk',g('tishrei',10),1);
  add('erev_sukkot',g('tishrei',14));add('sukkot',g('tishrei',15),1);
  for(let d=16;d<=20;d++)add('chm_sukkot',g('tishrei',d));
  add('hoshana',g('tishrei',21));add('simchat',g('tishrei',22),1);
  const ch=g('kislev',25);for(let i=0;i<8;i++)add('chanukah'+(i+1),addDays(ch,i));
  add('tevet10',g('tevet',10));
  add('tubishvat',g('shevat',15));
  const pm=hebLeap(y)?'adar':'adar';
  let te=g(pm,13);if(dow(te)===6)te=addDays(te,-2);add('esther',te);
  add('purim',g(pm,14));add('shushan',g(pm,15));
  if(hebLeap(y))add('purimkatan',g('adar1',14));
  add('erev_pesach',g('nisan',14));add('pesach',g('nisan',15),1);
  for(let d=16;d<=20;d++)add('chm_pesach',g('nisan',d));
  add('pesach7',g('nisan',21),1);
  let sh=g('nisan',27);if(dow(sh)===5)sh=addDays(sh,-1);else if(dow(sh)===0)sh=addDays(sh,1);add('shoah',sh);
  let at=g('iyar',5);const ad=dow(at);if(ad===5)at=addDays(at,-1);else if(ad===6)at=addDays(at,-2);else if(ad===1)at=addDays(at,1);
  add('zikaron',addDays(at,-1));add('atzmaut',at,1);
  add('pesachsheni',g('iyar',14));add('lagbaomer',g('iyar',18));add('yerushalaim',g('iyar',28));
  add('erev_shavuot',g('sivan',5));add('shavuot',g('sivan',6),1);
  add('tamuz17',ifSat(g('tamuz',17),1));
  add('av9',ifSat(g('av',9),1));add('tubeav',g('av',15));
  /* ראש חודש: היום הראשון בחודש, וגם היום ה־30 של החודש הקודם כשיש בו 30 יום (ראש חודש של יומיים). לא בתשרי (ראש השנה) */
  const ms=hebMonths(y);let f=hebNY(y);
  ms.forEach(([k,n],i)=>{
    if(i>0){add('rc:'+k,dateOfFixed(f));if(ms[i-1][1]===30)add('rc:'+k,dateOfFixed(f-1))}
    f+=n;
  });
  HOL_CACHE.set(y,out);return out;
}
const HOL_NAME={erev_rh:'ערב ראש השנה',rh1:'ראש השנה',rh2:'ראש השנה ב׳',gedalia:'צום גדליה',erev_yk:'ערב יום כיפור',yk:'יום כיפור',erev_sukkot:'ערב סוכות',sukkot:'סוכות',chm_sukkot:'חול המועד סוכות',hoshana:'הושענא רבה',simchat:'שמחת תורה',tevet10:'צום עשרה בטבת',tubishvat:'ט״ו בשבט',esther:'תענית אסתר',purim:'פורים',shushan:'שושן פורים',erev_pesach:'ערב פסח',pesach:'פסח',chm_pesach:'חול המועד פסח',pesach7:'שביעי של פסח',shoah:'יום השואה',zikaron:'יום הזיכרון',atzmaut:'יום העצמאות',lagbaomer:'ל״ג בעומר',yerushalaim:'יום ירושלים',erev_shavuot:'ערב שבועות',shavuot:'שבועות',tamuz17:'צום י״ז בתמוז',av9:'תשעה באב',tubeav:'ט״ו באב',purimkatan:'פורים קטן',pesachsheni:'פסח שני'};
const holName=k=>k.startsWith('rc:')?rcName(k.slice(3)):k.startsWith('chanukah')?_('חנוכה')+' · '+_('נר {n}',{n:k.slice(8)}):_(HOL_NAME[k]);
const HEB_MN_EN={tishrei:'Tishrei',cheshvan:'Cheshvan',kislev:'Kislev',tevet:'Tevet',shevat:'Shevat',adar1:'Adar I',adar:'Adar',nisan:'Nisan',iyar:'Iyar',sivan:'Sivan',tamuz:'Tammuz',av:'Av',elul:'Elul'};
function rcName(m){
  const leapAdar2=m==='adar'&&holidaysOfYear._leap;
  if(LANG==='en')return 'Rosh Chodesh '+(leapAdar2?'Adar II':HEB_MN_EN[m]);

/* החגים של תאריך לועזי מסוים */
function holidaysOn(s){
  const h=hebDate(s);const r=[];
  for(const y of [h.y,h.y+1])for(const [k,d,c] of holidaysOfYear(y))if(d===s){holidaysOfYear._leap=hebLeap(y);r.push({k,name:holName(k),chag:c,rc:k.startsWith('rc:')})}

}

/* ===== תתי־משימות, תפוגה של משימות כלליות, השלמת משימה כללית ביום שבו בוצעה, החלקה לחזרה ונעילת גלילה (גרסה 0.7) =====
   מבנה נתונים חדש (אופציונלי, משימות ישנות בלי השדות ממשיכות לעבוד כרגיל):
   subs: [{id, t (שם), done, on (התאריך שבו סומנה כבוצעה)}]
   general + exp ('week'/'month'/'') + genAt (התאריך שבו המשימה הפכה לכללית) */
function cleanSubs(list){return (list||[]).map(x=>({id:x.id||newId(),t:String(x.t||'').trim(),done:!!x.done,on:x.done?(x.on||''):''})).filter(x=>x.t)}
function subProg(t){const s=t.subs||[];return {n:s.length,d:s.filter(x=>x.done).length}}
/* כתום: יש תתי־משימות, חלק בוצעו, והמשימה עצמה עוד לא הושלמה */
function isPartial(t){const p=subProg(t);return p.n>0&&p.d>0&&!t.done}
/* המשימה כפי שהיא עכשיו, אחרי כל ההעברות */
function chainEnd(t){let e=t,i=0;while(e.movedToId&&T(e.movedToId)&&i<40){e=T(e.movedToId);i++}return e}
/* שמירת תתי־משימות בעריכה: אם כולן בוצעו המשימה מסומנת כבוצעה; אם נוספה תת־משימה שלא בוצעה, המשימה חוזרת להיות לא גמורה */
function subsPatch(t,subs){
  if(!subs.length)return {subs:[]};
  const all=subs.every(x=>x.done);
  return {subs,done:all,doneAt:all?(t.done&&t.doneAt?t.doneAt:Date.now()):0};
}
const _fmtDay=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const ilDateOf=ms=>_fmtDay.format(new Date(ms||Date.now()));
const genStart=t=>t.genAt||ilDateOf(t.createdAt);
const expAt=t=>{const s=genStart(t);return t.exp==='week'?addDays(s,7):t.exp==='month'?addMonths(s,1):''};
/* נכשלה: עדיין באזור המשימות הכלליות, לא הושלמה, ותקופת התפוגה עברה. משימה ששובצה ליום כבר לא כללית ולכן לא נכשלת */
function genFailed(t,today){return !!(t.general&&!t.done&&t.exp&&today>expAt(t))}
/* העברת משימה עם תאריך ליום אחר. משימה שהוחמצה, או שבוצעה חלקית, עוברת עם עותק: היום המקורי נשאר עם הסימונים שלו */
function relocate(t,d){
  if(status(t,todayIL())==='missed'||isPartial(t)){moveTask(t.id,d);return true}

/* ===== גיבוי: קובץ JSON עם כל הנתונים (קריאה בלבד, לא משנה כלום) ===== */
async function exportData(){
  const data={app:'task-spaces-cal',schema:1,version:VERSION,exportedAt:new Date().toISOString(),account:(S.user&&S.user.email)||'',
    tasks:S.tasks,series:S.series,goals:S.goals,goalLog:S.glog};
  const name='task-backup-'+todayIL()+'.json';
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  /* בטלפון: חלון השיתוף של המכשיר (שמירה ל"קבצים"), כי הורדה רגילה לא אמינה באפליקציה מותקנת באייפון */
  if(navigator.maxTouchPoints>1&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);
  toast(_('קובץ הגיבוי נשמר')+': '+name);
}
/* ===== התראות (Web Push): הרשמת המכשיר הנוכחי והתראת בדיקה =====
   המפתח הציבורי מגיע מהשרת (/api/push-config). ההרשמה נשמרת ב-users/{uid}/push_subs/{deviceId}, תחת החשבון המחובר בלבד.
   במכשיר נשמר רק המזהה של ההרשמה ושל המשתמש (cal.push). התזכורות עצמן נשלחות מהשרת לפי push_jobs (למטה) */
S.push={state:'unknown',busy:false,checking:false};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isMobile=()=>isIOS()||/Android/i.test(navigator.userAgent);
const pushSupported=()=>window.isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function pushLocal(){try{return JSON.parse(lsGet('cal.push')||'{}')||{}}catch(e){return {}}}
function deviceLabel(){
  const u=navigator.userAgent;
  const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'iPad':/Android/i.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'';
  const br=/Edg\//.test(u)?'Edge':/SamsungBrowser/.test(u)?'Samsung Internet':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'';
  return [os,br].filter(Boolean).join(' · ')||'?';
}
async function pushDeviceId(endpoint){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(endpoint));return 'd'+Array.from(new Uint8Array(h)).slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64uBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function sameServerKey(sub,key){const k=sub.options&&sub.options.applicationServerKey;if(!k)return true;const a=new Uint8Array(k),b=b64uBytes(key);return a.length===b.length&&a.every((x,i)=>x===b[i])}
async function pushRefresh(){
  let st;
  if(isIOS()&&!isStandalone())st='ios-install';
  else if(!pushSupported())st='unsupported';
  else if(Notification.permission==='denied')st='denied';
  else{
    try{const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription(),loc=pushLocal();st=sub&&loc.id&&S.user&&loc.uid===S.user.uid?'on':'off'}
    catch(e){st='off'}
  }
  if(S.push.state!==st){S.push.state=st;if(S.view==='settings')render()}
}
function pushSettingsHtml(){
  const st=S.push.state,dis=S.push.busy?' disabled':'';
  if(st==='unknown'&&!S.push.checking){S.push.checking=true;setTimeout(()=>pushRefresh().finally(()=>{S.push.checking=false}),0)}
  const msg={on:'ההתראות פעילות במכשיר הזה.',off:'ההתראות כבויות במכשיר הזה.',unsupported:'המכשיר או הדפדפן הזה לא תומכים בהתראות.','ios-install':'באייפון התראות עובדות רק כשהאפליקציה מותקנת במסך הבית: בספארי ← שיתוף ← "הוסף למסך הבית", ואז לפתוח אותה משם.',denied:'ההתראות חסומות בהגדרות של הדפדפן או של המכשיר. צריך לאפשר אותן שם ואז לנסות שוב.'}[st]||'בודק…';
  let h='<div class="note">'+_(msg)+'</div>';
  if(st==='off')h+='<button type="button" class="gbtn wide" data-act="push-on"'+dis+'>'+_('הפעל התראות במכשיר הזה')+'</button>';
  if(st==='on')h+='<button type="button" class="gbtn wide" data-act="push-test"'+dis+'>'+_('שלח התראת בדיקה')+'</button><button type="button" class="gbtn wide" data-act="push-off"'+dis+'>'+_('כבה התראות במכשיר הזה')+'</button>';
  if((st==='on'||st==='off')&&!isMobile())h+='<div class="note">'+_('במחשב, התראות מגיעות רק כשהדפדפן פועל (גם ברקע).')+'</div>';
  if(st==='on'||st==='off')h+='<div class="note">'+_('תזכורות למשימות נשלחות לכל המכשירים שבהם ההתראות פעילות, גם כשהאפליקציה סגורה.')+'</div>';
  if(S.pushSubs.length&&S.loaded.pj){const n=S.pushJobs.filter(j=>j.at>Date.now()).length;h+='<div class="note">'+_('תזכורות מתוכננות: {n}',{n})+'</div>'}
  return h;
}
/* הפעלה: בקשת ההרשאה חייבת להיות הדבר הראשון אחרי הלחיצה (דרישה של אייפון), ורק אחר כך פניות לרשת */
async function pushOn(){
  if(S.push.busy||!S.user)return;
  S.push.busy=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast(_('ההרשאה להתראות לא ניתנה.'));return}
    const r=await fetch('/api/push-config',{cache:'no-store'});if(!r.ok)throw new Error('push-config '+r.status);
    const key=(await r.json()).publicKey;if(!key)throw new Error('no public key');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub&&!sameServerKey(sub,key)){await sub.unsubscribe();sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(key)});
    const j=sub.toJSON(),id=await pushDeviceId(j.endpoint),old=pushLocal();
    if(old.id&&old.id!==id&&old.uid===S.user.uid)dbDel('push_subs',old.id);
    dbSet('push_subs',id,{endpoint:j.endpoint,keys:{p256dh:j.keys.p256dh,auth:j.keys.auth},label:deviceLabel(),lang:LANG,enabled:true,createdAt:Date.now()});
    lsSet('cal.push',JSON.stringify({id,uid:S.user.uid}));
    S.push.state='on';toast(_('ההתראות הופעלו במכשיר הזה'));
  }catch(e){console.error('push on',e);toast(_('לא ניתן להפעיל התראות. נסה שוב.'))}
  finally{S.push.busy=false;render();pushRefresh()}
}
async function pushOff(){
  if(S.push.busy)return;
  S.push.busy=true;render();
  try{
    const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();
    if(sub)await sub.unsubscribe();
    const loc=pushLocal();if(loc.id&&S.user&&loc.uid===S.user.uid)dbDel('push_subs',loc.id);
    lsSet('cal.push','{}');
    S.push.state='off';toast(_('ההתראות כובו במכשיר הזה'));
  }catch(e){console.error('push off',e);toast(_('לא ניתן לכבות התראות. נסה שוב.'))}
  finally{S.push.busy=false;render();pushRefresh()}
}
/* התראת בדיקה: נשלחת רק בלחיצה, רק למכשירים של המשתמש המחובר (השרת מאמת את הטוקן) */
async function pushTest(){
  if(S.push.busy||!S.idToken)return;
  if(navigator.onLine===false){toast(_('צריך חיבור לאינטרנט.'));return}
  S.push.busy=true;render();
  try{
    const tok=await S.idToken();
    const r=await fetch('/api/push-test',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({lang:LANG})});
    const j=await r.json().catch(()=>({}));
    if(r.status===429)toast(_('אפשר לשלוח התראת בדיקה פעם בדקה.'));
    else if(r.status===503)toast(_('שרת ההתראות עדיין לא מוגדר.'));
    else if(!r.ok)toast(_('שליחת התראת הבדיקה נכשלה. נסה שוב.'));
    else if(!j.devices)toast(_('אין מכשירים רשומים להתראות. הפעל קודם התראות במכשיר.'));
    else if(!j.sent)toast(_('שליחת התראת הבדיקה נכשלה. נסה שוב.'));
    else toast(j.sent===1?_('התראת הבדיקה נשלחה למכשיר אחד'):_('התראת הבדיקה נשלחה ל־{n} מכשירים',{n:j.sent}));
  }catch(e){console.error('push test',e);toast(_('שליחת התראת הבדיקה נכשלה. נסה שוב.'))}
  finally{S.push.busy=false;render()}
}
/* ===== תזכורות: רשימת זמני השליחה (push_jobs) =====
   האפליקציה מחשבת מראש מתי לשלוח כל התראה, והשרת ("סוכן המשימות") רק שולח את מה שהגיע זמנו. לסוכן אין גישה למשימות עצמן.
   מסמך users/{uid}/push_jobs/{id}: {kind, at (רגע השליחה, ms), date (תאריך המשימה), time (שעת המשימה או ''), title (שם המשימה בלבד), tid (מזהה המשימה), sid (מזהה הסדרה או '')}.
   בלי פרטים, הערות או תתי־משימות (החלטת הלל 26/10: בהתראה מופיע שם המשימה). מזהה קבוע = אין כפילויות.
   סוגים (גרסה 2.0; מסמך ישן בלי kind = 'rem'):
     'rem'    תזכורת רגילה, {tid}_{at}. בשעות השקט נדחית לסופן; "לפני המשימה" שכבר לא לפני המשימה לא נשלחת.
     'late'   תזכורת מאוחרת, {tid}_late_{date}{HHMM}. אחת למשימה פתוחה עם שעה, אחרי זמן ההמתנה (לפי שעות השקט, אפשרות א או ב).
     'snooze' נודניק, {tid}_snooze. נוצר מהאפליקציה (אחרי לחיצה על תזכורת מאוחרת) ונשמר כל עוד המשימה פתוחה.
     'sum'    סיכום, sum_{at}, עם count (מספר המשימות שדורשות טיפול). רק כשיש כאלה.
   ההעדפות (push_prefs/main) נקראות רק כאן, באפליקציה; השרת מקבל זמנים מוכנים.
   הרשימה מחושבת מחדש מכל המשימות אחרי כל שינוי, מכל מכשיר. נשמרת רק כשלמשתמש יש לפחות מכשיר אחד עם התראות; בלי מכשירים הרשימה מתרוקנת */
const PUSH_GRACE=15*60*1000; /* תזכורת שזמנה עבר לפני פחות מ-15 דקות נשארת ברשימה, כדי שהשרת עוד יספיק לשלוח אותה */
/* ההפרש בין שעון ישראל ל-UTC ברגע מסוים (ms) */
function tzOffset(ms){const p=_fmt.formatToParts(new Date(ms)),g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'))-Math.floor(ms/60000)*60000}
/* תאריך ושעה בשעון ישראל → רגע מוחלט (ms). שעה שלא קיימת (מעבר לשעון קיץ) → הדקה הקיימת הבאה (03:00); שעה כפולה (מעבר לשעון חורף) → הפעם הראשונה */
function ilEpoch(date,time){
  const [y,m,d]=P(date),[h,mi]=time.split(':').map(Number);
  for(let k=0;k<=180;k++){
    const W=Date.UTC(y,m-1,d,h,mi+k);
    const c=[...new Set([tzOffset(W-864e5),tzOffset(W),tzOffset(W+864e5)])].map(o=>W-o).filter(t=>t+tzOffset(t)===W).sort((a,b)=>a-b);
    if(c.length)return c[0];
  }
  return null;
}
/* רגע מוחלט (ms) → תאריך ושעה בשעון ישראל */
function ilAt(ms){const p=_fmt.formatToParts(new Date(ms)),g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),time:pad(+g('hour')%24)+':'+g('minute')}}
/* העדפות סוכן המשימות: users/{uid}/push_prefs/main, משותפות לכל המכשירים. כל השדות אופציונליים, ובלי מסמך = הכל כבוי */
const AG_DEF={lateOn:false,lateM:120,quietOn:false,quietFrom:'23:00',quietTo:'08:00',quietMode:'count',sumTimes:[]};
function agPrefs(pp){
  const p={...AG_DEF,...(pp||S.pushPrefs||{})},hm=x=>/^\d{2}:\d{2}$/.test(x||'');
  return {lateOn:p.lateOn===true,lateM:Math.max(5,Math.min(1439,Math.round(+p.lateM)||120)),quietOn:p.quietOn===true,quietFrom:hm(p.quietFrom)?p.quietFrom:'23:00',quietTo:hm(p.quietTo)?p.quietTo:'08:00',quietMode:p.quietMode==='end'?'end':'count',sumTimes:[...new Set((Array.isArray(p.sumTimes)?p.sumTimes:[]).filter(hm))].sort()};
}
/* שעות שקט: null כשהן כבויות (או כשההתחלה והסוף זהים) */
function quietOf(p){return p.quietOn&&p.quietFrom!==p.quietTo?{from:p.quietFrom,to:p.quietTo,mode:p.quietMode}:null}
/* אם הרגע ms נופל בשעות השקט: הרגע שבו הן נגמרות. אחרת null. כולל שעות שחוצות חצות (23:00–08:00) */
function quietEnd(ms,q){
  if(!q)return null;
  const {date,time}=ilAt(ms);
  if(q.from<q.to)return time>=q.from&&time<q.to?ilEpoch(date,q.to):null;
  if(time>=q.from)return ilEpoch(addDays(date,1),q.to);
  if(time<q.to)return ilEpoch(date,q.to);
  return null;
}
const quietDefer=(ms,q)=>{const e=quietEnd(ms,q);return e===null?ms:e};
/* זמן המתנה של min דקות מהרגע start, לפי שעות השקט.
   'count' (אפשרות א) = סופרים רק זמן שמחוץ לשעות השקט, והיתרה ממשיכה אחריהן. משימה ב-22:00, שעתיים, שקט 23:00–08:00 → 09:00.
   'end' (אפשרות ב) = אם הרגע נופל בשעות השקט, מיד בסופן */
function quietAdd(start,min,q){
  let rem=min*60000;
  if(!q)return start+rem;
  if(q.mode==='end')return quietDefer(start+rem,q);
  let t=start;
  for(let i=0;i<50;i++){
    const e=quietEnd(t,q);if(e!==null){t=e;continue}
    const d0=ilAt(t).date;let qs=Infinity;
    for(let k=0;k<3&&qs===Infinity;k++){const x=ilEpoch(addDays(d0,k),q.from);if(x!==null&&x>t)qs=x}
    if(t+rem<qs)return t+rem;
    rem-=qs-t;t=qs;
  }
  return t+rem;
}
/* לסיכום: משימות של היום של הרגע at שעדיין דורשות טיפול: לא בוצעו, לא הועברו, ובלי שעה או ששעתן כבר הגיעה.
   משימה כללית ששובצה להיום נספרת כמשימה של היום. משימות שהושלמו, נמחקו או ששעתן עוד לא הגיעה לא נספרות */
function sumCount(tasks,at){
  const d=ilAt(at).date;
  return tasks.filter(t=>!t.general&&!t.done&&!t.movedTo&&t.date===d&&(!t.time||ilEpoch(d,t.time)<=at)).length;
}
const pushOpen=t=>!!t&&!t.general&&!t.done&&!t.movedTo&&isDate(t.date);
/* מה צריך להיות ברשימה. pp = ההעדפות, jobs = המסמכים הקיימים (בשביל נודניק, שנוצר מהאפליקציה) */
function pushJobsWanted(tasks,now,pp,jobs){
  const p=agPrefs(pp||{}),q=quietOf(p),out={},keep=at=>at!==null&&at>now-PUSH_GRACE;
  const info=t=>({date:t.date,time:t.time||'',title:String(t.title||'').slice(0,120),tid:t.id,sid:t.seriesId||''});
  for(const t of tasks){
    if(!pushOpen(t))continue;
    const start=t.time?ilEpoch(t.date,t.time):null,dayEnd=ilEpoch(addDays(t.date,1),'00:00');
    for(const r of reminderTimes(t)){
      let at=ilEpoch(r.date,r.time);if(at===null)continue;
      /* בשעות השקט: נדחית לסופן ונבדקת מחדש. "לפני המשימה" שאחרי הדחייה כבר לא לפני המשימה, או שעה מותאמת שעברה ליום אחר, לא נשלחת */
      const d=quietDefer(at,q);
      if(d!==at){if(d>(r.k==='before'&&start!==null?start:dayEnd))continue;at=d}
      if(keep(at))out[t.id+'_'+at]={kind:'rem',at,...info(t)};
    }
    if(p.lateOn&&start!==null){
      const at=quietAdd(start,p.lateM,q);
      if(keep(at))out[t.id+'_late_'+t.date+t.time.replace(':','')]={kind:'late',at,...info(t)};
    }
  }
  const byId=new Map(tasks.map(t=>[t.id,t]));
  for(const j of jobs||[]){
    if(j.kind!=='snooze')continue;
    const t=byId.get(j.tid);
    if(pushOpen(t)&&keep(j.at))out[j.id]={kind:'snooze',at:j.at,...info(t)};
  }
  if(p.sumTimes.length){
    const today=ilAt(now).date,seen=new Set();
    for(let k=0;k<7;k++)for(const tm of p.sumTimes){
      let at=ilEpoch(addDays(today,k),tm);if(at===null)continue;
      /* סיכומים שנופלים בשעות השקט מתאחדים לסיכום אחד, עדכני, בסופן */
      at=quietDefer(at,q);
      if(!keep(at)||seen.has(at))continue;seen.add(at);
      const n=sumCount(tasks,at);
      if(n)out['sum_'+at]={kind:'sum',at,date:ilAt(at).date,time:'',title:'',tid:'',sid:'',count:n};
    }
  }
  return out;
}
/* מה לכתוב: מסמכים חסרים נוצרים, מסמכים שהשתנו מתעדכנים (בלי לגעת בשדות שהשרת מוסיף: sent, sentAt), ומה שכבר לא צריך נמחק */
const PJ_FIELDS=['kind','at','date','time','title','tid','sid','count'];
function pushJobsDiff(wanted,existing){
  const ex=new Map(existing.map(j=>[j.id,j])),set=[],upd=[],del=[],v=x=>x===undefined||x===null?'':x;
  for(const id in wanted){const w=wanted[id],e=ex.get(id);if(!e)set.push([id,w]);else if(PJ_FIELDS.some(k=>v(e[k])!==v(w[k])))upd.push([id,w])}
  for(const e of existing)if(!Object.prototype.hasOwnProperty.call(wanted,e.id))del.push(e.id);
  return {set,upd,del};
}
let pushSyncT=0;
function pushJobsSchedule(){clearTimeout(pushSyncT);pushSyncT=setTimeout(pushJobsSync,1200)}
function pushJobsSync(){
  if(!S.db||!S.loaded.t||!S.loaded.ps||!S.loaded.pj||!S.loaded.pp)return;
  const d=pushJobsDiff(S.pushSubs.length?pushJobsWanted(S.tasks,Date.now(),S.pushPrefs,S.pushJobs):{},S.pushJobs);
  d.set.forEach(([id,w])=>dbSet('push_jobs',id,w));
  d.upd.forEach(([id,w])=>dbUpd('push_jobs',id,w));
  d.del.forEach(id=>dbDel('push_jobs',id));
}
S.pushSubs=[];S.pushJobs=[];S.pushPrefs={};

/* ===== הוספת תזכורת מתפריט ⋮ (בלי טופס העריכה) =====
   לא מחליפה תזכורות קיימות, ובלי כפילות לאותו מועד. במשימה חוזרת, "מהיום והלאה" מוסיף אותה לכל מופע (כל אחד לרשימה שלו) ולסדרה.
   משימה כללית נשארת כללית (בלי תאריך אין מתי להזכיר); משימה בלי שעה מקבלת רק שעה מותאמת */
function remNote(){return S.loaded.ps&&!S.pushSubs.length?'<div class="note">'+_('כדי לקבל תזכורות כהתראה, הפעל התראות בהגדרות ⚙️ ← התראות.')+'</div>':''}
/* המועד של תזכורת (תאריך ושעה), כדי לזהות שתי תזכורות שונות שנופלות באותו רגע */
function remKey(x,r){if(r.t==='at')return (x.date||'')+' '+r.time;const n=toMin(x.time)-r.m;return n>=0?(x.date||'')+' '+fromMin(n):(x.date?addDays(x.date,-1):'-')+' '+fromMin(n+1440)}
function remAdd(id,scope,r){
  const t=T(id);if(!t||t.general||t.movedTo)return;
  if(r.t==='before'&&!t.time)return;
  const next=x=>{if(r.t==='before'&&!x.time)return null;const cur=remList(x),k=remKey(x,r);return cur.some(y=>remKey(x,y)===k)?null:remSort([...cur,r])};
  let n=0;
  withUndo(_('התזכורת נוספה'),()=>{
    if(scope==='from'&&t.seriesId){
      const from=t.date<todayIL()?todayIL():t.date;
      S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=from&&!x.movedTo).forEach(x=>{const l=next(x);if(l){updTask(x.id,{reminders:l});n++}});
      const sr=S.series.find(x=>x.id===t.seriesId);if(sr){const l=next({...sr,date:''});if(l)updSeries(sr.id,{reminders:l})}
    }else{const l=next(t);if(l){updTask(t.id,{reminders:l});n++}}
    toast(n?_('התזכורת נוספה'):_('התזכורת הזו כבר קיימת'));

}

/* ===== פתיחה מהתראה: היום שבו המשימה נמצאת עכשיו, גלילה אליה והדגשה, ונודניק אחרי תזכורת מאוחרת =====
   הכתובת שבהתראה: #n=<סוג>&d=<תאריך>&t=<מזהה משימה>&s=<מזהה סדרה>; בסיכום: #n=sum&d=<תאריך>.
   המשימה נמצאת לפי המזהה, לא לפי השם. מופע של סדרה שהמזהה שלו כבר לא קיים: לפי סדרה ותאריך. משימה שהועברה: לפי שרשרת ההעברות.
   משימה שלא קיימת: הודעה, בלי להדגיש משימה אחרת. ההדגשה חזותית בלבד ולא משנה נתונים */
function notifTake(){

  const p=new URLSearchParams(location.hash.slice(1));
  S.notif={k:p.get('n')||'',d:p.get('d')||'',t:p.get('t')||'',s:p.get('s')||''};
  history.replaceState(null,'','#d='+(isDate(S.notif.d)?S.notif.d:todayIL()));
  return true;
}
function notifFind(n){

  if(t&&t.movedToId)t=chainEnd(t);

}
function notifRun(){

  if(t.general){S.dayUI.gen=true;S.dayUI.manual=true;render()}

}
const cssId=s=>window.CSS&&CSS.escape?CSS.escape(s):String(s).replace(/["\\]/g,'\\$&');
/* סיכום: היום הנוכחי, באזור המשימות שדורשות טיפול (הראשונה ששעתה עברה, או "ללא שעה") */

/* אחרי ציור מחדש ההדגשה ממשיכה מאותה נקודה (animation-delay שלילי), כדי שלא תתחיל מההתחלה */

  h+='</div><div class="agsub"><h3>📋 '+_('סיכומי משימות')+'</h3><div class="note">'+_('בכל שעה שתבחר תגיע התראה אחת עם מספר המשימות שעדיין דורשות טיפול היום, רק אם יש כאלה.')+'</div>';
  if(p.sumTimes.length)h+='<div class="rchips">'+p.sumTimes.map(x=>'<span class="chip"><span class="ltr">'+esc(x)+'</span><button type="button" data-act="ag-sum-del" data-v="'+esc(x)+'" aria-label="'+_('הסרה')+' '+esc(x)+'">✕</button></span>').join('')+'</div>';
  h+='<button type="button" class="gbtn wide" data-act="ag-sum-add" style="margin-top:8px">＋ '+_('הוסף שעת סיכום')+'</button></div>';
  return h;
}
function agentClick(a,el){
  const p=agPrefs();
  if(a==='ag-late'){setAgent({lateOn:!p.lateOn});return true}
  if(a==='ag-late-m'){setAgent({lateM:+el.dataset.v});return true}
  if(a==='ag-late-c'){openTimePicker(fromMin(p.lateM),v=>{const mm=v?toMin(v):0;if(mm>=5)setAgent({lateM:mm});else if(v)toast(_('זמן ההמתנה הקצר ביותר הוא 5 דקות.'))},{clear:null,title:_('זמן המתנה (שעות:דקות)')});return true}
  if(a==='ag-q'){setAgent({quietOn:!p.quietOn});return true}
  if(a==='ag-q-from'||a==='ag-q-to'){const k=a==='ag-q-from'?'quietFrom':'quietTo';openTimePicker(p[k],v=>{if(v)setAgent({[k]:v})},{clear:null,title:a==='ag-q-from'?_('תחילת שעות השקט'):_('סוף שעות השקט')});return true}
  if(a==='ag-q-mode'){setAgent({quietMode:el.dataset.v==='end'?'end':'count'});return true}
  if(a==='ag-sum-add'){openTimePicker('',v=>{if(!v)return;const l=agPrefs().sumTimes;if(l.includes(v)){toast(_('השעה הזו כבר ברשימה.'));return}setAgent({sumTimes:[...l,v].sort()})},{clear:null,title:_('שעת סיכום')});return true}
  if(a==='ag-sum-del'){setAgent({sumTimes:p.sumTimes.filter(x=>x!==el.dataset.v)});return true}
  return false;
}

/* ===== גרסה חדשה: בודקים בשקט מדי פעם אם באתר יש גרסה אחרת, ומציעים לעדכן בלחיצה ===== */
let verLast=-1e9,verShown='';
async function checkVersion(){
  if(!navigator.onLine||performance.now()-verLast<5*60*1000)return;verLast=performance.now();
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION&&m[1]!==verShown){verShown=m[1];showUpdate(m[1])}
  }catch(e){}
}
function showUpdate(v){
  const root=$('#updRoot');if(!root)return;
  root.innerHTML='<button type="button" class="updbar" data-act="upd-go">🔄 '+esc(_('יש גרסה חדשה ({v}). הקש כאן לעדכון',{v}))+'</button>';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
setTimeout(checkVersion,15000);
/* ===== חיבור ל-Firebase (אותו פרויקט, אוספים: cal_tasks, cal_series) ===== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyBHFzVCyBt05MZ0RdXPNIEJLtd_5b6P9OA",
  authDomain:"task-spaces.firebaseapp.com",
  projectId:"task-spaces",
  storageBucket:"task-spaces.firebasestorage.app",
  messagingSenderId:"516630524613",
  appId:"1:516630524613:web:ce72bf471e519e72af36ac"
};
function makeDb(fs,uid){
  return {
    collection:c=>({onSnapshot:(ok,err)=>FB.onSnapshot(FB.collection(fs,'users',uid,c),sn=>ok({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    doc:p=>{const [c,id]=p.split('/');const r=FB.doc(fs,'users',uid,c,id);return {set:d=>FB.setDoc(r,d),update:d=>FB.updateDoc(r,d),delete:()=>FB.deleteDoc(r)}}
  };
}
function showLogin(msg){$('#login').hidden=false;$('#loginErr').textContent=msg||''}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return _('הכתובת של האתר עדיין לא אושרה ב-Firebase.');if(c==='auth/network-request-failed')return _('אין חיבור לרשת. נסה שוב.');return _('הכניסה נכשלה. נסה שוב.')}
let startedFor=null;
function boot(){
  applyPrefs();route();
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeColor)}catch(e){}
  if(!window.FB){$('#app').innerHTML=('<div class="loading">'+_('לא ניתן לטעון את רכיבי החיבור. רענן את הדף.')+'</div>');return}
  const app=FB.initializeApp(FIREBASE_CONFIG),auth=FB.getAuth(app);
  let fs;try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){fs=FB.initializeFirestore(app,{})}
  /* בלי אינטרנט, בדיקת ה־redirect עלולה להיכשל. אם המשתמש כבר מחובר לא מציגים מסך כניסה */
  FB.getRedirectResult(auth).catch(e=>{if(!auth.currentUser)showLogin(authMsg(e))});
  const provider=new FB.GoogleAuthProvider();
  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    try{await FB.signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await FB.signInWithRedirect(auth,provider)}catch(x){showLogin(authMsg(x))}}
      else if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){}
      else showLogin(authMsg(e));
    }
  });
  S.signOut=async()=>{try{await FB.signOut(auth)}catch(e){}location.reload()};
  /* טוקן זהות של המשתמש המחובר, לפניות לשרת ההתראות (השרת מאמת אותו) */
  S.idToken=()=>auth.currentUser?auth.currentUser.getIdToken():Promise.reject(new Error('not signed in'));
  FB.onAuthStateChanged(auth,user=>{
    S.user=user?{email:user.email||'',name:user.displayName||'',uid:user.uid}:null;
    if(S.view==='settings')render();
    if(!user){showLogin();return}
    $('#login').hidden=true;
    if(startedFor===user.uid)return;startedFor=user.uid;
    start(makeDb(fs,user.uid));
  });
}
function start(db){
  S.db=db;
  const bad=e=>{console.error('db',e);S.loadErr=true;render()};
  db.collection('cal_series').onSnapshot(sn=>{S.series=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.s=true;render();checkSeries();notifRun()},bad);
  /* יעדים: ההאזנה לא חוסמת את שאר האפליקציה, ושגיאה בה לא דורסת את המסך */
  db.collection('cal_goals').onSnapshot(sn=>{S.goals=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.g=true;render()},e=>{console.error('goals',e);S.loaded.g=true;render()});
  db.collection('cal_goal_log').onSnapshot(sn=>{S.glog=sn.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error('goal log',e));
  db.collection('cal_tasks').onSnapshot(sn=>{S.tasks=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;render();checkSeries();setTimeout(maybeNews,900);pushJobsSchedule();notifRun()},bad);
  /* התראות: המכשירים הרשומים ורשימת זמני השליחה. שגיאה כאן לא חוסמת את האפליקציה */
  db.collection('push_subs').onSnapshot(sn=>{S.pushSubs=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.ps=true;pushJobsSchedule()},e=>console.error('push subs',e));
  db.collection('push_prefs').onSnapshot(sn=>{const d=sn.docs.find(x=>x.id==='main');S.pushPrefs=d?{...d.data()}:{};S.loaded.pp=true;if(S.view==='settings')render();pushJobsSchedule()},e=>{console.error('push prefs',e);S.loaded.pp=true;pushJobsSchedule()});
  db.collection('push_jobs').onSnapshot(sn=>{S.pushJobs=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.pj=true;if(S.view==='settings')render();pushJobsSchedule()},e=>console.error('push jobs',e));
}
boot();
/* PWA: שומר את קבצי האפליקציה במכשיר כדי שהיא תיפתח גם בלי אינטרנט */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e))});
}
