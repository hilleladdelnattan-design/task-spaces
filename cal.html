<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a55d0">
<title>לוח משימות</title>
<style>
:root{--bg:#f7f8fc;--surface:#fff;--ink:#1b1d2a;--muted:#6f748a;--line:#e8eaf3;--accent:#4a55d0;--accent-soft:#eceefe;--tint:#f2f3fa;--green:#16a34a;--green-soft:#e7f7ed;--red:#e03131;--redtxt:#c4524d;--red-soft:#fdeeee;--shadow:0 10px 40px rgba(20,24,60,.22);--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--surface:#1b1d28;--ink:#eceef7;--muted:#9aa0b8;--line:#2a2d3c;--accent:#8a94ff;--accent-soft:#262a4a;--tint:#232536;--green:#3ddc84;--green-soft:#17301f;--red:#ff5c5c;--redtxt:#ee8a86;--red-soft:#3a2024;--shadow:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px calc(28px + env(safe-area-inset-bottom))}
.arr{width:44px;height:44px;border:none;background:none;font-size:24px;line-height:1;color:var(--muted);border-radius:12px;flex:none}
.arr:active{background:var(--tint)}
.tlink{border:none;background:none;color:var(--accent);font-weight:600;padding:10px 6px;height:44px}
.pbtn{height:42px;padding:0 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:600}
.pbtn.sm{height:38px;padding:0 14px;font-size:15px}
.gbtn{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.dbtn{height:42px;padding:0 18px;border-radius:999px;border:none;background:var(--red);color:#fff;font-weight:600}
.mtop{display:flex;align-items:center}
.mtitle{flex:1;text-align:center;font-size:20px;font-weight:700;margin:0}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.cal{padding:4px 0}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow div{text-align:center;color:var(--muted);font-size:12px;padding:2px 0 6px}
.cell{min-height:88px;border:none;border-radius:12px;padding:4px 3px;background:var(--surface);display:flex;flex-direction:column;gap:1px;text-align:start;width:100%;overflow:hidden}
.cell.empty{background:none;cursor:default}
.cell.sel{background:var(--accent-soft)}
.cell .n{font-size:12px;color:var(--muted);padding:0 3px;min-width:22px;height:22px;line-height:22px;align-self:flex-start;text-align:center}
.cell.today .n{background:var(--accent);color:#fff;font-weight:800;border-radius:999px}
.cell .t{font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.cell .t.bad{color:var(--redtxt)}
.cell .t.ok{color:var(--green);font-weight:600}
.cell .more{font-size:10px;line-height:1.2;color:var(--accent);font-weight:700;padding:0 3px;overflow:hidden}
@media(min-width:640px){.wrap{max-width:900px}.cell{min-height:106px;padding:6px 5px}.cell .t{font-size:12px}.cell .more{font-size:11.5px}}
/* מסך יום */
.dtop{display:flex;align-items:center;justify-content:space-between}
.dnav{display:flex;align-items:center;margin-top:2px}
.dtitle{flex:1;text-align:center}
.dtitle h1{margin:0;font-size:22px}
.dtitle small{display:block;color:var(--muted);font-size:13px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;font-weight:600;vertical-align:middle}
.dsum{text-align:center;color:var(--muted);margin:2px 0 10px;font-size:14px}
.slot{display:flex;gap:8px;min-height:34px;border-top:1px solid var(--line);padding:3px 0}
.slot.half{border-top:1px dashed var(--line)}
.slot .st{width:46px;flex:none;font-size:12px;color:var(--muted);padding-top:8px;text-align:start;direction:ltr;unicode-bidi:isolate}
.slot.half .st{opacity:.55}
.slot.hr .st{font-weight:700;color:var(--ink);opacity:.8}
.slot .ss{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.slot.over,.nt.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}
.nt{position:sticky;bottom:0;margin-top:14px;background:var(--surface);border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-height:38vh;overflow:auto;box-shadow:0 -6px 20px rgba(20,24,60,.08)}
.nth{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.nt .none{color:var(--muted);font-size:14px;padding:6px 0}
.nt .ns{display:flex;flex-direction:column;gap:3px}
.tk{display:flex;align-items:flex-start;gap:2px;border-radius:12px;background:var(--tint);padding:1px 0 1px 0;position:relative}
.nt .tk{background:var(--tint)}
.tk.lifted{opacity:.35}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:none;padding:0}
.chk i{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1;font-weight:900}
.tk.done .chk i{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tk.missed .chk i{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tkbody{flex:1;min-width:0;padding:10px 0 8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}
.tt{font-size:16px;word-break:break-word}
.tk.done .tt{color:var(--green);font-weight:600}
.tk.missed .tt{color:var(--redtxt)}
.meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.meta.bad{color:var(--redtxt)}
.mvlink{border:none;background:none;color:var(--redtxt);text-decoration:underline;padding:6px 0 2px;font-size:13.5px}
.kebab{width:36px;height:44px;flex:none;border:none;background:none;font-size:20px;color:var(--muted);opacity:.7;padding:0}
.ghost{position:fixed;z-index:95;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;left:0;top:0}
.foot{text-align:center;margin-top:16px}
.ver{color:var(--muted);font-size:12px;opacity:.7}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:10px}
/* חלונות */
.mback{position:fixed;inset:0;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mback.pk{z-index:70}
@media(min-width:640px){.mback{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:640px){.sheet{border-radius:22px}}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mhead h2{margin:0;font-size:18px;flex:1}
.xbtn{width:40px;height:40px;border:none;background:none;font-size:20px;color:var(--muted);border-radius:12px}
.big{display:block;width:100%;height:50px;margin:8px 0 4px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:17px}
.frow{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:44px}
.fl{width:74px;flex:none;color:var(--muted);font-size:14px}
.fbtn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;text-align:start}
.clr{width:40px;height:40px;border:none;background:none;color:var(--muted);font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.wd button{height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.seg button[aria-pressed=true],.wd button[aria-pressed=true],.mdg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.wd{display:flex;gap:6px;margin-top:10px}
.wd button{flex:1;padding:0;min-width:0}
.mdg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.mdg button{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0;font-size:14px}
.err{color:var(--redtxt);min-height:20px;margin-top:8px;font-size:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts button{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;padding:0 14px;font-size:16px}
.note{color:var(--muted);font-size:14px;margin:6px 0}
/* בוחרים */
.psheet{background:var(--surface);width:100%;max-width:340px;border-radius:22px;padding:12px 12px 14px;box-shadow:var(--shadow);margin:auto 12px}
@media(max-width:639px){.mback.pk{align-items:center}}
.pkhead{display:flex;align-items:center}
.pkhead b{flex:1;text-align:center}
.pkdow,.pkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pkdow div{color:var(--muted);font-size:12px;padding:6px 0 4px}
.pkgrid button{height:40px;border:none;background:none;border-radius:999px;font-size:15px;padding:0}
.pkgrid button:disabled{opacity:.3;cursor:default}
.pkgrid button.cur{outline:1.5px solid var(--accent);outline-offset:-2px}
.pkgrid button.on{background:var(--accent);color:#fff;font-weight:700}
.pkfoot{display:flex;align-items:center;gap:8px;margin-top:10px}
.pkfoot input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px;font-size:15px}
.tpd{direction:ltr;text-align:center;font-size:44px;font-weight:700;letter-spacing:2px;margin:4px 0 6px}
.tpc{direction:ltr;display:flex;gap:10px;justify-content:center}
.tcol{position:relative;height:190px;width:92px;overflow-y:auto;scroll-snap-type:y proximity;border-radius:14px;background:var(--tint);padding:70px 0}
.tcol button{display:block;width:100%;height:44px;border:none;background:none;font-size:22px;scroll-snap-align:center;padding:0;color:var(--muted)}
.tcol button.on{color:var(--accent);font-weight:800;font-size:28px}
.pop{position:fixed;z-index:80;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:4px;min-width:150px;border:1px solid var(--line)}
.pop button{display:block;width:100%;text-align:start;border:none;background:none;height:44px;padding:0 12px;border-radius:10px;font-size:16px}
.pop button:active{background:var(--tint)}
.pop .rd{color:var(--redtxt)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;display:none;max-width:90vw}
.loginbox{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:16px}
.loginbox[hidden]{display:none}
.lcard{background:var(--surface);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lcard h1{margin:0;font-size:24px}
.lcard p{margin:0;color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:60px 0}
</style></head><body>
<div id="app"><div class="loading">טוען…</div></div>
<div id="modalRoot"></div><div id="pickRoot"></div><div id="popRoot"></div>
<div id="toast" role="status"></div>
<div class="loginbox" id="login" hidden><div class="lcard"><h1>לוח משימות</h1><p>כדי לראות את המשימות שלך, היכנס עם חשבון Google.</p><button class="pbtn" id="loginBtn" type="button">כניסה עם Google</button><p id="loginErr" role="alert"></p></div></div>
<script src="fb.js"></script>
<script>
'use strict';
/* ===== זמן: כל הלוגיקה לפי שעון ישראל (Asia/Jerusalem), לא לפי אזור הזמן של המכשיר ===== */
const VERSION='0.2';
const TZ='Asia/Jerusalem';
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOWN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DOWS=['א','ב','ג','ד','ה','ו','ש'];
const pad=n=>String(n).padStart(2,'0');
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function ilParts(){const p=_fmt.formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}
const todayIL=()=>ilParts().date;
/* תאריכים הם מחרוזות "YYYY-MM-DD" (תאריך לוח בלבד). חישובים ב-UTC כדי שלא יושפעו משעון המכשיר או משעון קיץ */
const P=s=>s.split('-').map(Number);
const F=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function addDays(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1,d+n));return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dowOf(s){const [y,m,d]=P(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addMonths(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1+n,1));const yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;return F(yy,mm,Math.min(d,dim(yy,mm)))}
const weekEnd=s=>addDays(s,6-dowOf(s));
const monthEnd=s=>{const [y,m]=P(s);return F(y,m,dim(y,m))};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&addDays(s,0)===s;
const dm=s=>{const [,m,d]=P(s);return d+'/'+m};
const dayName=s=>{const [,m,d]=P(s);return d+' ב'+MONTHS[m-1]};
const longDay=s=>DOWN[dowOf(s)]+', '+dayName(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function occurrences(rule,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const ok=rule.type==='daily'||(rule.type==='weekdays'&&rule.days.includes(dowOf(d)))||(rule.type==='monthdays'&&rule.days.includes(+d.slice(8)));if(ok)out.push(d)}return out}
function status(t,today){if(t.movedTo)return 'moved';if(t.done)return 'done';if(t.date<today)return 'missed';return 'open'}
const cmpT=(a,b)=>{const ta=a.time||'99:99',tb=b.time||'99:99';return ta<tb?-1:ta>tb?1:(a.createdAt||0)-(b.createdAt||0)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const slotOf=t=>{if(!t)return 'none';const n=toMin(t);return fromMin(n-n%30)};
function parseDateText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?$/.exec(s);if(!m)return '';
  let y=m[3]?+m[3]:+todayIL().slice(0,4);if(m[3]&&m[3].length===2)y+=2000;
  const r=F(y,+m[2],+m[1]);return isDate(r)?r:'';
}
function parseTimeText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[:.](\d{2})$/.exec(s)||/^(\d{2})(\d{2})$/.exec(s);if(!m)return '';
  const h=+m[1],mi=+m[2];return h<24&&mi<60?pad(h)+':'+pad(mi):'';
}

/* ===== מצב ===== */
const $=s=>document.querySelector(s);
const S={db:null,tasks:[],series:[],loaded:{t:false,s:false},view:'month',month:todayIL().slice(0,7),sel:todayIL(),modal:null,pick:null,pop:null,dismissed:new Set(),busy:new Set(),lastToday:todayIL(),dragging:false,pending:false,autoScroll:false};
const T=id=>S.tasks.find(x=>x.id===id);
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function clean(o){const r={};for(const k in o){if(k==='id'||o[k]===undefined)continue;r[k]=o[k]}return r}
const save=(c,id,o)=>S.db.doc(c+'/'+id).set(clean(o));
const del=(c,id)=>S.db.doc(c+'/'+id).delete();
let toastT=0;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}
async function guard(fn){try{await fn()}catch(e){console.error(e);toast('הפעולה לא נשמרה. בדוק חיבור ונסה שוב.')}}

/* ===== תצוגה: משימה אחת ===== */
function taskHtml(t,today,inSlot){
  const st=status(t,today);
  const cls=st==='moved'?'missed':st;
  const glyph=st==='done'?'✓':(st==='missed'||st==='moved')?'✕':'';
  const meta=[];
  if(inSlot&&t.time&&toMin(t.time)%30)meta.push(esc(t.time));
  if(t.seriesId)meta.push('🔁');
  let m=meta.length?'<div class="meta">'+meta.join(' · ')+'</div>':'';
  if(t.movedTo)m+='<div class="meta bad">הועבר ל־'+dm(t.movedTo)+'</div>';
  if(t.movedFrom)m+='<div class="meta">הועבר מ־'+dm(t.movedFrom)+'</div>';
  const mv=st==='missed'?'<button type="button" class="mvlink" data-act="mv" data-id="'+t.id+'">העבר ליום אחר</button>':'';
  const dis=st==='moved';
  return '<div class="tk '+cls+'" data-id="'+t.id+'"'+(dis?' data-nodrag="1"':'')+'><button type="button" class="chk" data-act="tog" data-id="'+t.id+'" role="checkbox" aria-checked="'+(st==='done')+'" aria-label="סימון '+esc(t.title)+'"'+(dis?' disabled':'')+'><i>'+glyph+'</i></button><div class="tkbody"><div class="tt">'+esc(t.title)+'</div>'+m+mv+'</div><button type="button" class="kebab" data-act="menu" data-id="'+t.id+'" aria-label="תפריט משימה">⋮</button></div>';
}

/* ===== תצוגה: לוח חודשי ===== */
function maxVisible(){return innerWidth<640?3:4}
function renderMonth(){
  const today=todayIL();
  const [y,m]=S.month.split('-').map(Number);
  const by={};S.tasks.forEach(t=>{(by[t.date]=by[t.date]||[]).push(t)});Object.values(by).forEach(a=>a.sort(cmpT));
  const lead=dowOf(F(y,m,1)),n=dim(y,m),MV=maxVisible();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell empty" aria-hidden="true"></div>';
  for(let d=1;d<=n;d++){
    const ds=F(y,m,d),list=by[ds]||[];
    let items='';
    const shown=list.length>MV?MV-1:list.length;
    for(let i=0;i<shown;i++){const t=list[i],st=status(t,today);items+='<div class="t '+(st==='missed'||st==='moved'?'bad':st==='done'?'ok':'')+'">'+esc(t.title)+'</div>'}
    if(list.length>shown)items+='<div class="more">+'+(list.length-shown)+' משימות</div>';
    cells+='<button type="button" class="cell'+(ds===today?' today':'')+(ds===S.sel?' sel':'')+'" data-act="day" data-d="'+ds+'" aria-label="'+esc(longDay(ds))+', '+list.length+' משימות"><span class="n">'+d+'</span>'+items+'</button>';
  }
  return '<div class="wrap"><div class="mtop"><button type="button" class="arr" data-act="prev" aria-label="חודש קודם">→</button><h1 class="mtitle">'+MONTHS[m-1]+' '+y+'</h1><button type="button" class="arr" data-act="next" aria-label="חודש הבא">←</button></div><div class="mbar"><button type="button" class="tlink" data-act="today">היום</button><button type="button" class="pbtn sm" data-act="add">+ משימה</button></div><div class="cal"><div class="dow" aria-hidden="true">'+DOWS.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="grid">'+cells+'</div></div><div class="foot"><button type="button" class="link" data-act="signout">יציאה</button><div class="ver">גרסה '+VERSION+'</div></div></div>';
}

function summary(list){
  const c=list.filter(t=>!t.movedTo),n=c.length,d=c.filter(t=>t.done).length;
  if(!n)return 'אין משימות';
  return (n===1?'משימה אחת':n+' משימות')+' · '+(d===1?'הושלמה אחת':d+' הושלמו');
}
function renderDay(){
  const today=todayIL(),d=S.sel;
  const list=S.tasks.filter(t=>t.date===d).sort(cmpT);
  const timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let lo=6*60,hi=23*60+30;
  timed.forEach(t=>{const s=toMin(slotOf(t.time));lo=Math.min(lo,s);hi=Math.max(hi,s)});
  const by={};timed.forEach(t=>{const s=slotOf(t.time);(by[s]=by[s]||[]).push(t)});
  let slots='';
  for(let mi=lo;mi<=hi;mi+=30){
    const s=fromMin(mi),full=mi%60===0;
    slots+='<div class="slot '+(full?'hr':'half')+'" data-slot="'+s+'"><div class="st">'+s+'</div><div class="ss">'+(by[s]||[]).map(t=>taskHtml(t,today,true)).join('')+'</div></div>';
  }
  const nt='<div class="nt" id="nt" data-slot="none"><div class="nth">ללא שעה</div>'+(untimed.length?'<div class="ns">'+untimed.map(t=>taskHtml(t,today,false)).join('')+'</div>':'<div class="none">אין משימות בלי שעה</div>')+'</div>';
  return '<div class="wrap"><div class="dtop"><button type="button" class="tlink" data-act="back">📅 חזרה ללוח</button><button type="button" class="pbtn sm" data-act="add">+ משימה</button></div><div class="dnav"><button type="button" class="arr" data-act="dprev" aria-label="יום קודם">→</button><div class="dtitle"><small>'+DOWN[dowOf(d)]+'</small><h1>'+esc(dayName(d))+(d===today?'<span class="tag">היום</span>':'')+'</h1></div><button type="button" class="arr" data-act="dnext" aria-label="יום הבא">←</button></div><div class="dsum">'+summary(list)+'</div><div id="tl">'+slots+'</div>'+nt+'</div>';
}

/* ===== פעולות על נתונים ===== */
async function createTask(v,r){
  const title=v.title.trim(),time=v.time||'';
  if(r.type==='none'){await save('cal_tasks',newId(),{title,time,date:v.date,done:false,createdAt:Date.now()});return {count:1}}
  const today=todayIL(),end=r.type==='monthdays'?monthEnd(today):weekEnd(today);
  const rule={type:r.type,days:r.type==='weekdays'?r.wd:r.type==='monthdays'?r.md:[]};
  const dates=occurrences(rule,today,end);
  const sid=newId(),now=Date.now();
  await save('cal_series',sid,{title,time,type:rule.type,days:rule.days,start:today,through:end,ended:false,createdAt:now});
  await Promise.all(dates.map((d,i)=>save('cal_tasks',sid+'_'+d,{title,time,date:d,done:false,seriesId:sid,createdAt:now+i})));
  return {count:dates.length,monthly:r.type==='monthdays'};
}
async function editTask(id,scope,v){
  const t=T(id);if(!t)return;
  const title=v.title.trim(),time=v.time||'';
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date&&!x.movedTo);
    await Promise.all(list.map(x=>save('cal_tasks',x.id,{...x,title,time})));
    const s=S.series.find(x=>x.id===t.seriesId);if(s)await save('cal_series',s.id,{...s,title,time});
  }else{
    await save('cal_tasks',id,{...t,title,time,date:v.date});
  }
}
async function deleteTask(id,scope){
  const t=T(id);if(!t)return;
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date);
    await Promise.all(list.map(x=>del('cal_tasks',x.id)));
    const s=S.series.find(x=>x.id===t.seriesId);
    if(s)await save('cal_series',s.id,{...s,ended:true});
    return;
  }
  if(t.movedFromId){const o=T(t.movedFromId);if(o){const {movedTo,movedToId,...rest}=o;await save('cal_tasks',o.id,rest)}}
  if(t.movedToId){const c=T(t.movedToId);if(c){const {movedFrom,movedFromId,...rest}=c;await save('cal_tasks',c.id,rest)}}
  await del('cal_tasks',id);
}
async function moveTask(id,nd){
  const t=T(id);if(!t)return;
  const nid=newId();
  await save('cal_tasks',nid,{title:t.title,time:t.time||'',date:nd,done:false,movedFrom:t.date,movedFromId:t.id,...(t.seriesId?{seriesId:t.seriesId}:{}),createdAt:Date.now()});
  await save('cal_tasks',t.id,{...t,movedTo:nd,movedToId:nid});
}
/* משימות חוזרות נוצרות רק לתקופה הנוכחית (שבוע או חודש). בסוף התקופה שואלים אם להמשיך לתקופה הבאה */
const periodEnd=(type,d)=>type==='monthdays'?monthEnd(d):weekEnd(d);
function seriesDue(s,today){return !s.ended&&today>=addDays(s.through,-1)}
async function continueSeries(s){
  const today=todayIL();
  const from=addDays(s.through,1)>today?addDays(s.through,1):today;
  const end=periodEnd(s.type,from);
  const dates=occurrences(s,from,end).filter(d=>!T(s.id+'_'+d));
  const now=Date.now();
  await Promise.all(dates.map((d,i)=>save('cal_tasks',s.id+'_'+d,{title:s.title,time:s.time||'',date:d,done:false,seriesId:s.id,createdAt:now+i})));
  await save('cal_series',s.id,{...s,through:end});
}
function checkSeries(){
  if(S.modal||S.pick||S.dragging||!S.loaded.t||!S.loaded.s)return;
  const today=todayIL();
  const s=S.series.find(x=>seriesDue(x,today)&&!S.dismissed.has(x.id)&&!S.busy.has(x.id));
  if(s)modal({type:'cont',sid:s.id});
}

/* ===== גרירה (עכבר: גרירה רגילה. מגע: לחיצה ארוכה ואז גרירה) ===== */
const DR={zone:0,zoneT:0,on:false,mode:null,id:null,sx:0,sy:0,x:0,y:0,timer:0,ghost:null,slot:null,raf:0};
function tkTarget(e){
  const b=e.target.closest&&e.target.closest('.tkbody');if(!b)return null;
  if(e.target.closest('button'))return null;
  const tk=b.closest('.tk');return tk&&tk.dataset.id&&tk.dataset.nodrag!=='1'?tk:null;
}
function dragStart(x,y){
  const t=T(DR.id);if(!t)return;
  DR.on=true;S.dragging=true;document.body.classList.add('dragging');
  const g=document.createElement('div');g.className='ghost';g.textContent=t.title;document.body.appendChild(g);DR.ghost=g;
  const src=document.querySelector('.tk[data-id="'+DR.id+'"]');if(src)src.classList.add('lifted');
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  dragMove(x,y);
  const loop=()=>{
    if(!DR.on)return;
    const nt=$('#nt'),boxTop=nt?nt.getBoundingClientRect().top:innerHeight;
    let sp=0,zone=0;
    if(DR.y<90){zone=-1;sp=-Math.ceil((90-DR.y)/90*16)}
    else if(DR.y>boxTop-70&&DR.y<boxTop){zone=1;sp=Math.ceil((DR.y-(boxTop-70))/70*16)}
    const now=performance.now();
    if(zone!==DR.zone){DR.zone=zone;DR.zoneT=now}
    /* גלילה אוטומטית רק אחרי שהאצבע נשארת בקצה רבע שנייה, כדי שלא תתחיל בטעות בזמן שגוררים החוצה מ"ללא שעה" */
    if(sp&&now-DR.zoneT>250){window.scrollBy(0,sp);dragMove(DR.x,DR.y)}
    DR.raf=requestAnimationFrame(loop);
  };
  DR.raf=requestAnimationFrame(loop);
}
function dragMove(x,y){
  DR.x=x;DR.y=y;
  if(DR.ghost){DR.ghost.style.transform='translate('+Math.round(x-30)+'px,'+Math.round(y-26)+'px)'}
  const el=document.elementFromPoint(x,y),sl=el&&el.closest?el.closest('[data-slot]'):null;
  document.querySelectorAll('.over').forEach(e=>{if(e!==sl)e.classList.remove('over')});
  if(sl)sl.classList.add('over');
  DR.slot=sl?sl.dataset.slot:null;
}
function dragEnd(commit){
  if(!DR.on)return;
  cancelAnimationFrame(DR.raf);
  const slot=DR.slot,id=DR.id;
  DR.on=false;S.dragging=false;DR.slot=null;
  document.body.classList.remove('dragging');
  if(DR.ghost){DR.ghost.remove();DR.ghost=null}
  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  const t=T(id);
  if(commit&&slot&&t){
    const nt=slot==='none'?'':slot;
    if(slotOf(t.time)!==slot&&(t.time||'')!==nt)guard(()=>save('cal_tasks',id,{...t,time:nt}));
  }
  S.pending=false;render();
}
document.addEventListener('mousedown',e=>{
  if(e.button!==0)return;const tk=tkTarget(e);if(!tk)return;
  DR.mode='mouse';DR.id=tk.dataset.id;DR.sx=e.clientX;DR.sy=e.clientY;
});
document.addEventListener('mousemove',e=>{
  if(DR.mode!=='mouse')return;
  if(!DR.on&&Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)>6)dragStart(e.clientX,e.clientY);
  else if(DR.on)dragMove(e.clientX,e.clientY);
});
document.addEventListener('mouseup',()=>{if(DR.mode==='mouse'){if(DR.on)dragEnd(true);DR.mode=null}});
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;const tk=tkTarget(e);if(!tk)return;
  const p=e.touches[0];DR.mode='touch';DR.id=tk.dataset.id;DR.sx=DR.x=p.clientX;DR.sy=DR.y=p.clientY;
  clearTimeout(DR.timer);DR.timer=setTimeout(()=>{DR.timer=0;dragStart(DR.sx,DR.sy)},380);
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(DR.mode!=='touch')return;const p=e.touches[0];
  if(DR.on){e.preventDefault();dragMove(p.clientX,p.clientY)}
  else if(DR.timer&&Math.hypot(p.clientX-DR.sx,p.clientY-DR.sy)>10){clearTimeout(DR.timer);DR.timer=0;DR.mode=null}
},{passive:false});
function touchDone(e){if(DR.mode!=='touch')return;clearTimeout(DR.timer);DR.timer=0;if(DR.on)dragEnd(e.type==='touchend');DR.mode=null}
document.addEventListener('touchend',touchDone);document.addEventListener('touchcancel',touchDone);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tkbody'))e.preventDefault()});

/* ===== אירועים ===== */
function openForm(mode,o){
  modal({type:'form',mode,id:o.id,scope:o.scope,vals:{title:o.title||'',date:o.date||S.sel,time:o.time||''},rec:{type:'none',wd:[],md:[]}});
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(S.pop&&!(e.target.closest&&e.target.closest('.pop')))closePop();
  if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  /* בוחרים */
  if(S.pick){
    const p=S.pick;
    if(a==='pkbg'){if(e.target===el)closePick();return}
    if(a==='pk-close'){closePick();return}
    if(a==='pk-prev'){p.view=addMonths(p.view+'-01',-1).slice(0,7);renderPick();return}
    if(a==='pk-next'){p.view=addMonths(p.view+'-01',1).slice(0,7);renderPick();return}
    if(a==='pk-day'){const cb=p.cb,v=el.dataset.d;closePick();cb(v);return}
    if(a==='pk-today'){const t=todayIL();if(p.min&&t<p.min){$('#pk_err').textContent='אי אפשר לבחור תאריך שעבר.';return}const cb=p.cb;closePick();cb(t);return}
    if(a==='pk-type'){const v=parseDateText($('#pk_in').value);if(!v){$('#pk_err').textContent='כתוב תאריך כמו 8/10/2026.';return}if(p.min&&v<p.min){$('#pk_err').textContent='אי אפשר לבחור תאריך שעבר.';return}const cb=p.cb;closePick();cb(v);return}
    if(a==='tp-h'){p.h=+el.dataset.v;renderPick(true);return}
    if(a==='tp-m'){p.m=+el.dataset.v;renderPick(true);return}
    if(a==='tp-clear'){const cb=p.cb;closePick();cb('');return}
    if(a==='tp-ok'){
      const typed=$('#tp_in').value.trim();let v=pad(p.h)+':'+pad(p.m);
      if(typed){v=parseTimeText(typed);if(!v){$('#pk_err').textContent='כתוב שעה כמו 18:30.';return}}
      const cb=p.cb;closePick();cb(v);return}
    return;
  }
  if(a==='pop-edit'||a==='pop-del'){
    const pid=S.pop&&S.pop.id;closePop();const t=T(pid);if(!t)return;
    if(a==='pop-edit'){if(t.seriesId)modal({type:'scope',id:t.id,op:'edit'});else openForm('edit',{id:t.id,scope:'one',title:t.title,date:t.date,time:t.time})}
    else{if(t.seriesId)modal({type:'scope',id:t.id,op:'delete'});else modal({type:'confirm',id:t.id})}
    return}
  if(a==='menu'){if(S.pop&&S.pop.id===id){closePop();return}openPop(id,el);return}
  if(a==='mbg'){if(e.target===el)closeModal();return}
  if(a==='mclose'){closeModal();return}
  if(a==='prev'){shiftMonth(-1);return}
  if(a==='next'){shiftMonth(1);return}
  if(a==='today'){const t=todayIL();S.month=t.slice(0,7);S.sel=t;render();return}
  if(a==='day'){openDay(el.dataset.d);return}
  if(a==='back'){backToMonth();return}
  if(a==='dprev'){stepDay(-1);return}
  if(a==='dnext'){stepDay(1);return}
  if(a==='add'){openForm('create',{date:S.sel});return}
  if(a==='tog'){const t=T(id);if(t&&!t.movedTo)guard(()=>save('cal_tasks',id,{...t,done:!t.done,doneAt:t.done?0:Date.now()}));return}
  if(a==='mv'){
    const t=T(id);if(!t)return;
    openDatePicker(todayIL(),todayIL(),nd=>{
      if(nd===t.date){toast('זה היום של המשימה.');return}
      guard(async()=>{await moveTask(id,nd);toast('הועבר ל־'+dm(nd))});
    });return}
  if(a==='signout'){S.signOut&&S.signOut();return}
  const m=S.modal;if(!m)return;
  if(a==='scope-one'||a==='scope-from'){
    const scope=a==='scope-one'?'one':'from',t=T(m.id);if(!t)return;
    if(m.op==='edit')openForm('edit',{id:t.id,scope,title:t.title,date:t.date,time:t.time});
    else{closeModal();guard(()=>deleteTask(t.id,scope))}
    return}
  if(a==='cont-yes'){const sr=S.series.find(x=>x.id===m.sid);closeModal();if(sr){S.busy.add(sr.id);guard(async()=>{try{await continueSeries(sr)}finally{S.busy.delete(sr.id)}checkSeries()})}return}
  if(a==='cont-no'){const sr=S.series.find(x=>x.id===m.sid);closeModal();if(sr){S.busy.add(sr.id);guard(async()=>{try{await save('cal_series',sr.id,{...sr,ended:true})}finally{S.busy.delete(sr.id)}checkSeries()})}return}
  if(a==='cont-later'){S.dismissed.add(m.sid);closeModal();checkSeries();return}
  if(a==='del-yes'){const i=m.id;closeModal();guard(()=>deleteTask(i,'one'));return}
  if(a==='rt'){collectForm();m.rec.type=el.dataset.k;rerenderForm();return}
  if(a==='wd'){collectForm();const i=+el.dataset.i,d=m.rec.wd;m.rec.wd=d.includes(i)?d.filter(x=>x!==i):[...d,i].sort();rerenderForm();return}
  if(a==='md'){collectForm();const i=+el.dataset.n,d=m.rec.md;m.rec.md=d.includes(i)?d.filter(x=>x!==i):[...d,i].sort((x,y)=>x-y);rerenderForm();return}
  if(a==='clr-time'){collectForm();m.vals.time='';rerenderForm();return}
  if(a==='open-time'){collectForm();openTimePicker(m.vals.time,v=>{m.vals.time=v;rerenderForm()});return}
  if(a==='open-date'){collectForm();openDatePicker(m.vals.date,m.mode==='create'?todayIL():'',v=>{m.vals.date=v;rerenderForm()});return}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f_form')return;
  e.preventDefault();
  collectForm();
  const m=S.modal,v=m.vals,err=$('#f_err');
  if(!v.title.trim()){err.textContent='כתוב שם למשימה.';return}
  const r=m.rec,create=m.mode==='create',recurring=create&&r.type!=='none';
  if(!recurring&&m.scope!=='from'&&!isDate(v.date)){err.textContent='בחר תאריך.';return}
  if(create){
    if(r.type==='weekdays'&&!r.wd.length){err.textContent='בחר לפחות יום אחד בשבוע.';return}
    if(r.type==='monthdays'&&!r.md.length){err.textContent='בחר לפחות יום אחד בחודש.';return}
    const rec={type:r.type,wd:[...r.wd],md:[...r.md]},vv={...v};
    closeModal();
    guard(async()=>{
      const res=await createTask(vv,rec);
      if(rec.type==='none'){S.sel=vv.date;S.month=vv.date.slice(0,7);render()}
      else if(!res.count)toast(res.monthly?'אין ימים מתאימים עד סוף החודש. המשימה תתחיל בחודש הבא.':'אין ימים מתאימים עד סוף השבוע. המשימה תתחיל בשבוע הבא.');
    });
  }else{
    const id=m.id,sc=m.scope,vv={...v};closeModal();
    guard(async()=>{await editTask(id,sc,vv);if(sc!=='from'&&isDate(vv.date)&&S.view==='month'){S.sel=vv.date;S.month=vv.date.slice(0,7);render()}});
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.pick)closePick();else if(S.pop)closePop();else if(S.modal)closeModal()}
  if(e.key==='Enter'&&S.pick){
    if(S.pick.type==='date'&&e.target.id==='pk_in'){e.preventDefault();const b=document.querySelector('[data-act="pk-type"]');if(b)b.click()}
    if(S.pick.type==='time'&&e.target.id==='tp_in'){e.preventDefault();const b=document.querySelector('[data-act="tp-ok"]');if(b)b.click()}
  }
});
addEventListener('resize',()=>{closePop();if(S.loaded.t)render()});
addEventListener('scroll',()=>{if(S.pop)closePop()},{passive:true});
function tick(){const t=todayIL();if(t!==S.lastToday){S.lastToday=t;render()}checkSeries()}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

function makeDb(fs,uid){
  return {
    collection:c=>({onSnapshot:(ok,err)=>FB.onSnapshot(FB.collection(fs,'users',uid,c),sn=>ok({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    doc:p=>{const [c,id]=p.split('/');const r=FB.doc(fs,'users',uid,c,id);return {set:d=>FB.setDoc(r,d),delete:()=>FB.deleteDoc(r)}}
  };
}
function showLogin(msg){$('#login').hidden=false;$('#loginErr').textContent=msg||''}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return 'הכתובת של האתר עדיין לא אושרה ב-Firebase.';if(c==='auth/network-request-failed')return 'אין חיבור לרשת. נסה שוב.';return 'הכניסה נכשלה. נסה שוב.'}
let startedFor=null;
function boot(){
  route();
  if(!window.FB){$('#app').innerHTML='<div class="loading">לא ניתן לטעון את רכיבי החיבור. רענן את הדף.</div>';return}
  const app=FB.initializeApp(FIREBASE_CONFIG),auth=FB.getAuth(app);
  let fs;try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){fs=FB.initializeFirestore(app,{})}
  FB.getRedirectResult(auth).catch(e=>showLogin(authMsg(e)));
  const provider=new FB.GoogleAuthProvider();
  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    try{await FB.signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await FB.signInWithRedirect(auth,provider)}catch(x){showLogin(authMsg(x))}}
      else if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){}
      else showLogin(authMsg(e));
    }
  });
  S.signOut=async()=>{try{await FB.signOut(auth)}catch(e){}location.reload()};
  FB.onAuthStateChanged(auth,user=>{
    if(!user){showLogin();return}
    $('#login').hidden=true;
    if(startedFor===user.uid)return;startedFor=user.uid;
    start(makeDb(fs,user.uid));
  });
}
function start(db){
  S.db=db;
  const bad=()=>{$('#app').innerHTML='<div class="loading">אין גישה למסד הנתונים. נסה לרענן או להתחבר מחדש.</div>'};
  db.collection('cal_series').onSnapshot(sn=>{S.series=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.s=true;render();checkSeries()},bad);
  db.collection('cal_tasks').onSnapshot(sn=>{S.tasks=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;render();checkSeries()},bad);
}
boot();
