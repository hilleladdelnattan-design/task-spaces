<style>

const MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

const pad=n=>String(n).padStart(2,'0');
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function ilParts(){const p=_fmt.formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}
const todayIL=()=>ilParts().date;
/* תאריכים הם מחרוזות "YYYY-MM-DD" (תאריך לוח בלבד). חישובים ב-UTC כדי שלא יושפעו משעון המכשיר או משעון קיץ */
const P=s=>s.split('-').map(Number);
const F=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function addDays(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1,d+n));return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dowOf(s){const [y,m,d]=P(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addMonths(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1+n,1));const yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;return F(yy,mm,Math.min(d,dim(yy,mm)))}
const weekEnd=s=>addDays(s,6-dowOf(s));

const monthSpanEnd=s=>addDays(addMonths(s,1),-1); /* חודש מלא החל מ־s: מה־8/10 עד ה־7/11 */
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&addDays(s,0)===s;

function occurrences(rule,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const ok=rule.type==='daily'||(rule.type==='weekdays'&&rule.days.includes(dowOf(d)))||(rule.type==='monthdays'&&rule.days.includes(+d.slice(8)));if(ok)out.push(d)}return out}

function status(t,today){if(t.movedTo)return 'moved';if(t.done)return 'done';if(!t.general&&t.date&&t.date<today)return 'missed';return 'open'}
const cmpT=(a,b)=>{const ta=a.time||'99:99',tb=b.time||'99:99';return ta<tb?-1:ta>tb?1:(a.createdAt||0)-(b.createdAt||0)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

/* טווח שעות: endTime קיים רק אם יש שעת התחלה, והוא אחרי ההתחלה. בלי endTime המשימה מוצגת כחצי שעה */
const endMin=t=>{if(!t.time||!t.endTime)return null;const s=toMin(t.time),e=toMin(t.endTime);return e>s?e:null};
const spanOf=t=>{const s=toMin(t.time),e=endMin(t);return [s,Math.max(e!==null?e:s+30,s+30)]};
function parseDateText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?$/.exec(s);if(!m)return '';
  let y=m[3]?+m[3]:+todayIL().slice(0,4);if(m[3]&&m[3].length===2)y+=2000;
  const r=F(y,+m[2],+m[1]);return isDate(r)?r:'';
}

  s=(s||'').trim();let m=/^(\d{1,2})[:.](\d{2})$/.exec(s)||/^(\d{2})(\d{2})$/.exec(s);if(!m)return '';

/* ===== תזכורות =====
   מבנה שמור במשימה: reminders=[{t:'before',m:5|15|60},{t:'at',time:'HH:MM'}]
   'before' = לפני שעת המשימה (רק למשימה עם שעה). 'at' = שעה מוחלטת באותו יום.
   האפליקציה הזו לא מפעילה שום התראה. reminderTimes מחזירה את הזמנים המחושבים כדי שגרסת אפליקציה (Capacitor) תוכל לתזמן התראות מקומיות. */
const REM_BEFORE=[5,15,60];
function remList(t){
  const a=Array.isArray(t.reminders)?t.reminders:[];
  return a.filter(r=>r&&((r.t==='before'&&t.time&&REM_BEFORE.includes(r.m))||(r.t==='at'&&/^\d{2}:\d{2}$/.test(r.time||''))));
}
function remSort(a){
  const b=a.filter(r=>r.t==='before').sort((x,y)=>y.m-x.m),c=a.filter(r=>r.t==='at').sort((x,y)=>x.time<y.time?-1:x.time>y.time?1:0);
  return [...b,...c];
}
const remLabel=r=>r.t==='at'?r.time:(r.m===60?_('שעה¦h'):r.m+(' '+_('דק׳')));
const remText=a=>{const l=remSort(a);return l.length?'🔔 '+l.map(remLabel).join(' · '):''};
function reminderTimes(t){
  if(!t.date)return [];
  return remSort(remList(t)).map(r=>{
    if(r.t==='at')return {date:t.date,time:r.time};
    const n=toMin(t.time)-r.m;
    return n>=0?{date:t.date,time:fromMin(n)}:{date:addDays(t.date,-1),time:fromMin(n+1440)};
  });
}
const sameRem=(a,b)=>JSON.stringify(remSort(a||[]))===JSON.stringify(remSort(b||[]));

/* פריסת משימות עם שעה: משימות שחופפות בזמן מוצגות זו לצד זו */
function layoutDay(timed){
  const it=timed.map(t=>{const [s,e]=spanOf(t);return {t,s,e}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],ce=0,cols=[];
  const flush=()=>{cl.forEach(x=>x.cols=cols.length);out.push(...cl);cl=[];cols=[];ce=0};
  for(const x of it){
    if(cl.length&&x.s>=ce)flush();
    let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}
    cols[c]=x.e;x.col=c;cl.push(x);ce=Math.max(ce,x.e);
  }
  flush();return out;
}
/* ציר הזמן הקומפקטי: שעה שיש בה משימה מוצגת בגובה מלא (96px), שעה ריקה בגובה מצומצם (24px).
   זה שינוי תצוגה בלבד: השעות והחישובים נשארים בדקות. בזמן גרירה השעה שמתחת לאצבע מורחבת (hoverHour). */
const CH=24,FH=2*HALF;
const hourH=h=>(S.tl.occ.has(h)||S.tl.exp===h)?FH:CH;
function yOfMin(m){const lo=S.tl.lo/60,hh=Math.floor(m/60);let y=0;for(let h=lo;h<hh&&h<24;h++)y+=hourH(h);if(hh<24)y+=(m-hh*60)/60*hourH(hh);return y}
function minOfY(y){let h=S.tl.lo/60;if(y<0)return S.tl.lo+y/hourH(h)*60;while(h<24){const k=hourH(h);if(y<k)return h*60+y/k*60;y-=k;h++}return 1440}
function linesHtml(){
  let s='';
  for(let h=S.tl.lo/60;h<24;h++){
    const full=S.tl.occ.has(h)||S.tl.exp===h,y=yOfMin(h*60);
    s+='<div class="gline hr'+(full?'':' cmp')+'" style="top:'+y+'px"><span class="st">'+pad(h)+':00</span></div>';
    if(full)s+='<div class="gline half" style="top:'+(y+HALF)+'px"><span class="st">'+pad(h)+':30</span></div>';
  }
  return s;
}
function applyScale(){
  const tl=$('#tl');if(!tl)return;
  tl.style.height=yOfMin(1440)+'px';
  $('#glines').innerHTML=linesHtml();
  tl.querySelectorAll('.blk').forEach(b=>{const s=+b.dataset.s,e=+b.dataset.e;b.style.top=(yOfMin(s)+1)+'px';b.style.height=(yOfMin(e)-yOfMin(s)-2)+'px'});
}
function renderDay(){
  const today=todayIL(),d=S.sel;
  const list=S.tasks.filter(t=>!t.general&&t.date===d).sort(cmpT);
  const timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let lo=360;timed.forEach(t=>{lo=Math.min(lo,Math.floor(toMin(t.time)/60)*60)});
  const occ=new Set();
  timed.forEach(t=>{const [s,e]=spanOf(t);for(let h=Math.floor(s/60);h<=Math.floor((Math.min(e,1440)-1)/60);h++)occ.add(h)});
  S.tl={lo,occ,exp:null};
  const blocks=layoutDay(timed).map(x=>taskHtml(x.t,today,{blk:{s:x.s,e:x.e,top:yOfMin(x.s)+1,h:yOfMin(x.e)-yOfMin(x.s)-2,r:x.col*100/x.cols,w:100/x.cols,narrow:x.cols>=2}})).join('');
  const nt=('<div class="nt" id="nt"><div class="ntn" id="ntn" data-drop="none"><div class="nth"><span>'+_('ללא שעה')+'</span></div>')+(untimed.length?'<div class="ns">'+untimed.map(t=>taskHtml(t,today)).join('')+'</div>':('<div class="none">'+_('אין משימות בלי שעה')+'</div>'))+'</div>'+dayGeneralHtml(today)+dayGoalsHtml()+'</div>';
  return ('<div class="wrap"><div class="dtop"><button type="button" class="tlink" data-act="back">📅 '+_('חזרה ללוח')+'</button><button type="button" class="pbtn sm" data-act="add">＋ '+_('הוסף משימה')+'</button></div><div class="dnav"><button type="button" class="arr" data-act="dprev" aria-label="'+_('יום קודם')+'"><span class="ltr">')+(LANG==='en'?'‹':'›')+'</span></button><div class="dtitle"><small>'+DOWN[dowOf(d)]+'</small><h1>'+esc(dayName(d))+(d===today?('<span class="tag">'+_('היום')+'</span>'):'')+('</h1></div><button type="button" class="arr" data-act="dnext" aria-label="'+_('יום הבא')+'"><span class="ltr">')+(LANG==='en'?'›':'‹')+'</span></button></div><div class="dsum">'+summary(list)+'</div><div class="tl" id="tl" style="height:'+yOfMin(1440)+'px"><div id="glines">'+linesHtml()+'</div><div class="lane" id="lane">'+blocks+'</div></div>'+nt+'</div>';
}

function render(){
  if(S.dragging){S.pending=true;return}
  S.noAutoUntil=performance.now()+700;
  const root=$('#app');
  if(!S.loaded.t||!S.loaded.s){root.innerHTML=('<div class="loading">'+_('טוען…')+'</div>');return}
  const y=window.scrollY;
  root.innerHTML=S.view==='day'?renderDay():S.view==='goal'?renderGoal():S.view==='settings'?renderSettings():renderMonth();
  if(S.autoScroll&&S.view==='day'){S.autoScroll=false;scrollToRelevant()}else if(S.autoScroll){S.autoScroll=false;window.scrollTo(0,0)}else window.scrollTo(0,y);
}
function scrollToRelevant(){
  const first=S.tasks.filter(t=>!t.general&&t.date===S.sel&&t.time).sort(cmpT)[0];
  let m=first?toMin(first.time):null;
  if(m===null){const n=ilParts();m=S.sel===n.date?n.h*60+n.m:8*60}
  const tl=$('#tl');if(!tl)return;
  const y=tl.getBoundingClientRect().top+window.scrollY+yOfMin(Math.max(m,S.tl.lo));
  window.scrollTo(0,Math.max(0,y-150));
}

/* ===== ניווט ===== */
function route(){
  const m=/^#d=(\d{4}-\d{2}-\d{2})$/.exec(location.hash),gm=/^#g=([A-Za-z0-9_-]+)$/.exec(location.hash);
  const pv=S.view+'|'+S.sel;S.expand='';
  if(location.hash==='#s'){if(S.view!=='settings')S.autoScroll=true;S.view='settings'}
  else if(gm){if(S.view!=='goal')S.autoScroll=true;S.view='goal';S.goalId=gm[1]}
  else if(m&&isDate(m[1])){if(S.view!=='day')S.autoScroll=true;S.view='day';S.sel=m[1];S.month=m[1].slice(0,7)}
  else S.view='month';
  if(S.view==='day'&&pv!=='day|'+S.sel)S.dayUI={gen:false,goals:false,manual:false};
  render();
}
function openDay(d){S.sel=d;S.month=d.slice(0,7);S.autoScroll=true;history.pushState({v:'day'},'','#d='+d);route()}
function stepDay(k){const d=addDays(S.sel,k);history.replaceState({v:'day'},'','#d='+d);S.autoScroll=true;route()}
function openSettings(){S.autoScroll=true;history.pushState({v:'settings'},'','#s');route()}
function openGoal(id){S.autoScroll=true;history.pushState({v:'goal'},'','#g='+id);route()}
function backToMonth(){if(history.state&&(history.state.v==='day'||history.state.v==='goal'||history.state.v==='settings'))history.back();else{history.replaceState(null,'',location.pathname+location.search);route()}}
function shiftMonth(k){const mk=addMonths(S.month+'-01',k).slice(0,7);S.month=mk;const t=todayIL();S.sel=t.slice(0,7)===mk?t:mk+'-01';render()}
/* לחיצה על יום בלוח: בחירה וסיכום. לחיצה כפולה (או הקשה כפולה במגע) פותחת את מסך היום */
function dayClick(d){
  const now=Date.now(),L=S.lastDay;
  if(L.d===d&&now-L.t<450){S.lastDay={d:'',t:0};openDay(d);return}
  S.lastDay={d,t:now};S.sel=d;render();
}

/* ===== פעולות על נתונים ===== */
const mkInst=(s,d,i,now)=>({title:s.title,details:s.details||'',time:s.time||'',endTime:s.endTime||'',date:d,done:false,seriesId:s.id,reminders:s.reminders||[],createdAt:now+i});
function createQuick(title,time,date){
  dbSet('cal_tasks',newId(),{title,time:time||'',endTime:'',date,done:false,reminders:[],createdAt:Date.now()});
}
function createGeneral(title,details){
  dbSet('cal_tasks',newId(),{title,details:details||'',time:'',endTime:'',date:'',general:true,done:false,reminders:[],createdAt:Date.now()});
}
function createTask(v,r){
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'',details=(v.details||'').trim();
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(r.type==='none'){dbSet('cal_tasks',newId(),{title,details,time,endTime,date:v.date,done:false,reminders,createdAt:Date.now()});return {count:1}}
  const today=todayIL();
  const end=r.type==='monthdays'?monthEnd(today):r.type==='daily'?monthSpanEnd(today):weekEnd(today);
  const rule={type:r.type,days:r.type==='weekdays'?r.wd:r.type==='monthdays'?r.md:[]};
  const dates=occurrences(rule,today,end);
  const sid=newId(),now=Date.now();
  const s={id:sid,title,details,time,endTime,reminders,type:rule.type,days:rule.days,start:today,through:end,ended:false,createdAt:now};
  dbSet('cal_series',sid,s);
  dates.forEach((d,i)=>dbSet('cal_tasks',sid+'_'+d,mkInst(s,d,i,now)));
  return {count:dates.length,monthly:r.type==='monthdays',daily:r.type==='daily'};
}
function editTask(id,scope,v){
  const t=T(id);if(!t)return;
  const details=(v.details||'').trim();
  if(t.general){updTask(id,{title:v.title.trim(),details});return}
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'';
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date&&!x.movedTo);
    list.forEach(x=>updTask(x.id,{title,details,time,endTime,reminders}));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{title,details,time,endTime,reminders});
  }else{
    updTask(id,{title,details,time,endTime,reminders,date:isDate(v.date)?v.date:t.date});
  }
}
function deleteTask(id,scope){
  const t=T(id);if(!t)return;
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date);
    const ids=new Set(list.map(x=>x.id));
    S.tasks=S.tasks.filter(x=>!ids.has(x.id));
    list.forEach(x=>dbDel('cal_tasks',x.id));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{ended:true});
    return;
  }
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  if(t.movedToId&&T(t.movedToId))updTask(t.movedToId,{movedFrom:'',movedFromId:''});
  S.tasks=S.tasks.filter(x=>x.id!==id);
  dbDel('cal_tasks',id);
}
function moveTask(id,nd){
  const t=T(id);if(!t)return;
  const nid=newId();
  dbSet('cal_tasks',nid,{title:t.title,details:t.details||'',time:t.time||'',endTime:t.endTime||'',date:nd,done:false,reminders:t.reminders||[],movedFrom:t.date,movedFromId:t.id,...(t.seriesId?{seriesId:t.seriesId}:{}),...(t.goalId?{goalId:t.goalId,goalSub:t.goalSub||''}:{}),createdAt:Date.now()});
  updTask(t.id,{movedTo:nd,movedToId:nid});
}
/* הפיכת משימה עם תאריך למשימה כללית: מוחקים רק תאריך ושעה. שם, פרטים, תזכורות וקישור ליעד נשמרים.
   לא חלה על משימה חוזרת. אם זו משימה שהועברה מיום שהוחמץ, הקישור להיסטוריה מתנתק והמקור חוזר להיות "הוחמצה" */
const canGeneral=t=>!!t&&!t.general&&!t.seriesId&&!t.movedTo;
function toGeneral(id){
  const t=T(id);if(!canGeneral(t))return false;
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  updTask(id,{general:true,date:'',time:'',endTime:'',movedFrom:'',movedFromId:''});
  return true;
}
/* משימות חוזרות נוצרות רק לתקופה הנוכחית (שבוע, חודש או חודש מלא מהיום). בסוף התקופה שואלים אם להמשיך */
const periodEnd=(type,d)=>type==='monthdays'?monthEnd(d):type==='daily'?monthSpanEnd(d):weekEnd(d);
function seriesDue(s,today){return !s.ended&&today>=addDays(s.through,-1)}
function continueSeries(s){
  const today=todayIL();
  const from=addDays(s.through,1)>today?addDays(s.through,1):today;
  const end=periodEnd(s.type,from);
  const dates=occurrences(s,from,end).filter(d=>!T(s.id+'_'+d));
  const now=Date.now();
  /* קודם מעדכנים את סוף התקופה, כדי שהצצת הנתונים שמגיעה בזמן הכתיבה לא תשאל שוב */
  updSeries(s.id,{through:end});
  dates.forEach((d,i)=>dbSet('cal_tasks',s.id+'_'+d,mkInst(s,d,i,now)));
}
function checkSeries(){
  if(S.modal||S.pick||S.dragging||!S.loaded.t||!S.loaded.s)return;
  const today=todayIL();
  const s=S.series.find(x=>seriesDue(x,today)&&!S.dismissed.has(x.id));
  if(s)modal({type:'cont',sid:s.id});
}

function recHtml(m){
  const r=m.rec,today=todayIL();
  const opt=(k,l)=>'<button type="button" data-act="rt" data-k="'+k+'" aria-pressed="'+(r.type===k)+'">'+l+'</button>';
  let h=('<div class="frow col"><span class="fl">'+_('חזרה')+'</span><div class="seg" role="group" aria-label="'+_('חזרה')+'">')+opt('none',_('לא חוזרת'))+opt('daily',_('כל יום'))+opt('weekdays',_('ימים השבוע'))+opt('monthdays',_('ימים החודש'))+'</div></div>';
  if(r.type==='daily')h+=('<p class="note">'+_('המשימה תיווצר לכל יום, מהיום ועד')+' ')+dm(monthSpanEnd(today))+('. '+_('בסוף התקופה תישאל אם להמשיך לחודש הבא.')+'</p>');

/* ===== גרירה =====
   עכבר: גרירה רגילה. מגע: לחיצה ארוכה ואז גרירה.
   ידיות למעלה ולמטה של משימה בציר הזמן: גרירה מיידית (בלי לחיצה ארוכה) שמשנה את שעת ההתחלה או הסיום.
   כל הגרירות נצמדות לחצאי שעה. אחרי שחרור אין שום חלון. */
const DR={imm:false,hv:null,on:false,mode:null,kind:'move',id:null,chip:null,sx:0,sy:0,x:0,y:0,timer:0,ghost:null,raf:0,zone:0,zoneT:0,prop:null,p0:0,fromTl:false,endT:-1e9};
/* מקורות גרירה: משימה (כרטיס), פריט משימה בתוך תא בלוח החודשי, ידית שינוי שעה, או "שבב" של פעילות ליעד */
function dragSrc(e){
  const t=e.target;if(!t.closest||S.view==='goal')return null;
  const hd=t.closest('.hd');
  if(hd){const tk=hd.closest('.tk');return tk&&tk.dataset.id?{id:tk.dataset.id,kind:hd.dataset.h==='t'?'rt':'rb'}:null}
  const mvc=t.closest('.mvchip');
  if(mvc&&S.moving&&S.view==='month')return {id:S.moving.id,kind:'move',imm:true};
  const ch=t.closest('.gchip');
  if(ch&&ch.dataset.gid)return {id:'',kind:'move',chip:{gid:ch.dataset.gid,sub:ch.dataset.sub||''}};
  const ci=t.closest('.cell .t[data-tid]');
  if(ci&&S.view==='month')return {id:ci.dataset.tid,kind:'move'};
  const b=t.closest('.tkbody');if(!b||t.closest('button'))return null;
  const tk=b.closest('.tk');return tk&&tk.dataset.id&&tk.dataset.nodrag!=='1'?{id:tk.dataset.id,kind:'move'}:null;
}

function dragTask(){return DR.chip?{id:'',title:goalTaskTitle(DR.chip.gid,DR.chip.sub),general:true}:T(DR.id)}
function minAt(y){const tl=$('#tl');if(!tl)return null;return minOfY(y-tl.getBoundingClientRect().top)}
/* ציר קומפקטי: כשהמצביע נח מעל שעה ריקה (רבע שנייה בערך) היא מתרחבת לגובה מלא כדי לבחור זמן מדויק.
   עד אז עוברים מהר בין שעות ריקות בגובה המצומצם. מעגנים את הגלילה כך שהשעה נשארת מתחת למצביע */
const HOVER_MS=110;
function hoverCheck(y){
  DR.hvSeen=true;
  const tl=$('#tl');if(!tl){DR.hv=null;return}
  const m=minOfY(y-tl.getBoundingClientRect().top);
  if(m<S.tl.lo||m>=1440){DR.hv=null;return}
  const h=Math.floor(m/60),want=S.tl.occ.has(h)?null:h;
  if(want===S.tl.exp){DR.hv=null;return}
  if(!DR.hv||DR.hv.h!==h)DR.hv={h,want,t:performance.now()};
}
function hoverApply(){
  const hv=DR.hv,tl=$('#tl');
  if(!hv||!tl||performance.now()-hv.t<HOVER_MS)return false;
  DR.hv=null;
  const before=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  S.tl.exp=hv.want;applyScale();
  const after=tl.getBoundingClientRect().top+yOfMin(hv.h*60);
  if(Math.abs(after-before)>.5)window.scrollBy(0,after-before);
  /* שעה מורחבת שיורדת מתחת לתיבת "ללא שעה" הצמודה למטה: גוללים מעט כדי שתהיה נגישה, בלי להוציא את המצביע ממנה */
  if(hv.want!==null){
    const nt=$('#nt'),lim=(nt?nt.getBoundingClientRect().top:innerHeight)-10,bottom=tl.getBoundingClientRect().top+yOfMin((hv.h+1)*60);
    if(bottom>lim&&DR.y<lim-2){const d=Math.min(bottom-lim,bottom-DR.y-2);if(d>0)window.scrollBy(0,d)}
  }
  return true;
}
function proposeMove(t,min){
  const em=t.time?endMin(t):null,dur=em!==null?em-toMin(t.time):0;
  let s;
  if(DR.fromTl&&t.time){const s0=toMin(t.time),delta=min-DR.p0;s=Math.abs(delta)<15?s0:Math.max(0,Math.min(snap30(s0+delta),dur?floor30(1439-dur):1410))}
  else s=Math.max(0,Math.min(floor30(min),dur?floor30(1439-dur):1410));

function applyDrop(t,prop){

    if(v.time&&v.end&&toMin(v.end)<=toMin(v.time)){err.textContent=_('שעת הסיום חייבת להיות אחרי שעת ההתחלה.');return}

  if(create){
    if(r.type==='weekdays'&&!r.wd.length){err.textContent=_('בחר לפחות יום אחד בשבוע.');return}
    if(r.type==='monthdays'&&!r.md.length){err.textContent=_('בחר לפחות יום אחד בחודש.');return}

    render();

    if(sc!=='from'&&isDate(vv.date)&&S.view==='month'&&!m.general){S.sel=vv.date;S.month=vv.date.slice(0,7)}
    render();
  }
});

/* ===== יעדים =====
   cal_goals:    {title,desc,period:'week'|'month',target,targetHist:[{from,target}],subs:[{id,name}],archived,createdAt}
   cal_goal_log: {goalId,date,subId,subName,note,createdAt}   (עדכון ידני: פעילות שבוצעה בלי משימה ביומן)
   משימה ביומן שקשורה ליעד: cal_tasks עם goalId (ו־goalSub אופציונלי).
   ההתקדמות לא נשמרת כמספר: היא תמיד מחושבת מהרשומות, לכן אי אפשר לספור פעילות פעמיים:
   הושלמו = משימות מקושרות שסומנו כבוצעו (לפי תאריך המשימה ביומן, בתוך התקופה) + רשומות ידניות בתקופה.
   מתוכננות = משימות מקושרות שלא בוצעו ותאריכן היום או אחר כך, בתוך התקופה.
   תקופה חדשה = טווח תאריכים חדש, ולכן הספירה מתחילה מאפס. תקופות קודמות נשארות כהיסטוריה (שום דבר לא נמחק). */
const gById=id=>S.goals.find(g=>g.id===id);
/* מצבי יעד: פעיל (ברירת מחדל), הוסר מהפעילים (removed), בארכיון (archived). בשני המצבים הלא־פעילים כל הנתונים נשמרים: המשימות, הרשומות והיסטוריית התקופות */
const gIsActive=g=>!g.archived&&!g.removed;
const gSort=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
const gActive=()=>S.goals.filter(gIsActive).sort(gSort);
const gInactive=()=>S.goals.filter(g=>!gIsActive(g)).sort(gSort);
const pStart=(per,d)=>per==='week'?addDays(d,-dowOf(d)):d.slice(0,7)+'-01';
const pEnd=(per,ps)=>per==='week'?addDays(ps,6):monthEnd(ps);
const pNext=(per,ps)=>per==='week'?addDays(ps,7):addMonths(ps,1);
const pLabel=(per,ps)=>{if(per==='week')return (_('שבוע')+' ')+dm(ps)+'–'+dm(pEnd(per,ps));const [y,m]=P(ps);return MONTHS[m-1]+' '+y};
const perName=per=>per==='week'?_('שבועי'):_('חודשי');
const perUnit=per=>per==='week'?_('בשבוע'):_('בחודש');
function dateOfTs(ts){const p=_fmt.formatToParts(new Date(ts));const g=t=>p.find(x=>x.type===t).value;return g('year')+'-'+g('month')+'-'+g('day')}
function targetFor(g,ps){
  const h=Array.isArray(g.targetHist)?g.targetHist:[];let best=null;
  for(const x of h)if(x.from<=ps&&(!best||x.from>=best.from))best=x;
  return best?best.target:(h.length?h[0].target:g.target);
}
function subName(g,id){const s=(g.subs||[]).find(x=>x.id===id);return s?s.name:''}
function goalTaskTitle(gid,sub){const g=gById(gid);if(!g)return _('פעילות');const n=sub?subName(g,sub):'';return g.title+(n?' · '+n:'')}
function goalStats(g,ps,today){
  const pe=pEnd(g.period,ps);
  const tasks=S.tasks.filter(t=>t.goalId===g.id&&!t.general&&t.date&&t.date>=ps&&t.date<=pe&&!t.movedTo);
  const doneT=tasks.filter(t=>t.done),planT=tasks.filter(t=>!t.done&&t.date>=today),missT=tasks.filter(t=>!t.done&&t.date<today);
  const logs=S.glog.filter(l=>l.goalId===g.id&&l.date>=ps&&l.date<=pe);
  const subs={};const add=(id,k)=>{id=id||'';(subs[id]=subs[id]||{done:0,planned:0})[k]++};
  doneT.forEach(t=>add(t.goalSub,'done'));logs.forEach(l=>add(l.subId,'done'));planT.forEach(t=>add(t.goalSub,'planned'));
  return {ps,pe,target:targetFor(g,ps),done:doneT.length+logs.length,planned:planT.length,doneT,planT,missT,logs,subs};
}
const plannedText=n=>n===0?_('אין פעילויות מתוכננות'):n===1?_('פעילות אחת מתוכננת'):n+(' '+_('פעילויות מתוכננות'));
const doneText=st=>'<span class="ltr">'+st.done+'/'+st.target+('</span> '+_('הושלמו'));
const pct=st=>Math.max(0,Math.min(100,Math.round(st.done/st.target*100)));

function planGoalTask(gid,sub,date,time){

function addGoalLog(gid,date,sub,note){
  const g=gById(gid);if(!g)return;
  const id=newId(),o={goalId:gid,date,subId:sub||'',subName:sub?subName(g,sub):'',note:(note||'').trim(),createdAt:Date.now()};
  S.glog.push({id,...o});dbSet('cal_goal_log',id,o);
}
function delGoalLog(id){S.glog=S.glog.filter(l=>l.id!==id);dbDel('cal_goal_log',id)}
function updGoal(id,p){const g=gById(id);if(g)Object.assign(g,p);dbUpd('cal_goals',id,p)}
function saveGoal(v,id){
  const title=v.title.trim(),desc=(v.desc||'').trim(),target=parseInt(v.target,10),subs=v.subs.map(s=>({id:s.id,name:s.name}));
  const today=todayIL();
  if(!id){
    const nid=newId(),ps=pStart(v.period,today);
    const g={title,desc,period:v.period,target,targetHist:[{from:ps,target}],subs,archived:false,createdAt:Date.now()};
    S.goals.push({id:nid,...g});dbSet('cal_goals',nid,g);return nid;
  }
  const g=gById(id);if(!g)return id;
  const patch={title,desc,subs};
  const ps=pStart(g.period,today);
  if(target!==targetFor(g,ps)){
    patch.target=target;
    patch.targetHist=[...(g.targetHist||[]).filter(x=>x.from!==ps),{from:ps,target}].sort((a,b)=>a.from<b.from?-1:1);
  }
  updGoal(id,patch);return id;
}

   רק על גלילה של המשתמש, עם היסטרזיס ועם השהיה, ובלי רינדור מחדש (כדי שלא יהיו קפיצות). פתיחה ידנית מבטלת את האוטומט עד שמחליפים יום */
function applyDayUI(){

    const e=$(sel);if(!e)return;e.classList.toggle('open',secOpen(k));
    const b=e.querySelector('.sechb');if(b)b.setAttribute('aria-expanded',secOpen(k));
  });

function dayScrollCheck(){
  if(S.view!=='day'||S.dragging||S.dayUI.manual||S.modal||S.pick)return;
  if(performance.now()<(S.noAutoUntil||0))return;
  const tl=$('#tl');if(!tl)return;
  const end=tl.getBoundingClientRect().bottom,vh=innerHeight;
  /* נפתחים כשהמשתמש גלל עד סוף הדף וסוף ציר השעות נראה. חוזרים לקומפקטי כשחוזרים לראש הדף או כשסוף הציר יצא מהמסך.
     באמצע (כשכבר פתוח) לא משנים כלום, כדי שלא יהיו קפיצות */
  const sy=window.scrollY,atBottom=sy>8&&sy+vh>=document.documentElement.scrollHeight-40;
  const want=(end<=vh-6&&atBottom)?true:(end>vh+70||sy<=8)?false:null;
  if(want===null||(S.dayUI.gen===want&&S.dayUI.goals===want))return;
  const now=performance.now();if(now-(S.dayUI.t||0)<450)return;
  S.dayUI.t=now;S.dayUI.gen=want;S.dayUI.goals=want;applyDayUI();
}

    h+='<div class="gcur"><div class="gcl">'+esc(pLabel(g.period,ps))+(' · '+_('התקופה הנוכחית')+'</div><div class="gbar big')+(st.done>=st.target?' full':'')+'"><i style="width:'+pct(st)+'%"></i></div><div class="gbig">'+doneText(st)+'</div><div class="gplan">'+plannedText(st.planned)+(' '+_('בלוח')+'</div>')+(st.done>=st.target?('<div class="gok">✓ '+_('היעד הושג בתקופה הזו')+'</div>'):'')+'</div>';
    /* עדכון התקדמות: ישיר, בדיעבד, או דרך היומן */
    h+=('<div class="gsecn"><h2>'+_('עדכון התקדמות')+'</h2><div class="gupd"><button type="button" class="gbtn" data-act="g-dec" data-id="')+g.id+('" aria-label="'+_('הסר עדכון אחרון')+'">−</button><button type="button" class="pbtn" data-act="g-inc" data-id="')+g.id+('" data-sub="">＋ '+_('בוצעה פעילות היום')+'</button></div>');
    if((g.subs||[]).length)h+='<div class="gchips">'+g.subs.map(s=>'<button type="button" class="gchip solid" data-act="g-inc" data-id="'+g.id+'" data-sub="'+esc(s.id)+'">＋ '+esc(s.name)+'</button>').join('')+'</div>';
    h+='<div class="gupd"><button type="button" class="gbtn" data-act="g-addlog" data-id="'+g.id+('">'+_('הוסף פעילות שבוצעה בעבר…')+'</button></div>');
    h+=('<h3>'+_('תכנון ביומן')+'</h3><div class="gchips">')+(g.subs&&g.subs.length?'':'')+chipsHtml(g,false)+('</div><div class="note">'+_('אחרי שהפעילות מסומנת כבוצעה ביומן היא נספרת ביעד. תכנון לבדו לא נספר כהתקדמות.')+'</div></div>');
    /* פירוט לפי סוגים */
    if((g.subs||[]).length){
      const rows=g.subs.map(s=>{const x=st.subs[s.id]||{done:0,planned:0};return '<tr><td>'+esc(s.name)+'</td><td>'+x.done+'</td><td>'+x.planned+'</td></tr>'}).join('');
      const o=st.subs['']||{done:0,planned:0};
      const known=new Set(g.subs.map(s=>s.id)),other={done:0,planned:0};
      Object.keys(st.subs).forEach(k=>{if(k&&!known.has(k)){other.done+=st.subs[k].done;other.planned+=st.subs[k].planned}});
      h+=('<div class="gsecn"><h2>'+_('פירוט לפי סוג')+'</h2><table class="stbl"><tr><th></th><th>'+_('הושלמו')+'</th><th>'+_('מתוכננות')+'</th></tr>')+rows+('<tr><td>'+_('ללא סוג')+'</td><td>')+o.done+'</td><td>'+o.planned+'</td></tr>'+(other.done||other.planned?('<tr><td>'+_('סוג שהוסר')+'</td><td>')+other.done+'</td><td>'+other.planned+'</td></tr>':'')+'</table></div>';
    }
    /* פעילויות בתקופה */
    const acts=[...st.doneT,...st.planT,...st.missT].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:cmpT(a,b));
    h+=('<div class="gsecn"><h2>'+_('פעילויות בתקופה')+'</h2>');
    if(!acts.length&&!st.logs.length)h+=('<div class="none">'+_('אין עדיין פעילויות בתקופה הזו.')+'</div>');
    acts.forEach(t=>{h+='<div class="arow"><button type="button" class="adate" data-act="g-day" data-d="'+t.date+'">'+esc(dm(t.date))+'</button><div class="agrow">'+taskHtml(t,today)+'</div></div>'});
    st.logs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)).forEach(l=>{
      h+='<div class="arow"><span class="adate">'+esc(dm(l.date))+('</span><div class="lrow"><span class="lok">✓</span><div class="lbody"><div>'+_('עדכון ידני'))+(l.subId&&(subName(g,l.subId)||l.subName)?' · '+esc(subName(g,l.subId)||l.subName):'')+'</div>'+(l.note?'<div class="det">'+esc(l.note)+'</div>':'')+'</div><button type="button" class="kebab" data-act="g-dellog" data-id="'+l.id+('" aria-label="'+_('הסר עדכון')+'">✕</button></div></div>');
    });
    h+='</div>';
    const gen=S.tasks.filter(t=>t.goalId===g.id&&t.general);
    if(gen.length)h+=('<div class="gsecn"><h2>'+_('משימות כלליות של היעד')+'</h2><div class="note">'+_('משימה כללית אינה נספרת ביעד עד ששובצה ליום.')+'</div>')+gen.map(t=>taskHtml(t,today)).join('')+'</div>';
    /* היסטוריה */
    let first=pStart(g.period,dateOfTs(g.createdAt||Date.now()));
    S.tasks.forEach(t=>{if(t.goalId===g.id&&t.date&&!t.general){const s=pStart(g.period,t.date);if(s<first)first=s}});
    S.glog.forEach(l=>{if(l.goalId===g.id){const s=pStart(g.period,l.date);if(s<first)first=s}});
    const past=[];for(let p=first,i=0;p<ps&&i<400;p=pNext(g.period,p),i++)past.push(p);
    h+=('<div class="gsecn"><h2>'+_('היסטוריה')+'</h2>');
    if(!past.length)h+=('<div class="none">'+_('עדיין אין תקופות קודמות.')+'</div>');
    past.reverse().slice(0,60).forEach(p=>{
      const x=goalStats(g,p,today),ok=x.done>=x.target,ent=entriesLine(g,x);
      h+='<div class="hrow"><div class="hl"><b>'+esc(pLabel(g.period,p))+'</b><span class="'+(ok?'hok':'hno')+'"><span class="ltr">'+x.done+'/'+x.target+'</span> '+(ok?'✓':'')+'</span></div>'+(ent?'<div class="hent">'+ent+'</div>':'')+'</div>';
    });
    h+='</div>';
    h+='<div class="gfoot">'+(gIsActive(g)?'<button type="button" class="gbtn" data-act="g-archive" data-id="'+g.id+('">'+_('העברה לארכיון')+'</button> <button type="button" class="gbtn" data-act="g-remove" data-id="')+g.id+('">'+_('הסרה מהיעדים הפעילים')+'</button>'):'<button type="button" class="pbtn" data-act="g-restore" data-id="'+g.id+('">'+_('שחזור ליעדים הפעילים')+'</button>'))+('<div class="note">'+_('אין מחיקה של יעד: המשימות וההיסטוריה נשמרות תמיד.')+'</div></div></div>');
    return h;
  }catch(e){console.error('goalscreen',e);return '<div class="wrap">'+back+('<div class="loading">'+_('אירעה שגיאה בתצוגת היעד.')+'</div></div>')}
}

function collectGoalForm(){
  const m=S.modal;if(!m)return;
  if(m.type==='goal'){
    const a=$('#g_title');if(a)m.vals.title=a.value;
    const b=$('#g_desc');if(b)m.vals.desc=b.value;
    const c=$('#g_target');if(c)m.vals.target=c.value;
    const d=$('#g_subin');if(d)m.vals.subin=d.value;
  }else if(m.type==='glog'){
    const n=$('#gl_note');if(n)m.vals.note=n.value;
  }
}
/* מציירים מחדש בלי לקרוא את השדות מחדש: הקורא אוסף את השדות לפני שהוא משנה ערך, אחרת הערך החדש נדרס בערך הישן שעדיין בשדה */
function rerenderGoalForm(){S.modal.noFocus=true;renderModal()}
function addSubFromInput(silent){
  const m=S.modal;if(!m||m.type!=='goal')return true;
  collectGoalForm();
  const name=(m.vals.subin||'').trim();
  if(!name)return true;
  if(m.vals.subs.some(s=>s.name.toLowerCase()===name.toLowerCase())){if(silent){m.vals.subin='';return true}const e=$('#f_err');if(e)e.textContent=_('הסוג הזה כבר קיים.');return false}
  if(m.vals.subs.length>=12){const e=$('#f_err');if(e)e.textContent=_('אפשר עד 12 סוגים.');return false}
  m.vals.subs.push({id:'s'+Math.random().toString(36).slice(2,8),name});m.vals.subin='';
  return true;
}
function goalSubmit(fid){
  const m=S.modal;if(!m)return;
  const err=$('#f_err');
  if(fid==='g_form'){
    collectGoalForm();
    const v=m.vals;
    if(!v.title.trim()){err.textContent=_('כתוב שם ליעד.');return}
    const tg=parseInt(String(v.target).trim(),10);
    if(!/^\d+$/.test(String(v.target).trim())||tg<1||tg>999){err.textContent=_('הכמות חייבת להיות מספר שלם בין 1 ל־999.');return}
    if(!addSubFromInput(true))return;
    v.target=tg;
    const id=m.id;closeModal();
    const nid=saveGoal(v,id);
    render();toast(id?_('היעד עודכן'):_('היעד נוצר'));
    return;
  }
  if(fid==='gl_form'){
    collectGoalForm();
    const v=m.vals,today=todayIL();
    if(!isDate(v.date)){err.textContent=_('בחר תאריך.');return}
    if(v.date>today){err.textContent=_('אי אפשר להוסיף פעילות עתידית. לתכנון עתידי השתמש בלוח.');return}
    const gid=m.gid;closeModal();
    addGoalLog(gid,v.date,v.sub,v.note);
    render();toast(_('הפעילות נוספה ליעד'));
  }
}

/* תפריט ⋮ ביעד: עריכה, הסרה מהפעילים, העברה לארכיון (ליעד לא פעיל: שחזור). כל הפעולות שומרות משימות והיסטוריה */
function openGoalPop(id,btn){
  const g=gById(id);if(!g)return;
  const r=btn.getBoundingClientRect();
  S.pop={id,sy:window.scrollY,goal:true};
  const it=(act,l,c)=>'<button type="button" role="menuitem"'+(c?' class="'+c+'"':'')+' data-act="'+act+'" data-id="'+id+'">'+l+'</button>';
  const root=$('#popRoot');
  root.innerHTML='<div class="pop" role="menu" id="popBox">'+it('g-edit',('✏️ '+_('עריכה')))+(gIsActive(g)?it('g-remove',('➖ '+_('הסרה מהיעדים הפעילים')))+it('g-archive',('📦 '+_('העברה לארכיון'))):it('g-restore',('♻️ '+_('שחזור ליעדים הפעילים'))))+'</div>';
  const box=$('#popBox'),w=box.offsetWidth,hh=box.offsetHeight;
  let left=Math.min(Math.max(8,r.left),innerWidth-w-8),top=r.bottom+2;
  if(top+hh>innerHeight-8)top=Math.max(8,r.top-hh-2);
  box.style.left=left+'px';box.style.top=top+'px';
}

/* ===== לחיצות ===== */
function goalClick(a,el,id,e){
  if(a!=='sec-tog'&&(a.charAt(0)!=='g'||(a.charAt(1)!=='-'&&a.charAt(1)!=='l')))return false;
  const today=todayIL(),m=S.modal;
  if(a==='g-new'){modal({type:'goal',vals:{title:'',desc:'',period:'week',target:'3',subs:[],subin:''}});return true}
  if(a==='g-open'){openGoal(id);return true}
  if(a==='g-edit'){closePop();const g=gById(id);if(!g)return true;modal({type:'goal',id:g.id,vals:{title:g.title,desc:g.desc||'',period:g.period,target:String(targetFor(g,pStart(g.period,today))),subs:(g.subs||[]).map(s=>({...s})),subin:''}});return true}
  if(a==='g-arch-toggle'){S.showArch=!S.showArch;render();return true}
  if(a==='g-menu'){if(S.pop&&S.pop.goal&&S.pop.id===id){closePop();return true}openGoalPop(id,el);return true}
  if(a==='g-tog'){if(S.gOpen.has(id))S.gOpen.delete(id);else S.gOpen.add(id);render();return true}
  if(a==='sec-tog'){const k=el.dataset.k;S.dayUI[k]=!S.dayUI[k];S.dayUI.manual=true;applyDayUI();return true}
  if(a==='g-remove'||a==='g-archive'||a==='g-restore'){closePop();const g=gById(id);if(!g)return true;
    if(a==='g-remove'){updGoal(id,{removed:true});toast(_('היעד הוסר מהיעדים הפעילים. המשימות וההיסטוריה נשמרו.'))}
    else if(a==='g-archive'){updGoal(id,{archived:true});toast(_('היעד הועבר לארכיון. המשימות וההיסטוריה נשמרו.'))}
    else{updGoal(id,{archived:false,removed:false});toast(_('היעד חזר ליעדים הפעילים'))}
    render();return true}
  if(a==='g-day'){openDay(el.dataset.d);return true}
  if(a==='g-plan'){
    const gid=el.dataset.gid,sub=el.dataset.sub||'';
    if(el.dataset.day){
      if(S.sel<today){toast(_('אי אפשר לתכנן פעילות ליום שעבר.'));return true}
      planGoalTask(gid,sub,S.sel,'');toast(_('הפעילות נוספה ל־')+dayName(S.sel));return true;
    }
    openDatePicker(today,today,d=>{
      planGoalTask(gid,sub,d,'');
      if(S.view==='month'){S.sel=d;S.month=d.slice(0,7)}
      render();toast(_('הפעילות תוכננה ל־')+dayName(d));
    });
    return true;
  }
  if(a==='g-inc'){addGoalLog(id,today,el.dataset.sub||'','');render();toast(_('נוספה פעילות אחת'));return true}
  if(a==='g-dec'){
    const g=gById(id);if(!g)return true;
    const ps=pStart(g.period,today),pe=pEnd(g.period,ps);
    const l=S.glog.filter(x=>x.goalId===id&&x.date>=ps&&x.date<=pe).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))[0];
    if(!l){toast(_('אין עדכון ידני להסרה בתקופה הזו. פעילות מהיומן מבטלים בסימון המשימה ביומן.'));return true}
    delGoalLog(l.id);render();toast(_('העדכון האחרון הוסר'));return true;
  }
  if(a==='g-addlog'){modal({type:'glog',gid:id,vals:{date:today,sub:'',note:''}});return true}
  if(a==='g-dellog'){modal({type:'gdel',id});return true}
  if(a==='g-dellog-yes'){const i=m&&m.id;closeModal();if(i)delGoalLog(i);render();return true}
  /* חלון יעד */
  if(!m)return false;
  if(a==='g-per'){collectGoalForm();m.vals.period=el.dataset.k;rerenderGoalForm();return true}
  if(a==='g-tm'||a==='g-tp'){collectGoalForm();const n=parseInt(String(m.vals.target).trim(),10);const base=isNaN(n)?1:n;m.vals.target=String(Math.max(1,Math.min(999,base+(a==='g-tp'?1:-1))));rerenderGoalForm();return true}
  if(a==='g-subadd'){if(addSubFromInput()){rerenderGoalForm();const i=$('#g_subin');if(i)i.focus()}return true}
  if(a==='g-subdel'){collectGoalForm();m.vals.subs=m.vals.subs.filter(s=>s.id!==el.dataset.sid);rerenderGoalForm();return true}
  if(a==='gl-date'){collectGoalForm();openDatePicker(m.vals.date,'',d=>{m.vals.date=d;rerenderGoalForm()},todayIL());return true}
  if(a==='gl-sub'){collectGoalForm();m.vals.sub=el.dataset.sid||'';rerenderGoalForm();return true}
  return false;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='g_subin'){e.preventDefault();if(addSubFromInput()){rerenderGoalForm();const i=$('#g_subin');if(i)i.focus()}}
});
/* ===== מסך הגדרות, התנתקות וחידושים (גרסה 0.5) ===== */
/* חידושים: רק יכולות אמיתיות שקיימות בגרסה המותקנת. series = מזהה העדכון; כל סדרה חדשה מתחילה מחדש,
   וסדרה שכבר אושרה לא חוזרת. עדכון קטן בלי חידוש לא מוסיף סדרה ולכן לא מציג כלום. */
const NEWS=[
  {id:'move',series:'0.5',ic:'↔️',t:'העברת משימה',x:'בתפריט ⋮ של משימה במסך היום בחרו "העברה", ואז גררו או הקישו על תאריך בלוח. רק התאריך משתנה.'},
  {id:'more',series:'0.5',ic:'🗓️',t:'כל המשימות ביום',x:'בלחיצה על "עוד" בתא של יום, התא נפתח ומראה את כל המשימות שלו.'},
  {id:'daysec',series:'0.5',ic:'🧩',t:'מסך יום מסודר יותר',x:'"משימות כלליות" ו"יעדים" מתקפלים ונפתחים מהכותרת שלהם, ונפתחים לבד כשמגיעים לסוף הציר.'},
  {id:'goalrow',series:'0.5',ic:'🎯',t:'יעדים קומפקטיים',x:'כל יעד מוצג בשורה אחת. לחיצה פותחת פרטים, ובתפריט ⋮ אפשר לערוך, להסיר מהפעילים או להעביר לארכיון.'},
  {id:'theme',series:'0.5',ic:'🌙',t:'מצב בהיר וכהה',x:'בהגדרות ⚙️ אפשר לבחור בהיר, כהה או אוטומטי לפי המכשיר.'},
  {id:'lang',series:'0.5',ic:'🌐',t:'עברית ואנגלית',x:'בהגדרות ⚙️ אפשר להחליף שפה. המשימות והיעדים שכתבתם לא מתורגמים.'}
];
const NEWS_SERIES=NEWS[NEWS.length-1].series;
function newsLoad(){let n={};try{n=JSON.parse(lsGet('cal.news')||'{}')||{}}catch(e){n={}}if(!n.ack||typeof n.ack!=='object')n.ack={};return n}
function newsSave(n){lsSet('cal.news',JSON.stringify(n))}
function newsSeen(n,it){return (n.ack[it.series]||[]).includes(it.id)}
function newsNext(){const n=newsLoad();return NEWS.filter(i=>i.series===NEWS_SERIES).find(i=>!newsSeen(n,i))||null}
function newsAck(id){
  const n=newsLoad(),it=NEWS.find(i=>i.id===id&&i.series===NEWS_SERIES);if(!it)return;
  const a=n.ack[it.series]||(n.ack[it.series]=[]);if(!a.includes(id))a.push(id);
  newsSave(n);
}
/* פעם אחת בכל פתיחה של האפליקציה (לא בכל מעבר מסך או רענון מסך) מוצג החידוש הבא שעוד לא אושר */
function maybeNews(){
  if(S.newsShown)return;
  if(!S.loaded.t||!S.loaded.s)return;
  S.newsShown=true;
  const it=newsNext();if(!it)return;
  S.news=it.id;renderNews();
}
function renderNews(){
  const root=$('#newsRoot');if(!root)return;
  const it=S.news&&NEWS.find(i=>i.id===S.news&&i.series===NEWS_SERIES);
  if(!it){root.innerHTML='';return}
  root.innerHTML='<div class="newscard" role="status" aria-live="polite"><div class="nic" aria-hidden="true">'+it.ic+'</div><div class="ntx"><b>'+esc(_(it.t))+'</b><span>'+esc(_(it.x))+'</span></div><button type="button" class="nbtn" data-act="news-ok">'+_('הבנתי')+'</button></div>';
}
function settingsClick(a,el,id,e){
  if(a==='news-ok'){newsAck(S.news);S.news=null;renderNews();return true}
  if(a==='set-theme'){setPrefs({theme:el.dataset.v});render();return true}
  if(a==='set-lang'){setPrefs({lang:el.dataset.v});render();renderNews();if(S.modal)renderModal();return true}
  if(a==='logout'){modal({type:'logout'});return true}
  if(a==='logout-yes'){closeModal();if(S.signOut)S.signOut();return true}
  return false;
}
function renderSettings(){
  const u=S.user;
  const acc=u&&u.email?'<div class="srow"><span class="sl">'+_('מחובר כ־')+'</span><span class="sv ltr" id="s_email">'+esc(u.email)+'</span></div>'+(u.name?'<div class="srow"><span class="sl">'+_('שם')+'</span><span class="sv">'+esc(u.name)+'</span></div>':''):'<div class="srow"><span class="sv" id="s_email">'+_('לא מחובר')+'</span></div>';
  const seg=(act,cur,opts)=>'<div class="seg" role="radiogroup">'+opts.map(o=>'<button type="button" role="radio" aria-checked="'+(cur===o[0])+'" class="'+(cur===o[0]?'on':'')+'" data-act="'+act+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
  const n=newsLoad();
  const ser=[...new Set(NEWS.map(i=>i.series))].reverse();
  const news=ser.map(s=>'<h3 class="nver">'+_('גרסה')+' '+esc(s)+'</h3>'+NEWS.filter(i=>i.series===s).map(i=>'<div class="nitem"><span class="nic" aria-hidden="true">'+i.ic+'</span><div><b>'+esc(_(i.t))+'</b><span>'+esc(_(i.x))+'</span></div></div>').join('')).join('');
  void n;
  return '<div class="wrap sset"><div class="dtop"><button type="button" class="tlink" data-act="back">'+_('📅 חזרה ללוח')+'</button></div><h1 class="gtitle">⚙️ '+_('הגדרות')+'</h1>'
   +'<section class="sgrp" aria-labelledby="sg1"><h2 id="sg1">'+_('חשבון')+'</h2>'+acc+'</section>'
   +'<section class="sgrp" aria-labelledby="sg2"><h2 id="sg2">'+_('מראה')+'</h2>'+seg('set-theme',PREFS.theme,[['light','☀️ '+_('בהיר')],['dark','🌙 '+_('כהה')],['auto','🖥️ '+_('אוטומטי')]])+'</section>'
   +'<section class="sgrp" aria-labelledby="sg3"><h2 id="sg3">'+_('שפה')+'</h2>'+seg('set-lang',PREFS.lang,[['he','עברית 🇮🇱'],['en','English 🇬🇧']])+'</section>'
   +'<section class="sgrp" aria-labelledby="sg4"><h2 id="sg4">'+_('התנתקות')+'</h2><button type="button" class="dbtn wide" data-act="logout">'+_('התנתק')+'</button><div class="note">'+_('ההתנתקות לא מוחקת משימות, יעדים או היסטוריה.')+'</div></section>'
   +'<section class="sgrp" aria-labelledby="sg5"><h2 id="sg5">'+_('מה חדש?')+'</h2>'+news+'</section>'
   +'<div class="foot"><div class="ver">'+_('גרסה')+' '+VERSION+'</div></div></div>';
}
/* ===== חיבור ל-Firebase (אותו פרויקט, אוספים: cal_tasks, cal_series) ===== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyBHFzVCyBt05MZ0RdXPNIEJLtd_5b6P9OA",
  authDomain:"task-spaces.firebaseapp.com",
  projectId:"task-spaces",
  storageBucket:"task-spaces.firebasestorage.app",
  messagingSenderId:"516630524613",
  appId:"1:516630524613:web:ce72bf471e519e72af36ac"
};
function makeDb(fs,uid){
  return {
    collection:c=>({onSnapshot:(ok,err)=>FB.onSnapshot(FB.collection(fs,'users',uid,c),sn=>ok({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    doc:p=>{const [c,id]=p.split('/');const r=FB.doc(fs,'users',uid,c,id);return {set:d=>FB.setDoc(r,d),update:d=>FB.updateDoc(r,d),delete:()=>FB.deleteDoc(r)}}
  };
}
function showLogin(msg){$('#login').hidden=false;$('#loginErr').textContent=msg||''}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return _('הכתובת של האתר עדיין לא אושרה ב-Firebase.');if(c==='auth/network-request-failed')return _('אין חיבור לרשת. נסה שוב.');return _('הכניסה נכשלה. נסה שוב.')}
let startedFor=null;
function boot(){
  applyPrefs();route();
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeColor)}catch(e){}
  if(!window.FB){$('#app').innerHTML=('<div class="loading">'+_('לא ניתן לטעון את רכיבי החיבור. רענן את הדף.')+'</div>');return}
  const app=FB.initializeApp(FIREBASE_CONFIG),auth=FB.getAuth(app);
  let fs;try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){fs=FB.initializeFirestore(app,{})}
  /* בלי אינטרנט, בדיקת ה־redirect עלולה להיכשל. אם המשתמש כבר מחובר לא מציגים מסך כניסה */
  FB.getRedirectResult(auth).catch(e=>{if(!auth.currentUser)showLogin(authMsg(e))});
  const provider=new FB.GoogleAuthProvider();
  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    try{await FB.signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await FB.signInWithRedirect(auth,provider)}catch(x){showLogin(authMsg(x))}}
      else if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){}
      else showLogin(authMsg(e));
    }
  });
  S.signOut=async()=>{try{await FB.signOut(auth)}catch(e){}location.reload()};
  FB.onAuthStateChanged(auth,user=>{
    S.user=user?{email:user.email||'',name:user.displayName||''}:null;
    if(S.view==='settings')render();
    if(!user){showLogin();return}
    $('#login').hidden=true;
    if(startedFor===user.uid)return;startedFor=user.uid;
    start(makeDb(fs,user.uid));
  });
}
function start(db){
  S.db=db;
  const bad=()=>{$('#app').innerHTML=('<div class="loading">'+_('אין גישה למסד הנתונים. נסה לרענן או להתחבר מחדש.')+'</div>')};
  db.collection('cal_series').onSnapshot(sn=>{S.series=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.s=true;render();checkSeries()},bad);
  /* יעדים: ההאזנה לא חוסמת את שאר האפליקציה, ושגיאה בה לא דורסת את המסך */
  db.collection('cal_goals').onSnapshot(sn=>{S.goals=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.g=true;render()},e=>{console.error('goals',e);S.loaded.g=true;render()});
  db.collection('cal_goal_log').onSnapshot(sn=>{S.glog=sn.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error('goal log',e));
  db.collection('cal_tasks').onSnapshot(sn=>{S.tasks=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;render();checkSeries();setTimeout(maybeNews,900)},bad);
}
boot();
/* PWA: שומר את קבצי האפליקציה במכשיר כדי שהיא תיפתח גם בלי אינטרנט */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e))});
}
</script></body></html>
