<div class="loginbox" id="login" hidden><div class="lcard"><h1>לוח משימות</h1><p>כדי לראות את המשימות שלך, היכנס עם חשבון Google.</p><button class="pbtn" id="loginBtn" type="button">כניסה עם Google</button><p id="loginErr" role="alert"></p></div></div>
<script src="fb.js"></script>
<script>
'use strict';
/* ===== זמן: כל הלוגיקה לפי שעון ישראל (Asia/Jerusalem), לא לפי אזור הזמן של המכשיר ===== */
const VERSION='0.3';
const TZ='Asia/Jerusalem';
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOWN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DOWS=['א','ב','ג','ד','ה','ו','ש'];
const HALF=48; /* גובה חצי שעה בציר הזמן, בפיקסלים (חייב להיות זהה ל־--half ב־CSS) */
const pad=n=>String(n).padStart(2,'0');
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function ilParts(){const p=_fmt.formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}
const todayIL=()=>ilParts().date;
/* תאריכים הם מחרוזות "YYYY-MM-DD" (תאריך לוח בלבד). חישובים ב-UTC כדי שלא יושפעו משעון המכשיר או משעון קיץ */
const P=s=>s.split('-').map(Number);
const F=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function addDays(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1,d+n));return F(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dowOf(s){const [y,m,d]=P(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addMonths(s,n){const [y,m,d]=P(s);const t=new Date(Date.UTC(y,m-1+n,1));const yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;return F(yy,mm,Math.min(d,dim(yy,mm)))}
const weekEnd=s=>addDays(s,6-dowOf(s));
const monthEnd=s=>{const [y,m]=P(s);return F(y,m,dim(y,m))};
const monthSpanEnd=s=>addDays(addMonths(s,1),-1); /* חודש מלא החל מ־s: מה־8/10 עד ה־7/11 */
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&addDays(s,0)===s;
const dm=s=>{const [,m,d]=P(s);return d+'/'+m};
const dayName=s=>{const [,m,d]=P(s);return d+' ב'+MONTHS[m-1]};
const longDay=s=>DOWN[dowOf(s)]+', '+dayName(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function occurrences(rule,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const ok=rule.type==='daily'||(rule.type==='weekdays'&&rule.days.includes(dowOf(d)))||(rule.type==='monthdays'&&rule.days.includes(+d.slice(8)));if(ok)out.push(d)}return out}
/* משימה כללית (בלי תאריך) אף פעם לא "הוחמצה" */
function status(t,today){if(t.movedTo)return 'moved';if(t.done)return 'done';if(!t.general&&t.date&&t.date<today)return 'missed';return 'open'}
const cmpT=(a,b)=>{const ta=a.time||'99:99',tb=b.time||'99:99';return ta<tb?-1:ta>tb?1:(a.createdAt||0)-(b.createdAt||0)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const floor30=n=>Math.floor(n/30)*30;
const snap30=n=>Math.round(n/30)*30;
/* טווח שעות: endTime קיים רק אם יש שעת התחלה, והוא אחרי ההתחלה. בלי endTime המשימה מוצגת כחצי שעה */
const endMin=t=>{if(!t.time||!t.endTime)return null;const s=toMin(t.time),e=toMin(t.endTime);return e>s?e:null};
const spanOf=t=>{const s=toMin(t.time),e=endMin(t);return [s,Math.max(e!==null?e:s+30,s+30)]};
function parseDateText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2}|\d{4}))?$/.exec(s);if(!m)return '';
  let y=m[3]?+m[3]:+todayIL().slice(0,4);if(m[3]&&m[3].length===2)y+=2000;
  const r=F(y,+m[2],+m[1]);return isDate(r)?r:'';
}
function parseTimeText(s){
  s=(s||'').trim();let m=/^(\d{1,2})[:.](\d{2})$/.exec(s)||/^(\d{2})(\d{2})$/.exec(s);if(!m)return '';
  const h=+m[1],mi=+m[2];return h<24&&mi<60?pad(h)+':'+pad(mi):'';
}

/* ===== תזכורות =====
   מבנה שמור במשימה: reminders=[{t:'before',m:5|15|60},{t:'at',time:'HH:MM'}]
   'before' = לפני שעת המשימה (רק למשימה עם שעה). 'at' = שעה מוחלטת באותו יום.
   האפליקציה הזו לא מפעילה שום התראה. reminderTimes מחזירה את הזמנים המחושבים כדי שגרסת אפליקציה (Capacitor) תוכל לתזמן התראות מקומיות. */
const REM_BEFORE=[5,15,60];
function remList(t){
  const a=Array.isArray(t.reminders)?t.reminders:[];
  return a.filter(r=>r&&((r.t==='before'&&t.time&&REM_BEFORE.includes(r.m))||(r.t==='at'&&/^\d{2}:\d{2}$/.test(r.time||''))));
}
function remSort(a){
  const b=a.filter(r=>r.t==='before').sort((x,y)=>y.m-x.m),c=a.filter(r=>r.t==='at').sort((x,y)=>x.time<y.time?-1:x.time>y.time?1:0);
  return [...b,...c];
}
const remLabel=r=>r.t==='at'?r.time:(r.m===60?'שעה':r.m+' דק׳');
const remText=a=>{const l=remSort(a);return l.length?'🔔 '+l.map(remLabel).join(' · '):''};
function reminderTimes(t){
  if(!t.date)return [];
  return remSort(remList(t)).map(r=>{
    if(r.t==='at')return {date:t.date,time:r.time};
    const n=toMin(t.time)-r.m;
    return n>=0?{date:t.date,time:fromMin(n)}:{date:addDays(t.date,-1),time:fromMin(n+1440)};
  });
}
const sameRem=(a,b)=>JSON.stringify(remSort(a||[]))===JSON.stringify(remSort(b||[]));

const S={db:null,tasks:[],series:[],loaded:{t:false,s:false},view:'month',month:todayIL().slice(0,7),sel:todayIL(),modal:null,pick:null,pop:null,dismissed:new Set(),lastToday:todayIL(),dragging:false,pending:false,autoScroll:false,tlLo:360,lastDay:{d:'',t:0}};

const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function clean(o){const r={};for(const k in o){if(k==='id'||o[k]===undefined)continue;r[k]=o[k]}return r}

function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}

/* ===== שכבת נתונים: מתאימה לעבודה בלי אינטרנט =====
   כל כתיבה היא "שגר ושכח": הכתיבה נרשמת מיד במטמון המקומי של Firestore ומסונכרנת לשרת כשיש חיבור.
   לא מחכים לאישור השרת, ולכן אף פעולה לא נתקעת בלי רשת. עדכונים הם ברמת שדה (update), לא דריסה של כל המסמך.
   מחיקת שדה מתבצעת על ידי כתיבת ערך ריק ('' / false). מזהים של משימות חוזרות קבועים (סדרה_תאריך) כדי שלא ייווצרו כפילויות. */
function bg(fn){
  try{const p=fn();if(p&&p.catch)p.catch(e=>{console.error(e);toast('השינוי לא נשמר. נסה שוב.')})}
  catch(e){console.error(e);toast('השינוי לא נשמר. נסה שוב.')}
}
const dbSet=(c,id,o)=>bg(()=>S.db.doc(c+'/'+id).set(clean(o)));
const dbUpd=(c,id,p)=>bg(()=>S.db.doc(c+'/'+id).update(clean(p)));
const dbDel=(c,id)=>bg(()=>S.db.doc(c+'/'+id).delete());
function updTask(id,p){const t=T(id);if(t)Object.assign(t,p);dbUpd('cal_tasks',id,p)}
function updSeries(id,p){const s=S.series.find(x=>x.id===id);if(s)Object.assign(s,p);dbUpd('cal_series',id,p)}

/* ===== תצוגה: משימה אחת ===== */
function taskHtml(t,today,o){
  o=o||{};
  const st=status(t,today);
  const cls=st==='moved'?'missed':st;
  const glyph=st==='done'?'✓':(st==='missed'||st==='moved')?'✕':'';
  const meta=[];
  if(t.time){
    if(endMin(t)!==null)meta.push('<span class="ltr">'+esc(t.time)+'–'+esc(t.endTime)+'</span>');
    else if(o.blk&&toMin(t.time)%30)meta.push('<span class="ltr">'+esc(t.time)+'</span>');
  }
  if(t.seriesId)meta.push('🔁');
  const rt=remText(remList(t));if(rt)meta.push(esc(rt));
  let m=meta.length?'<div class="meta">'+meta.join(' · ')+'</div>':'';
  if(t.movedTo)m+='<div class="meta bad">הועבר ל־'+dm(t.movedTo)+'</div>';
  if(t.movedFrom)m+='<div class="meta">הועבר מ־'+dm(t.movedFrom)+'</div>';
  const mv=st==='missed'?'<button type="button" class="mvlink" data-act="mv" data-id="'+t.id+'">העבר ליום אחר</button>':'';
  const dis=st==='moved',nar=!!(o.blk&&o.blk.narrow);
  const style=o.blk?' style="top:'+o.blk.top+'px;height:'+o.blk.h+'px;right:'+o.blk.r+'%;width:calc('+o.blk.w+'% - 3px)"':'';
  const bcls=o.blk?' blk'+(o.blk.h<=HALF+1?' one':'')+(o.blk.narrow?' narrow':''):'';
  const hd=o.blk&&!dis?'<i class="hd t" data-h="t" aria-hidden="true"></i><i class="hd b" data-h="b" aria-hidden="true"></i>':'';
  return '<div class="tk '+cls+bcls+'" data-id="'+t.id+'"'+(dis?' data-nodrag="1"':'')+style+'><button type="button" class="chk" data-act="tog" data-id="'+t.id+'" role="checkbox" aria-checked="'+(st==='done')+'" aria-label="סימון '+esc(t.title)+'"'+(dis?' disabled':'')+'><i>'+glyph+'</i></button><div class="tkbody"'+(nar?' data-act="menu" data-id="'+t.id+'"':'')+'><div class="tt">'+esc(t.title)+'</div>'+m+mv+'</div>'+(nar?'':'<button type="button" class="kebab" data-act="menu" data-id="'+t.id+'" aria-label="תפריט משימה">⋮</button>')+hd+'</div>';
}

function summary(list){
  const c=list.filter(t=>!t.movedTo),n=c.length,d=c.filter(t=>t.done).length;
  if(!n)return 'אין משימות';
  return (n===1?'משימה אחת':n+' משימות')+' · '+(d===1?'הושלמה אחת':d+' הושלמו');
}
function generalList(){return S.tasks.filter(t=>t.general).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.createdAt||0)-(b.createdAt||0))}
function genHtml(today,quiet){const g=generalList();return g.length?g.map(t=>taskHtml(t,today)).join(''):(quiet?'':'<div class="none">אין משימות כלליות</div>')}

/* פריסת משימות עם שעה: משימות שחופפות בזמן מוצגות זו לצד זו */
function layoutDay(timed){
  const it=timed.map(t=>{const [s,e]=spanOf(t);return {t,s,e}}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],ce=0,cols=[];
  const flush=()=>{cl.forEach(x=>x.cols=cols.length);out.push(...cl);cl=[];cols=[];ce=0};
  for(const x of it){
    if(cl.length&&x.s>=ce)flush();
    let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}
    cols[c]=x.e;x.col=c;cl.push(x);ce=Math.max(ce,x.e);
  }
  flush();return out;
}
function renderDay(){
  const today=todayIL(),d=S.sel;
  const list=S.tasks.filter(t=>!t.general&&t.date===d).sort(cmpT);
  const timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let lo=360;timed.forEach(t=>{lo=Math.min(lo,Math.floor(toMin(t.time)/60)*60)});
  S.tlLo=lo;
  let lines='';
  for(let mi=lo;mi<1440;mi+=30){
    const s=fromMin(mi),full=mi%60===0;
    lines+='<div class="gline '+(full?'hr':'half')+'" style="top:'+((mi-lo)/30*HALF)+'px"><span class="st">'+s+'</span></div>';
  }
  const blocks=layoutDay(timed).map(x=>taskHtml(x.t,today,{blk:{top:(x.s-lo)/30*HALF+1,h:(x.e-x.s)/30*HALF-2,r:x.col*100/x.cols,w:100/x.cols,narrow:x.cols>=2}})).join('');
  const nt='<div class="nt" id="nt"><div class="ntn" id="ntn" data-drop="none"><div class="nth"><span>ללא שעה</span></div>'+(untimed.length?'<div class="ns">'+untimed.map(t=>taskHtml(t,today)).join('')+'</div>':'<div class="none">אין משימות בלי שעה</div>')+'</div><div class="ngen" id="gen"><div class="nth"><span>📌 משימות כלליות</span><button type="button" class="gbtn sm" data-act="addgen">＋ משימה כללית</button></div><div class="ns">'+genHtml(today,true)+'</div></div></div>';
  return '<div class="wrap"><div class="dtop"><button type="button" class="tlink" data-act="back">📅 חזרה ללוח</button><button type="button" class="pbtn sm" data-act="add">＋ הוסף משימה</button></div><div class="dnav"><button type="button" class="arr" data-act="dprev" aria-label="יום קודם"><span class="ltr">›</span></button><div class="dtitle"><small>'+DOWN[dowOf(d)]+'</small><h1>'+esc(dayName(d))+(d===today?'<span class="tag">היום</span>':'')+'</h1></div><button type="button" class="arr" data-act="dnext" aria-label="יום הבא"><span class="ltr">‹</span></button></div><div class="dsum">'+summary(list)+'</div><div class="tl" id="tl" style="height:'+((1440-lo)/30*HALF)+'px">'+lines+'<div class="lane" id="lane">'+blocks+'</div></div>'+nt+'</div>';
}

function render(){
  if(S.dragging){S.pending=true;return}
  const root=$('#app');
  if(!S.loaded.t||!S.loaded.s){root.innerHTML='<div class="loading">טוען…</div>';return}
  const y=window.scrollY;
  root.innerHTML=S.view==='day'?renderDay():renderMonth();
  if(S.autoScroll&&S.view==='day'){S.autoScroll=false;scrollToRelevant()}else window.scrollTo(0,y);
}
function scrollToRelevant(){
  const first=S.tasks.filter(t=>!t.general&&t.date===S.sel&&t.time).sort(cmpT)[0];
  let m=first?toMin(first.time):null;
  if(m===null){const n=ilParts();m=S.sel===n.date?n.h*60+n.m:8*60}
  const tl=$('#tl');if(!tl)return;
  const y=tl.getBoundingClientRect().top+window.scrollY+Math.max(0,m-S.tlLo)/30*HALF;
  window.scrollTo(0,Math.max(0,y-150));
}

function route(){
  const m=/^#d=(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
  if(m&&isDate(m[1])){if(S.view!=='day')S.autoScroll=true;S.view='day';S.sel=m[1];S.month=m[1].slice(0,7)}

function openDay(d){S.sel=d;S.month=d.slice(0,7);S.autoScroll=true;history.pushState({v:'day'},'','#d='+d);route()}
function stepDay(k){const d=addDays(S.sel,k);history.replaceState({v:'day'},'','#d='+d);S.autoScroll=true;route()}
function backToMonth(){if(history.state&&history.state.v==='day')history.back();else{history.replaceState(null,'',location.pathname+location.search);route()}}
function shiftMonth(k){const mk=addMonths(S.month+'-01',k).slice(0,7);S.month=mk;const t=todayIL();S.sel=t.slice(0,7)===mk?t:mk+'-01';render()}
/* לחיצה על יום בלוח: בחירה וסיכום. לחיצה כפולה (או הקשה כפולה במגע) פותחת את מסך היום */

/* ===== פעולות על נתונים ===== */
const mkInst=(s,d,i,now)=>({title:s.title,time:s.time||'',endTime:s.endTime||'',date:d,done:false,seriesId:s.id,reminders:s.reminders||[],createdAt:now+i});
function createQuick(title,time,date){
  dbSet('cal_tasks',newId(),{title,time:time||'',endTime:'',date,done:false,reminders:[],createdAt:Date.now()});
}
function createGeneral(title){
  dbSet('cal_tasks',newId(),{title,time:'',endTime:'',date:'',general:true,done:false,reminders:[],createdAt:Date.now()});
}
function createTask(v,r){
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'';
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(r.type==='none'){dbSet('cal_tasks',newId(),{title,time,endTime,date:v.date,done:false,reminders,createdAt:Date.now()});return {count:1}}
  const today=todayIL();
  const end=r.type==='monthdays'?monthEnd(today):r.type==='daily'?monthSpanEnd(today):weekEnd(today);
  const rule={type:r.type,days:r.type==='weekdays'?r.wd:r.type==='monthdays'?r.md:[]};
  const dates=occurrences(rule,today,end);
  const sid=newId(),now=Date.now();
  const s={id:sid,title,time,endTime,reminders,type:rule.type,days:rule.days,start:today,through:end,ended:false,createdAt:now};
  dbSet('cal_series',sid,s);
  dates.forEach((d,i)=>dbSet('cal_tasks',sid+'_'+d,mkInst(s,d,i,now)));
  return {count:dates.length,monthly:r.type==='monthdays',daily:r.type==='daily'};
}
function editTask(id,scope,v){
  const t=T(id);if(!t)return;
  if(t.general){updTask(id,{title:v.title.trim()});return}
  const title=v.title.trim(),time=v.time||'',endTime=time?(v.end||''):'';
  const reminders=(v.rem||[]).filter(x=>x.t==='at'||time);
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date&&!x.movedTo);
    list.forEach(x=>updTask(x.id,{title,time,endTime,reminders}));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{title,time,endTime,reminders});
  }else{
    updTask(id,{title,time,endTime,reminders,date:isDate(v.date)?v.date:t.date});
  }
}
function deleteTask(id,scope){
  const t=T(id);if(!t)return;
  if(scope==='from'&&t.seriesId){
    const list=S.tasks.filter(x=>x.seriesId===t.seriesId&&x.date>=t.date);
    const ids=new Set(list.map(x=>x.id));
    S.tasks=S.tasks.filter(x=>!ids.has(x.id));
    list.forEach(x=>dbDel('cal_tasks',x.id));
    if(S.series.find(x=>x.id===t.seriesId))updSeries(t.seriesId,{ended:true});
    return;
  }
  if(t.movedFromId&&T(t.movedFromId))updTask(t.movedFromId,{movedTo:'',movedToId:''});
  if(t.movedToId&&T(t.movedToId))updTask(t.movedToId,{movedFrom:'',movedFromId:''});
  S.tasks=S.tasks.filter(x=>x.id!==id);
  dbDel('cal_tasks',id);
}
function moveTask(id,nd){
  const t=T(id);if(!t)return;
  const nid=newId();
  dbSet('cal_tasks',nid,{title:t.title,time:t.time||'',endTime:t.endTime||'',date:nd,done:false,reminders:t.reminders||[],movedFrom:t.date,movedFromId:t.id,...(t.seriesId?{seriesId:t.seriesId}:{}),createdAt:Date.now()});
  updTask(t.id,{movedTo:nd,movedToId:nid});
}
/* משימות חוזרות נוצרות רק לתקופה הנוכחית (שבוע, חודש או חודש מלא מהיום). בסוף התקופה שואלים אם להמשיך */
const periodEnd=(type,d)=>type==='monthdays'?monthEnd(d):type==='daily'?monthSpanEnd(d):weekEnd(d);
function seriesDue(s,today){return !s.ended&&today>=addDays(s.through,-1)}
function continueSeries(s){
  const today=todayIL();
  const from=addDays(s.through,1)>today?addDays(s.through,1):today;
  const end=periodEnd(s.type,from);
  const dates=occurrences(s,from,end).filter(d=>!T(s.id+'_'+d));
  const now=Date.now();
  /* קודם מעדכנים את סוף התקופה, כדי שהצצת הנתונים שמגיעה בזמן הכתיבה לא תשאל שוב */
  updSeries(s.id,{through:end});
  dates.forEach((d,i)=>dbSet('cal_tasks',s.id+'_'+d,mkInst(s,d,i,now)));
}

  if(S.modal||S.pick||S.dragging||!S.loaded.t||!S.loaded.s)return;
  const today=todayIL();
  const s=S.series.find(x=>seriesDue(x,today)&&!S.dismissed.has(x.id));

/* ===== גרירה =====
   עכבר: גרירה רגילה. מגע: לחיצה ארוכה ואז גרירה.
   ידיות למעלה ולמטה של משימה בציר הזמן: גרירה מיידית (בלי לחיצה ארוכה) שמשנה את שעת ההתחלה או הסיום.
   כל הגרירות נצמדות לחצאי שעה. אחרי שחרור אין שום חלון. */
const DR={on:false,mode:null,kind:'move',id:null,sx:0,sy:0,x:0,y:0,timer:0,ghost:null,raf:0,zone:0,zoneT:0,prop:null,p0:0,fromTl:false};
function dragSrc(e){
  const t=e.target;if(!t.closest)return null;
  const hd=t.closest('.hd');
  if(hd){const tk=hd.closest('.tk');return tk&&tk.dataset.id?{tk,kind:hd.dataset.h==='t'?'rt':'rb'}:null}
  const b=t.closest('.tkbody');if(!b||t.closest('button'))return null;
  const tk=b.closest('.tk');return tk&&tk.dataset.id&&tk.dataset.nodrag!=='1'?{tk,kind:'move'}:null;
}
function minAt(y){const tl=$('#tl');if(!tl)return null;return S.tlLo+(y-tl.getBoundingClientRect().top)/HALF*30}
function proposeMove(t,min){
  const em=t.time?endMin(t):null,dur=em!==null?em-toMin(t.time):0;
  let s;
  if(DR.fromTl&&t.time){const s0=toMin(t.time),delta=min-DR.p0;s=Math.abs(delta)<15?s0:Math.max(0,Math.min(snap30(s0+delta),dur?floor30(1439-dur):1410))}
  else s=Math.max(0,Math.min(floor30(min),dur?floor30(1439-dur):1410));
  return {k:'tl',s,e:dur?s+dur:null};
}
function proposeResize(t,kind,min){
  const [s0,e0]=spanOf(t);
  if(kind==='rb'){let ne=snap30(min);if(ne<s0+30)ne=s0+30;if(ne>1439)ne=1439;return {k:'tl',s:s0,e:ne,same:ne===e0}}
  let ns=snap30(min);ns=Math.max(0,Math.min(ns,e0-30));
  return {k:'tl',s:ns,e:e0,same:ns===s0};
}
function showInd(prop){
  let ind=$('#ind');
  if(!prop||prop.k!=='tl'){if(ind)ind.remove();return}
  const lane=$('#lane');if(!lane)return;
  if(!ind){ind=document.createElement('div');ind.id='ind';ind.className='dind';lane.appendChild(ind)}
  const e=prop.e||prop.s+30;
  ind.style.top=((prop.s-S.tlLo)/30*HALF)+'px';ind.style.height=((e-prop.s)/30*HALF)+'px';
  ind.innerHTML='<span class="ltr">'+fromMin(prop.s)+(prop.e?'–'+fromMin(Math.min(prop.e,1439)):'')+'</span>';
}
function dragStart(x,y){
  const t=T(DR.id);if(!t){DR.mode=null;return}
  DR.on=true;S.dragging=true;document.body.classList.add('dragging');
  const src=document.querySelector('.tk[data-id="'+DR.id+'"]');
  DR.fromTl=!!(src&&src.classList.contains('blk'));
  DR.p0=S.view==='day'?minAt(DR.sy):0;
  DR.prop=null;
  if(src&&DR.kind==='move')src.classList.add('lifted');
  if(DR.kind==='move'){const g=document.createElement('div');g.className='ghost';g.textContent=t.title;document.body.appendChild(g);DR.ghost=g}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  dragMove(x,y);
  const loop=()=>{
    if(!DR.on)return;
    const nt=$('#nt'),boxTop=nt?nt.getBoundingClientRect().top:innerHeight;
    let sp=0,zone=0;
    if(DR.y<90){zone=-1;sp=-Math.ceil((90-DR.y)/90*16)}
    else if(DR.y>boxTop-70&&DR.y<boxTop){zone=1;sp=Math.ceil((DR.y-(boxTop-70))/70*16)}
    const now=performance.now();
    if(zone!==DR.zone){DR.zone=zone;DR.zoneT=now}
    /* גלילה אוטומטית רק אחרי שהאצבע נשארת בקצה רבע שנייה, כדי שלא תתחיל בטעות בזמן שגוררים החוצה מ"ללא שעה" */
    if(sp&&now-DR.zoneT>250){window.scrollBy(0,sp);dragMove(DR.x,DR.y)}
    DR.raf=requestAnimationFrame(loop);
  };
  DR.raf=requestAnimationFrame(loop);
}
function dragMove(x,y){
  DR.x=x;DR.y=y;
  if(DR.ghost)DR.ghost.style.transform='translate('+Math.round(x-30)+'px,'+Math.round(y-26)+'px)';
  const t=T(DR.id);if(!t)return;
  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  let prop=null;
  if(DR.kind==='move'){
    const el=document.elementFromPoint(x,y);
    if(S.view==='month'){
      const c=el&&el.closest?el.closest('.cell[data-d]'):null;
      if(c&&t.general){c.classList.add('over');prop={k:'cell',d:c.dataset.d}}
    }else if(el&&el.closest){
      const nz=el.closest('[data-drop="none"]');
      if(nz){nz.classList.add('over');prop={k:'none'}}
      else if(el.closest('#tl')){const mm=minAt(y);if(mm!==null)prop=proposeMove(t,mm)}
    }
  }else if(S.view==='day'){
    const mm=minAt(y);if(mm!==null)prop=proposeResize(t,DR.kind,mm);
  }
  DR.prop=prop;showInd(prop);
}
function applyDrop(t,prop){
  const today=todayIL();
  const pastBlock=()=>{toast('אי אפשר להוסיף משימה ליום שעבר.')};
  let patch=null;
  if(prop.k==='cell'){
    if(prop.d<today){pastBlock();return}
    patch={general:false,date:prop.d,time:'',endTime:''};S.sel=prop.d;S.month=prop.d.slice(0,7);
    toast('המשימה עברה ל־'+dayName(prop.d));
  }else if(prop.k==='none'){
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:'',endTime:''};toast('המשימה עברה ל־'+dayName(S.sel))}
    else if(t.time)patch={time:'',endTime:''};
  }else if(prop.k==='tl'&&!prop.same){
    const nt=fromMin(prop.s),ne=prop.e?fromMin(Math.min(prop.e,1439)):'';
    if(t.general){if(S.sel<today){pastBlock();return}patch={general:false,date:S.sel,time:nt,endTime:ne};toast('המשימה עברה ל־'+dayName(S.sel))}
    else if(t.time!==nt||(t.endTime||'')!==ne)patch={time:nt,endTime:ne};

function dragEnd(commit){
  if(!DR.on)return;
  cancelAnimationFrame(DR.raf);
  const prop=DR.prop,id=DR.id;
  DR.on=false;S.dragging=false;DR.prop=null;
  document.body.classList.remove('dragging');
  if(DR.ghost){DR.ghost.remove();DR.ghost=null}
  document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));
  const ind=$('#ind');if(ind)ind.remove();
  const t=T(id);
  if(commit&&prop&&t)applyDrop(t,prop);
  S.pending=false;render();
}

  if(e.button!==0)return;const s=dragSrc(e);if(!s)return;

    if(a==='pk-day'){const cb=p.cb,v=el.dataset.d;closePick();cb(v);return}

    if(a==='pk-type'){const v=parseDateText($('#pk_in').value);if(!v){$('#pk_err').textContent='כתוב תאריך כמו 8/10/2026.';return}if(p.min&&v<p.min){$('#pk_err').textContent='אי אפשר לבחור תאריך שעבר.';return}const cb=p.cb;closePick();cb(v);return}
    if(a==='tp-h'){p.h=+el.dataset.v;renderPick(true);return}
    if(a==='tp-m'){p.m=+el.dataset.v;renderPick(true);return}
    if(a==='tp-clear'){const cb=p.cb;closePick();cb('');return}
    if(a==='tp-ok'){
      const typed=$('#tp_in').value.trim();let v=pad(p.h)+':'+pad(p.m);
      if(typed){v=parseTimeText(typed);if(!v){$('#pk_err').textContent='כתוב שעה כמו 18:30.';return}}
      const cb=p.cb;closePick();cb(v);return}
    return;
  }
  if(a==='pop-edit'||a==='pop-del'){
    const pid=S.pop&&S.pop.id;closePop();const t=T(pid);if(!t)return;
    if(a==='pop-edit'){if(t.seriesId)modal({type:'scope',id:t.id,op:'edit'});else editFormOf(t,'one')}
    else{if(t.seriesId)modal({type:'scope',id:t.id,op:'delete'});else modal({type:'confirm',id:t.id})}
    return}
  if(a==='menu'){if(S.pop&&S.pop.id===id){closePop();return}openPop(id,el);return}
  if(a==='mbg'){if(e.target===el)closeModal();return}
  if(a==='mclose'){closeModal();return}
  if(a==='prev'){shiftMonth(-1);return}
  if(a==='next'){shiftMonth(1);return}
  if(a==='today'){const t=todayIL();S.month=t.slice(0,7);S.sel=t;render();return}
  if(a==='day'){dayClick(el.dataset.d);return}
  if(a==='open-day'){openDay(S.sel);return}
  if(a==='back'){backToMonth();return}
  if(a==='dprev'){stepDay(-1);return}
  if(a==='dnext'){stepDay(1);return}
  if(a==='add'){openQuick({date:S.sel});return}
  if(a==='addgen'){openQuick({general:true});return}
  if(a==='tog'){const t=T(id);if(t&&!t.movedTo){updTask(id,{done:!t.done,doneAt:t.done?0:Date.now()});render()}return}
  if(a==='mv'){
    const t=T(id);if(!t)return;
    openDatePicker(todayIL(),todayIL(),nd=>{
      if(nd===t.date){toast('זה היום של המשימה.');return}
      moveTask(id,nd);render();toast('הועבר ל־'+dm(nd));
    });return}
  if(a==='signout'){S.signOut&&S.signOut();return}
  const m=S.modal;if(!m)return;
  if(a==='scope-one'||a==='scope-from'){
    const scope=a==='scope-one'?'one':'from',t=T(m.id);if(!t)return;
    if(m.op==='edit')editFormOf(t,scope);
    else{closeModal();deleteTask(t.id,scope);render()}
    return}
  if(a==='cont-yes'){const sr=S.series.find(x=>x.id===m.sid);closeModal();if(sr)continueSeries(sr);render();checkSeries();return}
  if(a==='cont-no'){const sr=S.series.find(x=>x.id===m.sid);closeModal();if(sr)updSeries(sr.id,{ended:true});render();checkSeries();return}
  if(a==='cont-later'){S.dismissed.add(m.sid);closeModal();checkSeries();return}
  if(a==='del-yes'){const i=m.id;closeModal();deleteTask(i,'one');render();return}
  /* הוספה מהירה */
  if(a==='q-time'){collectForm();openTimePicker(m.vals.time,v=>{m.vals.time=v;rerenderForm()});return}
  if(a==='q-clr'){collectForm();m.vals.time='';rerenderForm();return}
  if(a==='q-more'){collectForm();const v=m.vals;openForm('create',{title:v.title,date:v.date,time:v.time});return}
  /* טופס מלא */
  if(a==='rt'){collectForm();m.rec.type=el.dataset.k;rerenderForm();return}
  if(a==='wd'){collectForm();const i=+el.dataset.i,d=m.rec.wd;m.rec.wd=d.includes(i)?d.filter(x=>x!==i):[...d,i].sort();rerenderForm();return}
  if(a==='md'){collectForm();const i=+el.dataset.n,d=m.rec.md;m.rec.md=d.includes(i)?d.filter(x=>x!==i):[...d,i].sort((x,y)=>x-y);rerenderForm();return}
  const setTime=v=>{const x=m.vals;x.time=v;if(!v){x.end='';x.rem=x.rem.filter(r=>r.t==='at')}else if(x.end&&toMin(x.end)<=toMin(v))x.end='';rerenderForm()};
  if(a==='clr-time'){collectForm();setTime('');return}
  if(a==='open-time'){collectForm();openTimePicker(m.vals.time,setTime);return}
  if(a==='clr-end'){collectForm();m.vals.end='';rerenderForm();return}
  if(a==='open-end'){
    collectForm();
    const def=fromMin(Math.min(1439,toMin(m.vals.time)+60));
    openTimePicker(m.vals.end,v=>{
      if(v&&toMin(v)<=toMin(m.vals.time)){toast('שעת הסיום חייבת להיות אחרי שעת ההתחלה.');return}
      m.vals.end=v;rerenderForm();
    },{def,clear:'ללא טווח',title:'שעת סיום'});return}
  if(a==='open-date'){collectForm();openDatePicker(m.vals.date,m.mode==='create'?todayIL():'',v=>{m.vals.date=v;rerenderForm()});return}
  if(a==='rm0'){collectForm();m.vals.rem=[];rerenderForm();return}
  if(a==='rm'){collectForm();const mm=+el.dataset.m,l=m.vals.rem;m.vals.rem=l.some(r=>r.t==='before'&&r.m===mm)?l.filter(r=>!(r.t==='before'&&r.m===mm)):[...l,{t:'before',m:mm}];rerenderForm();return}
  if(a==='rat'){collectForm();openTimePicker('',v=>{if(v&&!m.vals.rem.some(r=>r.t==='at'&&r.time===v))m.vals.rem.push({t:'at',time:v});rerenderForm()},{clear:null,title:'שעת תזכורת'});return}
  if(a==='rdel'){collectForm();const tm=el.dataset.time;m.vals.rem=m.vals.rem.filter(r=>!(r.t==='at'&&r.time===tm));rerenderForm();return}
});
document.addEventListener('submit',e=>{
  const fid=e.target.id;
  if(fid!=='f_form'&&fid!=='q_form')return;
  e.preventDefault();
  collectForm();
  const m=S.modal,v=m.vals,err=$('#f_err');
  if(!v.title.trim()){err.textContent='כתוב שם למשימה.';return}
  if(fid==='q_form'){
    const title=v.title.trim(),vv={...v};closeModal();
    if(m.general)createGeneral(title);
    else{createQuick(title,vv.time,vv.date);if(S.view==='month'){S.sel=vv.date;S.month=vv.date.slice(0,7)}}
    render();return;
  }
  const r=m.rec,create=m.mode==='create',recurring=create&&r.type!=='none';
  if(!m.general){
    if(!recurring&&m.scope!=='from'&&!isDate(v.date)){err.textContent='בחר תאריך.';return}
    if(v.time&&v.end&&toMin(v.end)<=toMin(v.time)){err.textContent='שעת הסיום חייבת להיות אחרי שעת ההתחלה.';return}
  }
  if(create&&m.general){closeModal();createGeneral(v.title.trim());render();return}
  if(create){
    if(r.type==='weekdays'&&!r.wd.length){err.textContent='בחר לפחות יום אחד בשבוע.';return}
    if(r.type==='monthdays'&&!r.md.length){err.textContent='בחר לפחות יום אחד בחודש.';return}
    const rec={type:r.type,wd:[...r.wd],md:[...r.md]},vv={...v,rem:[...v.rem]};
    closeModal();
    const res=createTask(vv,rec);
    if(rec.type==='none'){S.sel=vv.date;S.month=vv.date.slice(0,7)}
    else if(!res.count)toast(res.monthly?'אין ימים מתאימים עד סוף החודש. המשימה תתחיל בחודש הבא.':'אין ימים מתאימים עד סוף השבוע. המשימה תתחיל בשבוע הבא.');
    render();
  }else{
    const id=m.id,sc=m.scope,vv={...v,rem:[...v.rem]};closeModal();
    editTask(id,sc,vv);
    if(sc!=='from'&&isDate(vv.date)&&S.view==='month'&&!m.general){S.sel=vv.date;S.month=vv.date.slice(0,7)}
    render();
  }
});

function makeDb(fs,uid){
  return {
    collection:c=>({onSnapshot:(ok,err)=>FB.onSnapshot(FB.collection(fs,'users',uid,c),sn=>ok({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    doc:p=>{const [c,id]=p.split('/');const r=FB.doc(fs,'users',uid,c,id);return {set:d=>FB.setDoc(r,d),update:d=>FB.updateDoc(r,d),delete:()=>FB.deleteDoc(r)}}
  };
}
function showLogin(msg){$('#login').hidden=false;$('#loginErr').textContent=msg||''}
function authMsg(e){const c=e&&e.code||'';if(c==='auth/unauthorized-domain')return 'הכתובת של האתר עדיין לא אושרה ב-Firebase.';if(c==='auth/network-request-failed')return 'אין חיבור לרשת. נסה שוב.';return 'הכניסה נכשלה. נסה שוב.'}
let startedFor=null;
function boot(){
  route();
  if(!window.FB){$('#app').innerHTML='<div class="loading">לא ניתן לטעון את רכיבי החיבור. רענן את הדף.</div>';return}
  const app=FB.initializeApp(FIREBASE_CONFIG),auth=FB.getAuth(app);
  let fs;try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){fs=FB.initializeFirestore(app,{})}
  /* בלי אינטרנט, בדיקת ה־redirect עלולה להיכשל. אם המשתמש כבר מחובר לא מציגים מסך כניסה */
  FB.getRedirectResult(auth).catch(e=>{if(!auth.currentUser)showLogin(authMsg(e))});
  const provider=new FB.GoogleAuthProvider();
  $('#loginBtn').addEventListener('click',async()=>{
    $('#loginErr').textContent='';
    try{await FB.signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await FB.signInWithRedirect(auth,provider)}catch(x){showLogin(authMsg(x))}}
      else if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){}
      else showLogin(authMsg(e));
    }
  });
  S.signOut=async()=>{try{await FB.signOut(auth)}catch(e){}location.reload()};
  FB.onAuthStateChanged(auth,user=>{
    if(!user){showLogin();return}
    $('#login').hidden=true;
    if(startedFor===user.uid)return;startedFor=user.uid;
    start(makeDb(fs,user.uid));
  });
}
function start(db){
  S.db=db;
  const bad=()=>{$('#app').innerHTML='<div class="loading">אין גישה למסד הנתונים. נסה לרענן או להתחבר מחדש.</div>'};
  db.collection('cal_series').onSnapshot(sn=>{S.series=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.s=true;render();checkSeries()},bad);
  db.collection('cal_tasks').onSnapshot(sn=>{S.tasks=sn.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;render();checkSeries()},bad);
}
boot();
